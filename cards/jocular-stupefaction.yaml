id: "jocular-stupefaction"
name: "Jocular Stupefaction"
trade: gearsmith
types: [tactic]
set: "Seed Saga"
rarity: uncommon
text: |
  EXTRA COST: Pick a character with COVERT.
  Destroy the character.
  FLIP UP: 3 [E]
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { keyword: covert } } }
      effect: [ destroy: c ]
  - flip_up: { pay: 3, threshold: { elitism: 1 } }
