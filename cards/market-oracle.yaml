id: "market-oracle"
name: "Market Oracle"
trade: banker
types: [character]
subtypes: ["investor", "mau"]
set: "2nd Edition"
rarity: common

cost: 2
threshold: { greed: 1 }
stats: { str: 1, life: 2, spd: 3 }

text: |
  INVEST
  COST: Deplete this card. Pick a non-resource card you control.
  EFFECT: Remove a token from the card.
rules:
  - ability:
      name: Invest
      cost:
        - deplete: self
        - pick: { as: c, from: { card: { controller: you, not_type: resource } } }
      effect: [ tokens: { card: c, remove: 1 } ]
