id: "gargoyle-of-cathedrale-de-mau"
name: "Gargoyle of Cathédrale de Mau"
trade: banker
types: [character]
subtypes: ["dragon", "mau", "gargoyle"]
set: "Holy Heist"
rarity: rare

cost: 6
threshold: { greed: 2 }
stats: { str: 4, life: 4, spd: 0 }

text: |
  EXTRA COST: Your faction loses 3 influence. Draw 3 cards.
  While this card is in your hand and a location you control is being attacked, this card gains tactical.
  NO.
  COST: Discard 2 cards.
  EFFECT: Your faction gains 2 influence. Put this card into its owner's hand.
rules:
  - play:
      cost:
        - lose_influence: { who: you, amount: 3 }
        - draw: 3
  - static:
      zone: hand
      while: { all: [ { in_battle: true }, { your_turn: false }, { not: { attack_target: faction } } ] }
      mods: [ { tactical: true } ]
  - ability:
      name: NO.
      cost: [ discard: 2 ]
      effect:
        - gain_influence: { who: you, amount: 2 }
        - move: { card: self, to: hand }
