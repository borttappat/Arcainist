id: "cute-cutpurse"
name: "Cute Cutpurse"
trade: rogue
types: [character]
subtypes: ["thief"]
set: "2nd Edition"
rarity: uncommon

cost: 4
threshold: { deception: 1 }
stats: { str: 3, life: 2, spd: 3 }

text: |
  While an opponent controls an item, this card cannot be blocked by that player.
  When this card inflicts damage to a faction, pick an item that faction's controller controls if you can. If you do, destroy it.
rules:
  - static:
      while: { exists: { item: { controller: opponent } } }
      mods: [ { cannot_be_blocked: true } ]
  - trigger: { on: damage, source: self, faction: true }
    effect:
      - pick: { as: i, from: { item: { controller: opponent } } }
      - if:
          cond: { defined: i }
          then: [ destroy: i ]
