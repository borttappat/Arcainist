id: "phalludrix-the-impotenator"
name: "Phalludrix, the Impotenator"
trade: warlord
types: [item]
set: "Seed Saga"
rarity: rare

cost: 1
threshold: { rage: 1 }

text: |
  UNIQUE PHALLUDRIX
  When an effect controlled by an opponent causes you to discard any number of cards, you may put them back into your hand.
  EQUIP
  COST: Pick a character. If it is an adriel card then X is 0, otherwise X is 3. Pay X.
  EFFECT: Attach this card to the character.
  The attached character gains 2 strength.
  At the start of each opponent's turn, you may restore the attached character.
rules:
  - unique: Phalludrix
  - trigger: { on: discarded, player: you, by: opponent }
    effect:
      - may:
          prompt: "put the discarded card back into your hand"
          steps: [ move: { card: it, to: hand } ]
  - ability:
      name: Equip
      cost:
        - pick: { as: c, from: { character: any } }
        - if:
            cond: { matches: [ c, { character: { subtype: adriel } } ] }
            then: [ let: { X: 0 } ]
            else: [ let: { X: 3 } ]
        - pay: X
      effect: [ attach: { card: self, to: c } ]
  - static:
      mods: [ { stat: { str: 2 }, target: host } ]
  - trigger: { on: start_of_turn, player: opponent, while: { exists: { character: { host_of: self } } } }
    effect:
      - if:
          cond: { exists: { character: { host_of: self } } }
          then:
            - may: { prompt: "restore the attached character", steps: [ restore: host ] }
