id: burly-assailment
name: "Burly Assailment"
trade: rogue
types: [tactic]
set: "Seed Saga"
rarity: rare

cost: 1
threshold: { deception: 1 }
flip_up: { cost: 1, threshold: { deception: 1 } }

text: |
  EXTRA COST: Reveal a face-down character you control.
  You may deploy the character. Draw a card.
  While this card is in your discard pile, when a card that provides at least [D] enters play under your control, you may pay 2. If you do, put this card into play under your control as a face-down resource.
  FLIP UP: 1 [D]
rules:
  - play:
      cost:
        - pick: { as: c, from: { card: { controller: you, face_down: true, printed_type: character } } }
        - reveal: c
      effect:
        - may: [ play_card: { card: c } ]
        - draw: 1
  - trigger: { on: enters_play, zone: discard, card: { controller: you, provides_at_least: { deception: 1 } } }
    effect:
      - may_pay:
          amount: 2
          prompt: "put Burly Assailment into play as a face-down resource"
          then:
            - put_into_play: { card: self, as: face_down_resource }
