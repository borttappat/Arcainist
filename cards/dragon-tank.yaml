id: "dragon-tank"
name: "Dragon Tank"
trade: warlord
types: [character]
subtypes: ["dragon"]
set: "2nd Edition"
rarity: rare

cost: 12
threshold: { rage: 5 }
stats: { str: 10, life: 10, spd: 4 }

text: |
  At the start of your turn, you may pick a character an opponent controls. If you do, destroy it. Otherwise, destroy this card.
rules:
  - trigger: { on: start_of_turn, player: you }
    effect:
      - pick: { as: c, from: { character: { controller: opponent } }, optional: true, prompt: "Dragon Tank: pick a character to destroy (otherwise Dragon Tank is destroyed)." }
      - if:
          cond: { defined: c }
          then: [ destroy: c ]
          else: [ destroy: self ]
