id: "final-countdown"
name: "Final Countdown"
trade: banker
types: [tactic]
set: "Holy Heist"
rarity: rare
text: |
  EXTRA COST: Deploy this card only during your turn.
  Draw 4 cards. At the start of your opponent's next turn detach up to 3 staple resources you control, a character you control gains 2 life that turn, and restore a character you control.
rules:
  - play:
      timing: { your_turn: true }
      effect:
        - draw: 4
        - create_effect:
            duration: game
            rules:
              - trigger: { on: start_of_turn, player: opponent, once: true }
                effect:
                  - pick: { as: r, from: { resource: { controller: you, staple: true, spent: true } }, count: 3, up_to: true, choose: true, prompt: "Detach up to 3 staple resources you control." }
                  - detach: { card: r }
                  - pick: { as: c, from: { character: { controller: you } }, choose: true, prompt: "A character you control gains 2 life this turn." }
                  - if:
                      cond: { defined: c }
                      then: [ modify: { card: c, stat: life, gain: 2 } ]
                  - pick: { as: e, from: { character: { controller: you } }, choose: true, prompt: "Restore a character you control." }
                  - if:
                      cond: { defined: e }
                      then: [ restore: e ]
