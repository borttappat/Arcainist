id: "enduring-swordsman"
name: "Enduring Swordsman"
trade: warlord
types: [character]
subtypes: ["soldier"]
set: "Seed Saga"
rarity: common

cost: 1
threshold: { rage: 2 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  When this card leaves play, you may pick a character. If you do, inflict 1 damage to it.
rules:
  - trigger: { on: leaves_play, card: self }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ damage: { card: c, amount: 1 } ]
