id: "sudden-osprey"
name: "Sudden Osprey"
trade: rogue
types: [character]
keywords: [tactical]
subtypes: ["beast"]
set: "2nd Edition"
rarity: common
text: |
  TACTICAL
  When this card enters play, you may pick a character. If you do, it gains 1 strength and 1 life this turn.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ create_effect: { duration: turn, mods: [ { stat: { str: 1, life: 1 }, target: c } ] } ]
