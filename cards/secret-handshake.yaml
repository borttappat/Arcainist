id: "secret-handshake"
name: "Secret Handshake"
trade: banker
types: [tactic]
set: "2nd Edition"
rarity: common
text: |
  EXTRA COST: Pick a character.
  This turn, the character gains 4 life. Draw a card.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any } }
      effect:
        - modify: { card: c, stat: life, gain: 4 }
        - draw: 1
