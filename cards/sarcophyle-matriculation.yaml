id: "sarcophyle-matriculation"
name: "Sarcophyle Matriculation"
trade: rogue
types: [tactic]
set: "1st Edition"
rarity: uncommon

cost: 4
threshold: { deception: 2 }

text: |
  EXTRA COST: Deploy this only while you are being attacked. Pick a character an opponent controls.
  If the character would be destroyed during this battle, take control of it instead. Reduce the amount of damage already inflicted to it to 0. It gains the sarcophyle subtype.
rules:
  - play:
      timing: { in_battle: true }
      cost:
        - require: { your_turn: false }
        - pick: { as: c, from: { character: { controller: opponent } } }
      effect:
        - create_effect:
            duration: battle
            rules:
              - replace: { event: destroy, card: c }
                instead:
                  - take_control: { card: it, who: you }
                  - heal: { card: it, all: true }
                  - create_effect: { duration: game, mods: [ { add_subtype: sarcophyle, target: it } ] }
