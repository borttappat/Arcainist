id: "lieutenant-general"
name: "Lieutenant General"
trade: warlord
types: [character]
subtypes: ["soldier"]
set: "1st Edition Part 2"
rarity: uncommon

cost: 4
threshold: { rage: 3 }
stats: { str: 3, life: 4, spd: 3 }

text: |
  When an attacking party is formed including this character, all other soldier characters in that party gain 1 life this turn.
rules:
  - trigger: { on: party_formed, side: attacking, while: { attacking: self } }
    effect:
      - create_effect: { duration: turn, mods: [ { stat: { life: 1 }, target: { character: { attacking: true, subtype: soldier, not_self: true } } } ] }
