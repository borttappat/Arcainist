id: "key-to-the-city"
name: "Key to the City"
trade: banker
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Ungodly Mess"
rarity: uncommon

cost: 0
threshold: { greed: 1 }

text: |
  ATTACH TO CHARACTER
  When the attached character leaves play, you may search your deck for a resource, reveal it, and put it into your hand.
  UNLOCK POTENTIAL: [G]
  COST: Discard this card from your hand. Pay 2.
  EFFECT: Search your deck for a resource with a name you don't control, reveal it, and put it into your hand.
rules:
  - trigger: { on: leaves_play, card: host }
    effect:
      - may:
          - search: { deck: you, for: { resource: any }, reveal: true, to: hand }
  - ability:
      name: Unlock Potential
      threshold: { greed: 1 }
      from: hand
      cost:
        - move: { card: self, to: discard }
        - pay: 2
      effect:
        - search: { deck: you, for: { resource: { name_not_among: { card: { controller: you } } } }, reveal: true, to: hand }
