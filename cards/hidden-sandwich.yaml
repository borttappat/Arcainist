id: hidden-sandwich
name: "Hidden Sandwich"
trade: gearsmith
types: [item]
subtypes: [gear]
set: "2nd Edition"
rarity: common
text: |
  TACTICAL
  ATTACH TO CHARACTER
  If the attached character would be destroyed, destroy this card instead. Reduce the amount of damage already inflicted to the character this turn to 0.
attach_to: character
keywords: [tactical]
rules:
  - replace: { event: destroy, card: { host_of: self } }
    instead:
      - destroy: self
      - heal: { card: it, all: true }
