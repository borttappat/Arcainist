id: "billowing-bouffant"
name: "Billowing Bouffant"
trade: gearsmith
types: [character]
subtypes: ["monstrosity"]
set: "Ungodly Mess"
rarity: uncommon

cost: 6
threshold: { elitism: 1 }
stats: { str: 5, life: 6, spd: 3 }
flip_up: { cost: 6, threshold: { elitism: 1 } }

text: |
  When this card enters play, you may destroy an item.
  FLIP UP: 6 [E]
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may:
          prompt: "destroy an item"
          steps: [ destroy: { from: { item: any }, choose: true } ]
