id: "topplemajig"
name: "Topplemajig"
trade: gearsmith
types: [character]
subtypes: ["majig"]
set: "2nd Edition"
rarity: common
text: |
  While this card is in a battle, all characters in the opposing party lose 1 speed.
rules:
  - static:
      while: { attacking: self }
      mods: [ { stat: { spd: -1 }, target: { character: { blocking: true } } } ]
  - static:
      while: { blocking: self }
      mods: [ { stat: { spd: -1 }, target: { character: { attacking: true } } } ]
