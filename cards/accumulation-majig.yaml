id: "accumulation-majig"
name: "Accumulation Majig"
trade: gearsmith
types: [character]
subtypes: ["majig"]
set: "Shade of the Devoured Emperor"
rarity: common

cost: 4
threshold: { elitism: 1 }
stats: { str: 4, life: 4, spd: 4 }

text: |
  At the start of your turn, you may pay 1 for each token on this card. If you don't, destroy this card.
  At the end of your turn put a token on this card.
  FEED
  COST: Pay 3.
  EFFECT: Remove a token from this card.
rules:
  - trigger: { on: start_of_turn, player: you }
    effect:
      - if:
          cond: { gt: [ { tokens: self }, 0 ] }
          then:
            - may_pay:
                amount: { tokens: self }
                prompt: "keep Accumulation Majig"
                else: [ destroy: self ]
  - trigger: { on: end_of_turn, player: you }
    effect: [ tokens: { card: self, add: 1 } ]
  - ability:
      name: Feed
      cost: [ pay: 3 ]
      effect: [ tokens: { card: self, remove: 1 } ]
