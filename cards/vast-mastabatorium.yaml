id: "vast-mastabatorium"
name: "Vast Mastabatorium"
trade: rogue
types: [location]
set: "Seed Saga"
rarity: rare
text: |
  YOU KNOW YOU WANT TO...
  COST: Use this only 5 times each turn. Pay 1. Inflict 1 damage to your faction.
  EFFECT: Draw a card. At the end of the turn, put a token on this card and an opponent takes control of it.
  SWEET RELEASE
  COST: Pay 2. Remove a token from this card.
  EFFECT: You may play a resource.
rules:
  - ability:
      name: You Know You Want To...
      uses_per_turn: 5
      cost:
        - pay: 1
        - damage: { faction: you, amount: 1 }
      effect:
        - draw: 1
        - create_effect:
            duration: game
            rules:
              - trigger: { on: end_of_turn, player: any, once: true }
                effect:
                  - tokens: { card: self, add: 1 }
                  - take_control: { card: self, who: opponent }
  - ability:
      name: Sweet Release
      cost:
        - pay: 2
        - tokens: { card: self, remove: 1 }
      effect: [ play_resource: { optional: true } ]
