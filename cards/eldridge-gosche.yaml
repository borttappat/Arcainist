id: "eldridge-gosche"
name: "Eldridge Gosche"
trade: arcanist
types: [character]
subtypes: ["ritualist"]
set: "2nd Edition"
rarity: rare

cost: 8
threshold: { obsession: 2 }
stats: { str: 4, life: 5, spd: 3 }

text: |
  UNIQUE ELDRIDGE
  At the start of your turn, you may pick 2 or fewer non-resource cards you control. If you do, put up to 2 tokens divided however you want on those cards.
  EJECT
  COST: Remove 3 tokens from this card. Pick a non-resource card.
  EFFECT: Put the card into its owner's hand.
  DISRUPT
  COST: Remove 3 tokens from this card.
  EFFECT: Look at an opponent's hand and choose a card in it. That player discards that card.
rules:
  - unique: Eldridge
  - trigger: { on: start_of_turn, player: you }
    effect:
      - pick: { as: c, from: { card: { controller: you, not_type: resource } }, count: 2, up_to: true }
      - if:
          cond: { defined: c }
          then: [ distribute_tokens: { total: 2, from: c } ]
  - ability:
      name: Eject
      cost:
        - tokens: { card: self, remove: 3 }
        - pick: { as: c, from: { card: { not_type: resource } } }
      effect: [ move: { card: c, to: hand } ]
  - ability:
      name: Disrupt
      cost: [ tokens: { card: self, remove: 3 } ]
      effect:
        - reveal_hand: opponent
        - pick: { as: c, from: { card: { zone: hand, owner: opponent } }, choose: true }
        - discard: { who: opponent, cards: c }
