id: "needless-beating"
name: "Needless Beating"
trade: warlord
types: [tactic]
set: "2nd Edition"
rarity: uncommon
text: |
  EXTRA COST: Pick an opponent. Pick a character that player controls.
  Inflict 2 damage to the character. If that player's faction has 15 influence or less, inflict 1 additional damage to the character. If that player's faction has 10 influence or less, inflict 1 damage to each character they control. If that player's faction has 5 influence or less, draw a card.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { controller: opponent } } }
      effect:
        - damage: { card: c, amount: 2 }
        - if:
            cond: { lte: [ { influence: opponent }, 15 ] }
            then: [ damage: { card: c, amount: 1 } ]
        - if:
            cond: { lte: [ { influence: opponent }, 10 ] }
            then: [ damage: { card: { character: { controller: opponent } }, amount: 1 } ]
        - if:
            cond: { lte: [ { influence: opponent }, 5 ] }
            then: [ draw: 1 ]
