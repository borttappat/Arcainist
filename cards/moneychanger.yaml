id: "moneychanger"
name: "Moneychanger"
trade: banker
types: [character]
subtypes: ["investor"]
set: "2nd Edition"
rarity: common

cost: 3
threshold: { greed: 2 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  This card loses 1 strength and 1 life for each token on it.
  EXCHANGE
  COST: Deplete this card. Put a token on this card.
  EFFECT: Draw a card.
rules:
  - static:
      mods: [ { stat: { str: { neg: { tokens: self } }, life: { neg: { tokens: self } } } } ]
  - ability:
      name: Exchange
      cost:
        - deplete: self
        - tokens: { card: self, add: 1 }
      effect: [ draw: 1 ]
