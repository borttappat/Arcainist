id: exploding-sock-puppet
name: "Exploding Sock Puppet!"
trade: gearsmith
types: [tactic]
set: "2nd Edition"
rarity: common
text: |
  EXTRA COST: Your opponents cannot respond to this card. Deploy this only in response to a character's ability.
  Terminate the ability. Destroy the character.
rules:
  - play:
      no_response: true
      timing: { response_to: { ability: { character: any } } }
      effect:
        - destroy: responded
        - terminate: responded
