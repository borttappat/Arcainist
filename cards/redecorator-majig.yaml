id: "redecorator-majig"
name: "Redecorator Majig"
trade: gearsmith
types: [character]
subtypes: ["majig"]
set: "Ungodly Mess"
rarity: uncommon

cost: 5
threshold: { elitism: 2 }
stats: { str: 3, life: 5, spd: 2 }
flip_up: { cost: 4, threshold: { elitism: 3 } }

text: |
  EXTRA COST: You may pick a location and deplete it.
  While this card is in play, the location cannot be restored by its controller's RESTORE RULE.
  While the location is depleted, this card gains 3 strength and 1 life.
  FLIP UP: 4 [E][E][E]
rules:
  - play:
      cost:
        - pick: { as: l, from: { location: { depleted: false } }, optional: true }
        - if:
            cond: { defined: l }
            then: [ deplete: l ]
      effect:
        - if:
            cond: { defined: l }
            then: [ remember: { picked: { var: l } } ]
  - static:
      mods: [ { cannot: restore_by_rule, target: picked } ]
  - static:
      while: { matches: [ picked, { location: { depleted: true } } ] }
      mods: [ { stat: { str: 3, life: 1 } } ]
