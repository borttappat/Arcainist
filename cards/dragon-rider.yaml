id: "dragon-rider"
name: "Dragon Rider"
trade: warlord
types: [character]
subtypes: ["rider"]
set: "2nd Edition"
rarity: uncommon

cost: 5
threshold: { rage: 2 }
stats: { str: 3, life: 3, spd: 3 }

text: |
  This card gains 1 strength and 1 life for each dragon card you control.
rules:
  - static:
      mods: [ { stat: { str: { count: { card: { subtype: dragon, controller: you } } }, life: { count: { card: { subtype: dragon, controller: you } } } } } ]
