id: "heavy-sword"
name: "Heavy Sword"
trade: warlord
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Seed Saga"
rarity: common
text: |
  ATTACH TO CHARACTER
  The attached character gains 2 strength.
  [R][R][R][R]: The attached character gains an additional 2 strength.
  HANDOFF
  COST: Pay 4. Deplete a character you control that is not in a battle.
  EFFECT: Attach this card to the character.
rules:
  - static:
      requires: { rage: 4 }
      mods: [ { stat: { str: 2 }, target: host } ]
  - ability:
      name: Handoff
      cost:
        - pay: 4
        - pick: { as: c, from: { character: { controller: you, attacking: false, blocking: false, depleted: false } }, choose: true, prompt: "Deplete a character you control that is not in a battle." }
        - deplete: c
      effect: [ attach: { card: self, to: c } ]
