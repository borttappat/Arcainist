id: "subversion-matrix"
name: "Subversion Matrix"
trade: gearsmith
types: [item]
attach_to: character
subtypes: ["gear"]
set: "2nd Edition"
rarity: common
text: |
  ATTACH TO CHARACTER
  Treat the attached character as though it has no rules text. (This includes abilities.)
  MOVE
  COST: Pay 2. Pick a character.
  EFFECT: Attach this card to the character.
rules:
  - static:
      mods: [ { no_rules: true, target: host } ]
  - ability:
      name: Move
      cost:
        - pay: 2
        - pick: { as: c, from: { character: any } }
      effect: [ attach: { card: self, to: c } ]
