id: ritual-of-the-shattering-teeth
name: "Ritual of the Shattering Teeth"
trade: arcanist
types: [tactic]
set: "2nd Edition"
rarity: rare

cost: 0
threshold: { obsession: 3 }

text: |
  EXTRA COST: Choose a number for X. Pay X+X.
  Look at an opponent's hand and choose X or fewer cards in it. That player discards those cards.
rules:
  - play:
      cost:
        - choose_number: { as: X }
        - pay: "X + X"
      effect:
        - reveal_hand: opponent
        - pick: { as: d, from: { card: { zone: hand, owner: opponent } }, count: X, up_to: true, choose: true }
        - discard: { who: opponent, cards: d }
