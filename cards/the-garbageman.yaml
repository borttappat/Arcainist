id: "the-garbageman"
name: "The Garbageman"
trade: banker
types: [character]
subtypes: ["lackey", "mau"]
set: "2nd Edition"
rarity: rare

cost: 2
threshold: { greed: 2 }
stats: { str: 1, life: 3, spd: 3 }

text: |
  This card can attack only once each turn.
  SIFT
  COST: Deplete this card.
  EFFECT: Draw a card. Discard a card.
  RUMMAGE
  COST: Pay 2. Remove 3 cards in your discard pile from the game.
  EFFECT: Restore this card.
rules:
  - static:
      mods: [ { attack_limit: 1 } ]
  - ability:
      name: Sift
      cost: [ deplete: self ]
      effect: [ draw: 1, discard: 1 ]
  - ability:
      name: Rummage
      cost:
        - pay: 2
        - pick: { as: d, from: { card: { zone: discard, owner: you } }, count: 3, exactly: true, choose: true, prompt: "Remove 3 cards in your discard pile from the game." }
        - move: { card: d, to: void }
      effect: [ restore: self ]
