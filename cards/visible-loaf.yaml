id: "visible-loaf"
name: "Visible Loaf"
trade: gearsmith
types: [item]
set: "Holy Heist"
rarity: uncommon
text: |
  This card enters play with 3 tokens on it.
  DEFLECT
  COST: Pay 3. Remove a token from this card and deplete it. Pick a character.
  EFFECT: This turn, the next time damage would be inflicted to the character, reduce it to 0.
enters_with_tokens: 3
rules:
  - ability:
      name: Deflect
      cost:
        - pay: 3
        - tokens: { card: self, remove: 1 }
        - deplete: self
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: next, mods: [ { damage: { set: 0 }, target: c } ] }
