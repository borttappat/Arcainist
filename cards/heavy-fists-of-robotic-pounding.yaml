id: "heavy-fists-of-robotic-pounding"
name: "Heavy Fists of Robotic Pounding"
trade: gearsmith
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Holy Heist"
rarity: common

cost: 5
threshold: { elitism: 1 }
gear: { str: 3, life: 3 }

text: |
  ATTACH TO CHARACTER
  The attached character gains 3 strength and 3 life.
  Treat the attached character as though it has no rules text. (This includes abilities.)
  HAND OFF
  COST: Pay 2. Deplete a character you control that is not in a battle.
  EFFECT: Attach this card to the character.
rules:
  - static:
      mods: [ { no_rules: true, target: host } ]
  - ability:
      name: Hand Off
      cost:
        - pay: 2
        - pick: { as: c, from: { character: { controller: you, attacking: false, blocking: false, depleted: false } }, choose: true, prompt: "Deplete a character you control that is not in a battle." }
        - deplete: c
      effect: [ attach: { card: self, to: c } ]
