id: "improved-micromajig"
name: "Improved Micromajig"
trade: gearsmith
types: [character]
subtypes: ["majig"]
set: "Holy Heist"
rarity: rare

cost: 2
threshold: { elitism: 2 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  This card gains 1 strength and 1 life for each token on it.
  ASSEMBLE
  COST: Pay 2. Destroy a Micromajig token you control.
  EFFECT: Put a token on this card.
  DETACH
  COST: Pay 2. Remove a token from this card.
  EFFECT: Put a Micromajig token into play under your control.
rules:
  - static:
      mods: [ { stat: { str: { tokens: self }, life: { tokens: self } } } ]
  - ability:
      name: Assemble
      cost:
        - pay: 2
        - destroy: { from: { character: { controller: you, name: Micromajig Token } }, choose: true }
      effect: [ tokens: { card: self, add: 1 } ]
  - ability:
      name: Detach
      cost:
        - pay: 2
        - tokens: { card: self, remove: 1 }
      effect: [ create_token: { card: micromajig-token } ]
