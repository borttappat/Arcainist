id: fornicaves
name: Fornicaves
flavor_title: totally a thing
trade: rogue
types: [location]
set: "Seed 3"
rarity: fixed
text: |
  UNIQUE FORNICAVES
  All characters lose X life, where X is their printed life minus 2.
rules:
  - unique: Fornicaves
  - static:
      mods:
        # "lose X life, where X is their printed life minus 2" (X below 0 counts as 0)
        - { stat: { life: "-max(0, printed.life - 2)" }, target: { character: any } }
