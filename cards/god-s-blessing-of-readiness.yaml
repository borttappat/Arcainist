id: "god-s-blessing-of-readiness"
name: "God's Blessing of Readiness"
trade: gearsmith
types: [tactic]
attach_to: character
subtypes: ["mutation"]
set: "Ungodly Mess"
rarity: rare

cost: 6
threshold: { elitism: 3 }

text: |
  UNIQUE BLESSING
  ATTACH TO CHARACTER
  The attached character gains the following rules text: "All your characters lose 1 strength and gain 1 life.
  At the start of each opponent's turn, you may restore all characters you control."
rules:
  - unique: Blessing
  - static:
      mods:
        - grant_rules:
            - static: { mods: [ { stat: { str: -1, life: 1 }, target: { character: { controller: you } } } ] }
            - trigger: { on: start_of_turn, player: opponent }
              effect:
                - may:
                    prompt: "restore all characters you control"
                    steps: [ restore: { character: { controller: you } } ]
          target: host
