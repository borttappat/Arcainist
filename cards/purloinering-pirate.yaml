id: "purloinering-pirate"
name: "Purloinering Pirate"
trade: banker
types: [character]
subtypes: ["pirate"]
set: "Shade of the Devoured Emperor"
rarity: uncommon

cost: 3
threshold: { greed: 1 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  This card gains 1 strength and 1 life for each token on it.
  PUSH OVERBOARD AND LOOT
  COST: Pay 1. Destroy a character you own.
  EFFECT: Put a token on this card.
rules:
  - static:
      mods: [ { stat: { str: { tokens: self }, life: { tokens: self } } } ]
  - ability:
      name: Push Overboard and Loot
      cost:
        - pay: 1
        - destroy: { from: { character: { owner: you } }, choose: true }
      effect: [ tokens: { card: self, add: 1 } ]
