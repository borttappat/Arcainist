id: "bladefist-doomwing"
name: "Bladefist Doomwing"
trade: warlord
types: [character]
subtypes: ["dragon"]
set: "2nd Edition"
rarity: rare

cost: 9
threshold: { rage: 2 }
stats: { str: 6, life: 6, spd: 3 }

text: |
  UNIQUE BLADEFIST
  FIREBREATHING
  COST: Choose a number for X. Pay X+X. Deplete this card. Pick a character.
  EFFECT: Inflict X damage to the character.
rules:
  - unique: Bladefist
  - ability:
      name: Firebreathing
      cost:
        - choose_number: { as: X, min: 0 }
        - pay: "X + X"
        - deplete: self
        - pick: { as: c, from: { character: any } }
      effect:
        - damage: { card: c, amount: X }
