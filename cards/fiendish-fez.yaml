id: "fiendish-fez"
name: "Fiendish Fez"
trade: arcanist
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Seed Saga"
rarity: common

cost: 3
threshold: { obsession: 1 }

text: |
  ATTACH TO CHARACTER
  The attached character loses 2 strength and cannot attack.
  MOVE
  COST: Use this only not during a battle. Pay 3. Pick a character.
  EFFECT: Attach this card to the character.
rules:
  - static:
      mods:
        - { stat: { str: -2 }, target: host }
        - { cannot: attack, target: host }
  - ability:
      name: Move
      timing: { not_in_battle: true }
      cost:
        - pay: 3
        - pick: { as: c, from: { character: any } }
      effect: [ attach: { card: self, to: c } ]
