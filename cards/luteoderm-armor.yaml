id: "luteoderm-armor"
name: "Luteoderm Armor"
trade: gearsmith
types: [item]
attach_to: character
subtypes: ["gear"]
set: "1st Edition"
rarity: common
text: |
  ATTACH TO CHARACTER
  The attached character gains 2 strength and 2 life.
  HANDOFF
  COST: Pay 3. Deplete a character you control that is not in a battle.
  EFFECT: Attach this card to the character.
rules:
  - ability:
      name: Handoff
      cost:
        - pay: 3
        - pick: { as: c, from: { character: { controller: you, attacking: false, blocking: false, depleted: false } }, choose: true, prompt: "Deplete a character you control that is not in a battle." }
        - deplete: c
      effect: [ attach: { card: self, to: c } ]
