id: the-billionaire
name: "The Billionaire"
trade: rogue
types: [character]
subtypes: [pluck, grifter]
set: "2nd Edition"
rarity: rare
text: |
  UNIQUE PLUCK
  You may use abilities on your opponent's cards, but you must pay any numeric cost with your own resources. Any additional costs must be satisfied as though your opponent is using the ability. The ability's effect happens as if your opponent used it.
  CHANGE COSTUME
  COST: Pay 3. Shuffle this card into its owner's deck.
  EFFECT: Search your deck for a pluck card with a different name than this card and reveal it. Put it into play under your control.
rules:
  - unique: Pluck
  - static: { mods: [ { use_opponent_abilities: true } ] }
  - ability:
      name: Change Costume
      cost:
        - pay: 3
        - move: { card: self, to: deck_shuffle }
      effect:
        - search: { deck: you, for: { card: { subtype: pluck, name_not: "The Billionaire" } }, to: play }
