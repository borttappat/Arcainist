id: "drowned-catacombs"
name: "Drowned Catacombs"
trade: none
types: [faction]
set: "Seed Saga"
text: |
  STARTING RESOURCES: 1 Deception, 1 staple resource
  STARTING DRAW: 8 going first, 9 going second
  RESTORE RULE: At the start of your turn, restore all your depleted cards and detach all resources from your faction.
  DEVELOP RULE: At the start of your turn, draw a card or play a resource.
  DRAW
  COST: Pay 3.
  EFFECT: Draw a card.
  RESOURCE
  COST: Pay 4.
  EFFECT: Play a resource.
  SNEAK
  COST: X is the number of characters your opponent controls. Pay X. Pick a character with X strength or less.
  EFFECT: This turn, the character gains COVERT.
restore_rule:
  - restore_all_depleted: you
  - detach_all_resources: you
develop_rule:
  - choose_one:
      - draw: 1
      - play_resource: 1
rules:
  - ability: { name: Draw, cost: [ pay: 3 ], effect: [ draw: 1 ] }
  - ability: { name: Resource, cost: [ pay: 4 ], effect: [ play_resource: 1 ] }
  - ability:
      name: Sneak
      cost:
        - let: { X: { count: { character: { controller: opponent } } } }
        - pay: X
        - pick: { as: c, from: { character: { str_lte: X } } }
      effect:
        - create_effect: { duration: turn, mods: [ { keyword: covert, target: c } ] }
