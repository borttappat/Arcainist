id: "harbinger-of-anguish"
name: "Harbinger of Anguish"
trade: rogue
types: [character]
subtypes: ["teller"]
set: "Seed Saga"
rarity: common
text: |
  DEMOTIVATE
  COST: Pay 1. Deplete this card. Pick a character.
  EFFECT: This turn, the character loses 1 life.
rules:
  - ability:
      name: Demotivate
      cost:
        - pay: 1
        - deplete: self
        - pick: { as: c, from: { character: any } }
      effect: [ modify: { card: c, stat: life, lose: 1 } ]
