id: "pride-of-goru-goru-gidea"
name: "Pride of Goru-Goru Gidea"
trade: banker
types: [character]
subtypes: ["ghost", "vehicle"]
set: "Ungodly Mess"
rarity: rare
text: |
  RESIST
  COST: Pay 1. Your faction loses 1 influence.
  EFFECT: Reduce the next damage inflicted to this card this turn by 1.
  DISAPPEAR
  COST: Pay 2.
  EFFECT: This turn, this card gains covert.
rules:
  - ability:
      name: Resist
      cost:
        - pay: 1
        - lose_influence: { who: you, amount: 1 }
      effect:
        - create_effect: { duration: next, mods: [ { damage: { delta: -1 } } ] }
  - ability:
      name: Disappear
      cost: [ pay: 2 ]
      effect:
        - create_effect: { duration: turn, mods: [ { keyword: covert } ] }
