id: "epiphany-ball"
name: "Epiphany Ball"
trade: gearsmith
types: [item]
set: "2nd Edition"
rarity: rare
text: |
  SUDDEN INSIGHT
  COST: Deplete this card.
  EFFECT: Search your deck for a card. Put it into your hand. An opponent takes control of this card.
rules:
  - ability:
      name: Sudden Insight
      cost: [ deplete: self ]
      effect:
        - search: { deck: you, for: { card: any }, to: hand }
        - take_control: { card: self, who: opponent }
