id: "hall-of-conventions"
name: "Hall of Conventions"
trade: gearsmith
types: [location]
set: "Seed Saga"
rarity: rare
text: |
  UNIQUE HALL OF CONVENTIONS
  [E][E][E]: At the start of your turn, reduce the next numeric cost you pay this turn by 1.
  [E][E][E][E][E]: At the start of your turn, you may pick a character. If you do, it gains 2 strength and 2 life this turn.
  [E][E][E][E][E][E][E]: At the start of your turn, you may play a resource.
rules:
  - unique: Hall of Conventions
  - trigger: { on: start_of_turn, player: you, requires: { elitism: 3 } }
    effect:
      - create_effect: { duration: next, mods: [ { cost: -1, applies: any, by: you, target: all } ] }
  - trigger: { on: start_of_turn, player: you, requires: { elitism: 5 } }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ create_effect: { duration: turn, mods: [ { stat: { str: 2, life: 2 }, target: c } ] } ]
  - trigger: { on: start_of_turn, player: you, requires: { elitism: 7 } }
    effect: [ play_resource: { optional: true } ]
