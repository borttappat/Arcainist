id: "maladjustment"
name: "Maladjustment"
trade: arcanist
types: [tactic]
set: "2nd Edition"
rarity: uncommon

cost: 1
threshold: { obsession: 1 }

text: |
  EXTRA COST: Pick a resource you control. (You can pick face-down resources.)
  Put the resource into its owner's hand. You may play a resource.
rules:
  - play:
      cost:
        - pick: { as: r, from: { resource: { controller: you } } }
      effect:
        - move: { card: r, to: hand }
        - play_resource: { optional: true }
