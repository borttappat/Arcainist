id: "runic-whale"
name: "Runic Whale"
trade: gearsmith
types: [character]
subtypes: ["golem"]
set: "Seed Saga"
rarity: rare

cost: 5
threshold: { elitism: 3 }
stats: { str: 5, life: 5, spd: 3 }

text: |
  When this card enters play, you may pay 3. If you do, put a token on it.
  While there is a token on this card, it gains 4 strength and 4 life.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may_pay:
          amount: 3
          prompt: "put a token on Runic Whale"
          then: [ tokens: { card: self, add: 1 } ]
  - static:
      while: { gt: [ { tokens: self }, 0 ] }
      mods: [ { stat: { str: 4, life: 4 } } ]
