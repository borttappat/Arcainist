id: eccentric-inquisition
name: "Eccentric Inquisition"
trade: arcanist
types: [tactic]
set: "2nd Edition"
rarity: rare

cost: 2
threshold: { obsession: 4 }

text: |
  Reveal the top 7 cards of an opponent's deck. Put all tactics revealed this way into the void. Put the remaining cards on the bottom of that player's deck in any order. For the rest of the game, you may deploy tactics voided by this card as though they were in your hand without meeting their threshold.
rules:
  - play:
      effect:
        - reveal_top: { who: opponent, count: 7, as: rev }
        - void: { card: { tactic: { zone: deck, among: rev } }, tag: true }
        - move: { card: { card: { zone: deck, among: rev } }, to: deck_bottom, silent: true }
        - create_effect:
            duration: game
            mods:
              - { play_from: { ignore_threshold: true }, target: { tactic: { zone: void, tagged_by: self } } }
