id: eccentric-inquisition
name: "Eccentric Inquisition"
trade: arcanist
types: [tactic]
cost: 2
threshold: { obsession: 3 }
text: |
  Reveal the top 7 cards of your opponent's deck. Remove all revealed tactics from the game and put the remaining cards on the bottom of your opponent's deck in any order. For the rest of the game, you may play tactics removed from the game by this card as though they were in your hand and without having the proper resource icons.
rules:
  - play:
      effect:
        - reveal_top: { who: opponent, count: 7, as: rev }
        - void: { card: { tactic: { zone: deck, among: rev } }, tag: true }
        - move: { card: { card: { zone: deck, among: rev } }, to: deck_bottom, silent: true }
        - create_effect:
            duration: game
            mods:
              - { play_from: { ignore_threshold: true }, target: { tactic: { zone: void, tagged_by: self } } }
