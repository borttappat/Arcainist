id: "martial-arts-wannabe"
name: "Martial Arts Wannabe"
trade: rogue
types: [character]
subtypes: ["martial artist"]
set: "Shade of the Devoured Emperor"
rarity: uncommon

cost: 1
threshold: { deception: 2 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  While you control more characters than any opponent, this card cannot be picked.
rules:
  - static:
      while: { gt: [ { count: { character: { controller: you } } }, { count: { character: { controller: opponent } } } ] }
      mods: [ { cannot: pick } ]
