id: "prime-titan"
name: "Prime Titan"
trade: gearsmith
types: [character]
subtypes: ["warmachine"]
set: "Holy Heist"
rarity: rare

cost: 6
threshold: { elitism: 2 }
stats: { str: 4, life: 4, spd: 4 }

text: |
  UNIQUE PT
  This card gains 1 strength and 1 life for each token on it.
  MICROMAJIG LOAD
  COST: Pay 1. Destroy a Micromajig token you control.
  EFFECT: Put a token on this card.
  MICROMAJIG UNLOAD: [E][E][E][E][E]
  COST: Deplete this card. Remove X tokens from this card. Pay X. Pick a location, character or faction.
  EFFECT: Inflict X damage to that card.
rules:
  - unique: PT
  - static:
      mods: [ { stat: { str: { tokens: self }, life: { tokens: self } } } ]
  - ability:
      name: Micromajig Load
      cost:
        - pay: 1
        - destroy: { from: { character: { controller: you, token: true } }, choose: true }
      effect: [ tokens: { card: self, add: 1 } ]
  - ability:
      name: Micromajig Unload
      threshold: { elitism: 5 }
      cost:
        - deplete: self
        - choose_number: { as: X, min: 0, max: { tokens: self } }
        - tokens: { card: self, remove: X }
        - pay: X
        - pick: { as: c, from: [ { location: any }, { character: any }, { faction: any } ] }
      effect: [ damage: { card: c, amount: X } ]
