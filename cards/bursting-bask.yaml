id: "bursting-bask"
name: "Bursting Bask"
trade: warlord
types: [character]
subtypes: ["dragon"]
set: "Ungodly Mess"
rarity: common
text: |
  [R][R][R][R][R][R]: When this card enters play, you may pick a character. If you do, inflict 5 damage to it.
  FLIP UP: 4 [R][R][R]
rules:
  - trigger: { on: enters_play, card: self, requires: { rage: 6 } }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ damage: { card: c, amount: 5 } ]
  - flip_up: { pay: 4, threshold: { rage: 3 } }
