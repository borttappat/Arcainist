id: "underpaid-ancestor"
name: "Underpaid Ancestor"
trade: banker
types: [character]
subtypes: ["ghost", "mau"]
set: "Seed Saga"
rarity: common

cost: 5
threshold: { greed: 1 }
stats: { str: 3, life: 4, spd: 2 }

text: |
  When this card is put into your discard pile from play, you may pay 3. If you do, put it into play under your control. Deplete it.
rules:
  - trigger: { on: moved, card: self, from: play, to: discard, zone: discard }
    effect:
      - may_pay:
          amount: 3
          prompt: "put Underpaid Ancestor back into play, depleted"
          then:
            - put_into_play: { card: self, controller: you }
            - deplete: self
