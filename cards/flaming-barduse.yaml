id: "flaming-barduse"
name: "Flaming Barduse"
trade: warlord
types: [character]
subtypes: ["dragon"]
set: "2nd Edition"
rarity: common

cost: 3
threshold: { rage: 2 }
stats: { str: 1, life: 1, spd: 2 }

text: |
  EXTRA COST: You may pick 2 or fewer characters.
  When this card enters play, if you picked characters as part of its cost, inflict up to 2 damage divided however you want to those characters.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any }, count: 2, up_to: true }
      effect:
        - if:
            cond: { defined: c }
            then: [ divide_damage: { amount: 2, from: c, up_to: true } ]
