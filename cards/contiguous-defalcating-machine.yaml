id: "contiguous-defalcating-machine"
name: "Contiguous Defalcating Machine"
trade: arcanist
types: [item]
set: "Shade of the Devoured Emperor"
rarity: rare
text: |
  UNIQUE CONTIGUOUS DEFALCATING MACHINE
  When a character enters play, its controller must choose one of the following:
  OPTION 1
  Put a resource they control into its owners's hand.
  OPTION 2
  Destroy that character.
  OPTION 3
  Their faction loses 3 influence.
rules:
  - unique: Contiguous Defalcating Machine
  - trigger: { on: enters_play, card: { character: any }, player: any }
    effect:
      - as:
          who: { controller_of: it }
          steps:
            - choose_one:
                - label: "Put a resource you control into its owner's hand"
                  when: { exists: { resource: { controller: you } } }
                  steps:
                    - pick: { as: r, from: { resource: { controller: you } }, choose: true }
                    - move: { card: r, to: hand }
                - { label: "Destroy that character", steps: [ destroy: it ] }
                - { label: "Your faction loses 3 influence", steps: [ lose_influence: { who: you, amount: 3 } ] }
