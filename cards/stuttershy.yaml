id: "stuttershy"
name: "Stuttershy"
trade: gearsmith
types: [character]
subtypes: ["horsemajig"]
set: "Shade of the Devoured Emperor"
rarity: uncommon
text: |
  If this card would be destroyed, flip it face-down under its owner's control instead.
  When this card is flipped down, each opponent's faction gains 1 influence and you may put a Micromajig token into play under your control for each influence gained this way.
rules:
  - replace: { event: destroy, card: self }
    instead: [ flip_face_down: { card: self, controller: owner } ]
  - trigger: { on: flipped_down, card: self }
    effect:
      - gain_influence: { who: opponent, amount: 1 }
      - may:
          prompt: "put a Micromajig token into play under your control"
          steps: [ create_token: { card: micromajig-token } ]
