id: stolen-inspiration
name: "Stolen Inspiration"
trade: arcanist
types: [tactic]
set: "2nd Edition"
rarity: common
text: |
  Look at an opponent's hand and choose a non-resource card in it. That player discards that card. You may deploy a non-resource card with numeric cost X or less for free, where X is half the numeric cost of the discarded card, rounded up. (You still need to meet its threshold and satisfy its extra costs.)
rules:
  - play:
      effect:
        - reveal_hand: opponent
        - pick: { as: d, from: { card: { zone: hand, owner: opponent, not_type: resource } } }
        - discard: { who: opponent, cards: d }
        - let: { X: { half_up: { cost: d } } }
        - may:
            prompt: "play a non-resource card with numeric cost X or less for free"
            steps:
              - pick: { as: c, from: { card: { zone: hand, owner: you, not_type: resource, cost_lte: X } }, choose: true }
              - play_card: { card: c, free: true }
