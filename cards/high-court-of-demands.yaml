id: "high-court-of-demands"
name: "High Court of Demands"
trade: banker
types: [location]
set: "Seed Saga"
rarity: uncommon
text: |
  When this card enters play, draw a card.
  Your opponents cannot attack your faction.
rules:
  - trigger: { on: enters_play, card: self }
    effect: [ draw: 1 ]
  - static:
      mods: [ { cannot: attack_faction, by: opponent, target: all } ]
