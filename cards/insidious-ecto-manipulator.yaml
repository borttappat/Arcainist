id: "insidious-ecto-manipulator"
name: "Insidious Ecto-Manipulator"
trade: arcanist
types: [character]
keywords: [covert]
subtypes: ["ecto-manipulator"]
set: "2nd Edition"
rarity: uncommon

cost: 4
threshold: { obsession: 2 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  COVERT
  At the start of your turn, you may pick a non-resource card you control. If you do, put a token on it.
rules:
  - trigger: { on: start_of_turn, player: you }
    effect:
      - pick: { as: c, from: { card: { controller: you, not_type: resource } }, optional: true }
      - if:
          cond: { defined: c }
          then: [ tokens: { card: c, add: 1 } ]
