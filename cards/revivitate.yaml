id: revivitate
name: "Revivitate"
trade: banker
types: [tactic]
text: |
  COST - Play this only during your turn. Pick 2 characters in your discard pile.
  EFFECT - Put 1 of the characters into play under your control and 1 into your hand.
rules:
  - play:
      timing: { your_turn: true }
      cost:
        - pick: { as: cs, from: { character: { zone: discard, owner: you } }, count: 2, exactly: true }
      effect:
        - pick: { as: one, from: cs, choose: true, prompt: "Revivitate: choose the character to put into play (the other goes to your hand)." }
        - put_into_play: { card: one }
        - move: { card: { character: { zone: discard, among: cs } }, to: hand }
