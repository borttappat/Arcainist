id: "mirthless-altar"
name: "Mirthless Altar"
trade: arcanist
types: [location]
set: "Seed Saga"
rarity: uncommon

cost: 2
threshold: { obsession: 2 }
structure: 3

text: |
  At the start of each player's turn, you may pick a character. If you do, it loses 1 strength this turn.
rules:
  - trigger: { on: start_of_turn, player: any }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ modify: { card: c, stat: str, lose: 1 } ]
