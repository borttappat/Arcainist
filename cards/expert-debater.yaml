id: "expert-debater"
name: "Expert Debater"
trade: banker
types: [character]
subtypes: ["politician"]
set: "Ungodly Mess"
rarity: uncommon
text: |
  This card loses 1 life for each token on it.
  If battle damage would be inflicted to this card while it's blocking, add that many tokens to this card instead.
  RECUR: [G][G]
  COST: Use this only if this card is in your discard pile. Pay 1. Remove this card from the game. Pick a character.
  EFFECT: Remove a token from the card.
rules:
  - static:
      mods:
        - { stat: { life: { neg: { tokens: self } } } }
        - { damage_as_tokens: { battle: true }, while: { blocking: self } }
  - ability:
      name: Recur
      keyword: recur
      threshold: { greed: 2 }
      from: discard
      cost:
        - pay: 1
        - void: self
        - pick: { as: c, from: { character: any } }
      effect: [ tokens: { card: c, remove: 1 } ]
