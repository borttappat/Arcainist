id: meat-of-the-mountain
name: "Meat of the Mountain"
trade: arcanist
types: [item]
cost: 2
threshold: { obsession: 2 }
text: |
  If a player draws any number of cards, that player may add or remove a token from this card. If they do, generate the effect which corresponds to the new number of tokens on this card:
  0 TOKENS - That player's opponent discards a card.
  1 TOKEN - That player may look at the top 2 cards of their deck. If they do, they put 1 into their hand and 1 on the bottom of their deck.
  2 TOKENS - That player may pick a character or location. If they do, put it into its owner's hand.
  AT LEAST 3 TOKENS - That player may play a resource.
rules:
  - trigger: { on: draw, player: any }
    effect:
      - as:
          who: player
          steps:
            - choose_one:
                options:
                  - label: "Add a token to Meat of the Mountain"
                    steps: [ tokens: { card: self, add: 1 }, let: { mm: 1 } ]
                  - label: "Remove a token from Meat of the Mountain"
                    steps: [ tokens: { card: self, remove: 1 }, let: { mm: 1 } ]
                  - label: "Do nothing"
                    steps: [ let: { mm: 0 } ]
            - if:
                cond: { all: [ { eq: [ mm, 1 ] }, { eq: [ { tokens: self }, 0 ] } ] }
                then: [ discard: { who: opponent, count: 1 } ]
            - if:
                cond: { all: [ { eq: [ mm, 1 ] }, { eq: [ { tokens: self }, 1 ] } ] }
                then: [ may: [ look: { deck: you, count: 2, to_hand: 1, bottom: rest } ] ]
            - if:
                cond: { all: [ { eq: [ mm, 1 ] }, { eq: [ { tokens: self }, 2 ] } ] }
                then:
                  - pick: { as: c, from: [ { character: any }, { location: any } ], optional: true }
                  - move: { card: c, to: hand }
            - if:
                cond: { all: [ { eq: [ mm, 1 ] }, { gte: [ { tokens: self }, 3 ] } ] }
                then: [ play_resource: { optional: true } ]
