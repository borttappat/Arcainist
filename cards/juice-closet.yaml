id: "juice-closet"
name: "Juice Closet"
trade: warlord
types: [item]
set: "Shade of the Devoured Emperor"
rarity: common
text: |
  At the start of your turn you may pick a character. If you do, that character gains 1 strength this turn.
rules:
  - trigger: { on: start_of_turn, player: you }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ modify: { card: c, stat: str, gain: 1 } ]
