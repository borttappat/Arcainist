id: "greedy-profiteering"
name: "Greedy Profiteering"
trade: banker
types: [resource]
face_down_only: true
set: "Holy Heist"
rarity: uncommon

provides: { greed: 1 }

text: |
  This resource may only be played from your hand face-down.
  PROVIDES: [G]
  FLIP IT: [G]
  COST: Use this only while this card is a face-down resource. Reveal this card. Your faction loses 3 influcence. Pay 4.
  EFFECT: Put this card into play face-up. Put 2 random cards from your discard pile into your hand.
rules:
  - ability:
      name: Flip It
      from: face_down_resource
      threshold: { greed: 1 }
      cost:
        - reveal: self
        - lose_influence: { who: you, amount: 3 }
        - pay: 4
      effect:
        - flip_face_up: self
        - pick: { as: c, from: { card: { zone: discard, owner: you } }, count: 2, random: true, choose: true }
        - move: { card: c, to: hand }
