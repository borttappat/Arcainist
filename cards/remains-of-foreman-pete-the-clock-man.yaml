id: "remains-of-foreman-pete-the-clock-man"
name: "Remains of Foreman Pete, the Clock Man"
trade: universal
types: [item]
set: "Shade of the Devoured Emperor"
rarity: uncommon

cost: 3
threshold: { volition: 2 }

text: |
  UNIQUE FOREMAN PETE
  CLOCK IN: [V][V][V]
  COST: Discard a staple resource. Pay 2.
  EFFECT: Draw a card.
  WORK IT: [V][V]
  COST: Pick a face-down resource you control. Pay 2.
  EFFECT: Put that card into your hand. You may play a resource.
  CLOCK OUT: [V]
  COST: Flip this card face-down under its owner's control.
  EFFECT: Detach a resource from your faction.
rules:
  - unique: Foreman Pete
  - ability:
      name: Clock In
      threshold: { volition: 3 }
      cost:
        - discard: { count: 1, filter: { resource: { staple: true } } }
        - pay: 2
      effect: [ draw: 1 ]
  - ability:
      name: Work It
      threshold: { volition: 2 }
      cost:
        - pick: { as: r, from: { resource: { controller: you, face_down: true } } }
        - pay: 2
      effect:
        - move: { card: r, to: hand }
        - play_resource: { optional: true }
  - ability:
      name: Clock Out
      threshold: { volition: 1 }
      cost: [ flip_face_down: { card: self, controller: owner } ]
      effect: [ detach: { count: 1 } ]
