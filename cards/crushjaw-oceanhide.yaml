id: "crushjaw-oceanhide"
name: "Crushjaw Oceanhide"
trade: gearsmith
types: [character]
keywords: [aggro]
subtypes: ["seraphim", "dragon"]
set: "Seed Saga"
rarity: uncommon

cost: 5
threshold: { elitism: 1 }
stats: { str: 4, life: 4, spd: 3 }

text: |
  AGGRO, UNIQUE OCEANHIDE
  [E][E][E][E][E]: When this card inflicts damage to a faction, this turn, characters you control and deploy gain AGGRO.
rules:
  - unique: Oceanhide
  - trigger: { on: damage, source: self, faction: true, requires: { elitism: 5 } }
    effect:
      - create_effect: { duration: turn, mods: [ { keyword: aggro, target: { character: { controller: you } }, live: true } ] }
