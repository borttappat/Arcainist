id: "mau-strategist"
name: "Mau Strategist"
trade: banker
types: [character]
subtypes: ["mau", "bureaucrat"]
set: "Shade of the Devoured Emperor"
rarity: common

cost: 3
threshold: { greed: 2 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  When this card enters play, you may search your deck for a staple resource, reveal it, and put it into your hand.
  When this card is destroyed, you may draw a card.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may:
          - search: { deck: you, for: { resource: { staple: true } }, reveal: true, to: hand }
  - trigger: { on: destroyed, card: self }
    effect:
      - may: { prompt: "draw a card", steps: [ draw: 1 ] }
