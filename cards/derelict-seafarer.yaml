id: "derelict-seafarer"
name: "Derelict Seafarer"
trade: banker
types: [character]
subtypes: ["pirate", "mercenary", "mau"]
set: "Seed Saga"
rarity: rare

cost: 5
threshold: { greed: 1 }
stats: { str: 4, life: 4, spd: 3 }
flip_up: { cost: 3, threshold: { greed: 1 } }

text: |
  When this card enters play, your faction loses 3 influence. Put a random card from your discard pile into your hand.
  RETIRE: [G][G][G]
  COST: Use this only while this card is not in a battle. Pay 2.
  EFFECT: Flip this card face-down under its owner's control.
  FLIP UP: 3 [G]
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - lose_influence: { who: you, amount: 3 }
      - pick: { as: c, from: { card: { zone: discard, owner: you } }, random: true, choose: true }
      - if:
          cond: { defined: c }
          then: [ move: { card: c, to: hand } ]
  - ability:
      name: Retire
      threshold: { greed: 3 }
      timing: { not_in_battle: true }
      cost: [ pay: 2 ]
      effect:
        - flip_face_down: { card: self, controller: owner }
