id: "jo-ciendeilio-m07h3r-0f-1337"
name: "Jo Ciendeilio, M07h3r 0f 1337"
trade: gearsmith
types: [character]
subtypes: ["jo", "blade of questionable morality"]
set: "Shade of the Devoured Emperor"
rarity: rare

cost: 5
threshold: { elitism: 4 }
stats: { str: 1, life: 2, spd: 3 }

text: |
  UNIQUE JO
  Each character you control gains:
  "RESEARCH
  COST: Use this only if this card has been in play since the start of the turn. Deplete this card.
  EFFECT: Reduce the next numeric cost you pay this turn by 1."
rules:
  - unique: Jo
  - static:
      mods:
        - grant_rules:
            - ability:
                name: Research
                cost:
                  - require: { since_turn_start: self }
                  - deplete: self
                effect:
                  - create_effect: { duration: next, mods: [ { cost: -1, applies: any, by: you, target: all } ] }
          target: { character: { controller: you } }
