id: "securitymajig"
name: "Securitymajig"
trade: gearsmith
types: [character]
subtypes: ["majig"]
set: "2nd Edition"
rarity: uncommon
text: |
  This card can block COVERT parties.
  When this card blocks a COVERT party, it gains 3 strength this turn.
rules:
  - static:
      mods: [ { blocks_any: true } ]
  - trigger: { on: blocks, card: self, while: { covert_party: true } }
    effect:
      - create_effect: { duration: turn, mods: [ { stat: { str: 3 } } ] }
