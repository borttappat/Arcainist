id: "b14nd-p3pp3r"
name: "B14nd P3pp3r"
trade: gearsmith
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Seed Saga"
rarity: common
text: |
  ATTACH TO CHARACTER
  The attached character gains 1 strength and 1 life.
  SPIT OUT
  COST: Destroy this card. Pick a character.
  EFFECT: This turn, the character gains 1 strength and 1 life.
rules:
  - ability:
      name: Spit Out
      cost:
        - destroy: self
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { str: 1, life: 1 }, target: c } ] }
