id: "wild-boars"
name: "Wild Boars"
trade: rogue
types: [character]
subtypes: ["beast"]
set: "2nd Edition"
rarity: uncommon

cost: 4
threshold: { deception: 2 }
stats: { str: 2, life: 2, spd: 4 }

text: |
  While this card is the only member of an attacking party, only characters with at least X speed can block it, where X is this card's speed.
rules:
  - static:
      while: { all: [ { attacking: self }, { eq: [ { count: { character: { attacking: true } } }, 1 ] } ] }
      mods: [ { cannot_be_blocked: { by: { character: { spd_lte: { sum: [ { stat: [ self, spd ] }, -1 ] } } } } } ]
