id: "muscle-tribe-of-danger-and-excellence"
name: "Muscle Tribe of Danger and Excellence"
trade: rogue
types: [character]
subtypes: ["miner"]
set: "Seed Saga"
rarity: common

cost: 2
threshold: { deception: 1 }
stats: { str: 2, life: 1, spd: 4 }

text: |
  When a card that provides at least [D] enters play under your control, this card gains 1 strength and COVERT this turn.
rules:
  - trigger: { on: enters_play, card: { controller: you, provides_at_least: { deception: 1 } } }
    effect:
      - create_effect: { duration: turn, mods: [ { stat: { str: 1 } }, { keyword: covert } ] }
