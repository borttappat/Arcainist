id: "cowering-golem"
name: "Cowering Golem"
trade: gearsmith
types: [character]
subtypes: ["golem"]
set: "Seed Saga"
rarity: uncommon

cost: 4
threshold: { elitism: 1 }
stats: { str: 5, life: 5, spd: 3 }

text: |
  While this card is in a battle, it loses 1 strength and 1 life for each member of the opposing party.
rules:
  - static:
      while: { attacking: self }
      mods: [ { stat: { str: { neg: { count: { character: { blocking: true } } } }, life: { neg: { count: { character: { blocking: true } } } } } } ]
  - static:
      while: { blocking: self }
      mods: [ { stat: { str: { neg: { count: { character: { attacking: true } } } }, life: { neg: { count: { character: { attacking: true } } } } } } ]
