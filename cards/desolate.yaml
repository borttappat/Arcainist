id: "desolate"
name: "Desolate"
trade: arcanist
types: [tactic]
set: "Seed Saga"
rarity: rare

cost: 3
threshold: { obsession: 1 }

text: |
  EXTRA COST: Pick a number for X, where X is less than or equal to the number of [O] you control.
  Destroy all characters with X strength.
rules:
  - play:
      cost:
        - choose_number: { as: X, min: 0, max: { icons: obsession } }
      effect:
        - destroy: { character: { str_lte: X, str_gte: X } }
