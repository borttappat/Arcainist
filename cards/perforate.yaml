id: "perforate"
name: "Perforate"
trade: warlord
types: [tactic]
set: "Seed Saga"
rarity: common

cost: 2
threshold: { rage: 2 }

text: |
  EXTRA COST: Choose a number for X. Pay X. Pick a character.
  Inflict X damage to the character.
rules:
  - play:
      cost:
        - choose_number: { as: X, min: 0, max: { count: { resource: { controller: you, spent: false } } } }
        - pay: X
        - pick: { as: c, from: { character: any } }
      effect: [ damage: { card: c, amount: X } ]
