id: "ritual-of-the-knob-pull"
name: "Ritual of the Knob & Pull"
trade: arcanist
types: [tactic]
set: "2nd Edition"
rarity: common

cost: 3
threshold: { obsession: 2 }

text: |
  EXTRA COST: Pick a character. X is its strength.
  If that character's controller controls at least X face-down resources, destroy the character.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any } }
        - let: { X: { stat: [ c, str ] } }
      effect:
        - as:
            who: { controller_of: c }
            steps:
              - if:
                  cond: { gte: [ { count: { resource: { controller: you, face_down: true } } }, X ] }
                  then: [ destroy: c ]
