id: "thundering-nilpha"
name: "Thundering Nilpha"
trade: warlord
types: [character]
subtypes: ["dragon"]
set: "2nd Edition"
rarity: uncommon

cost: 5
threshold: { rage: 1 }
stats: { str: 4, life: 3, spd: 3 }

text: |
  While this card is attacking a location, it gains 1 strength and cannot be blocked.
rules:
  - static:
      while: { all: [ { attacking: self }, { not: { attack_target: faction } } ] }
      mods:
        - { stat: { str: 1 } }
        - { cannot_be_blocked: true }
