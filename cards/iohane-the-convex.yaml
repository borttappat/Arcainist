id: "iohane-the-convex"
name: "Iohane, the Convex"
trade: rogue
types: [character]
keywords: [tactical]
subtypes: ["iohane", "sword of great justice"]
set: "Seed 3"
rarity: fixed

cost: 1
threshold: { deception: 3 }
stats: { str: 2, life: 2, spd: 4 }

text: |
  TACTICAL, UNIQUE IOHANE
  At the start of your turn, flip a coin. If you win, draw a card.
  SNEAK
  COST: Pay 1.
  EFFECT: This card gains COVERT this turn.
rules:
  - unique: Iohane
  - trigger: { on: start_of_turn, player: you }
    effect:
      - coin_flip: { as: won }
      - if:
          cond: { did: true }
          then: [ draw: 1 ]
  - ability:
      name: Sneak
      cost: [ pay: 1 ]
      effect:
        - create_effect: { duration: turn, mods: [ { keyword: covert } ] }
