id: "hilarious-refrigerator-alarm"
name: "Hilarious Refrigerator Alarm"
trade: gearsmith
types: [tactic]
set: "Seed 3"
rarity: fixed

cost: 2
threshold: { elitism: 2 }
flip_up: { cost: 2, threshold: { elitism: 2 }, steps: [ { play_resource: { optional: true } } ] }

text: |
  All other unresolved cards are terminated.
  If an opponent deployed at least 2 cards with the same name this turn, put up to 2 Micromajig tokens into play under your control. Otherwise, each opponent may put 3 Micromajig tokens into play under their control.
  FLIP UP: 2 [E][E] and you may play a resource.
rules:
  - play:
      effect:
        - terminate: all
        - if:
            cond: { gte: [ { played_this_turn: { by: opponent, not_type: resource, same_name: true } }, 2 ] }
            then:
              - choose_number: { as: X, min: 0, max: 2, prompt: "Put up to 2 Micromajig tokens into play." }
              - create_token: { card: micromajig-token, count: X }
            else:
              - as:
                  who: opponent
                  steps:
                    - may:
                        prompt: "put 3 Micromajig tokens into play under your control"
                        steps: [ create_token: { card: micromajig-token, count: 3 } ]
