id: "penetrate"
name: "Penetrate"
trade: warlord
types: [tactic]
set: "2nd Edition"
rarity: uncommon

cost: 1
threshold: { rage: 2 }

text: |
  EXTRA COST: Pick an attacking character you control.
  If the character would assign battle damage to the blocking party during this battle, assign it to the target of the attack instead.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { controller: you, attacking: true } } }
      effect:
        - create_effect: { duration: battle, mods: [ { assign_to_target: { must: true }, target: c } ] }
