id: "toxic-cultivator"
name: "Toxic Cultivator"
trade: arcanist
types: [character]
subtypes: ["cultivator"]
set: "2nd Edition"
rarity: common

cost: 2
threshold: { obsession: 2 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  While you control an even number of characters, reduce the numeric cost of tactics you deploy by 1, to a minimum of 1.
rules:
  - static:
      while: { even: { count: { character: { controller: you } } } }
      mods: [ { cost: -1, floor: 1, by: you, target: { tactic: { zone: stack } } } ]
