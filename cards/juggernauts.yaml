id: "juggernauts"
name: "Juggernauts"
trade: gearsmith
types: [character]
subtypes: ["vehicle"]
set: "Seed Saga"
rarity: uncommon
text: |
  EXTRA COST: You may pick up to 3 characters you control.
  When this card enters play, if you picked any characters as part of its cost, flip the characters face-down under their owner's control.
  TREK
  COST: Pay 2. Destroy a face-down resource you control.
  EFFECT: Search your deck for a card. Put it into your hand.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { controller: you } }, count: 3, up_to: true }
      effect:
        - if:
            cond: { defined: c }
            then: [ flip_face_down: { card: c, controller: owner } ]
  - ability:
      name: Trek
      cost:
        - pay: 2
        - destroy_resource: { who: you, face_down: true }
      effect:
        - search: { deck: you, for: { card: any }, to: hand }
