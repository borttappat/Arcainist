id: "skewer"
name: "Skewer"
trade: warlord
types: [tactic]
set: "2nd Edition"
rarity: common

cost: 0
threshold: { rage: 1 }

text: |
  EXTRA COST: Choose a number for X. Pay X+X. Pick a character.
  Inflict X damage to the character.
rules:
  - play:
      cost:
        - choose_number: { as: X, min: 0 }
        - pay: "X + X"
        - pick: { as: c, from: { character: any } }
      effect: [ damage: { card: c, amount: X } ]
