id: ass
name: "Ass"
trade: rogue
types: [item]
set: "Seed 2"
rarity: rare

cost: 4
threshold: { deception: 2 }

text: |
  At the end of your turn, an opponent picks a character they control and own if they can. If they do, take control of that character.
  At the end of your turn, an opponent takes control of this card.
rules:
  - trigger: { on: end_of_turn, player: you }
    effect:
      - pick: { as: c, who: opponent, from: { character: { controller: opponent, owner: opponent } } }
      - take_control: { card: c, who: you }
  - trigger: { on: end_of_turn, player: you }
    effect:
      - take_control: { card: self, who: opponent }
