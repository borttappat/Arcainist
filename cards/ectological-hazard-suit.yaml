id: "ectological-hazard-suit"
name: "Ectological Hazard Suit"
trade: arcanist
types: [item]
attach_to: character
subtypes: ["gear"]
set: "2nd Edition"
rarity: common
text: |
  ATTACH TO CHARACTER
  When this card enters play, put a token on the attached character.
  The attached character gains 1 strength and 1 life for each token on it.
  HANDOFF
  COST: Pay 1. Deplete a character you control that is not in a battle.
  EFFECT: Attach this card to the character.
rules:
  - play:
      effect: [ tokens: { card: host, add: 1 } ]
  - static:
      mods: [ { stat: { str: { tokens: host }, life: { tokens: host } }, target: host } ]
  - ability:
      name: Handoff
      cost:
        - pay: 1
        - pick: { as: c, from: { character: { controller: you, attacking: false, blocking: false, depleted: false } }, choose: true, prompt: "Deplete a character you control that is not in a battle." }
        - deplete: c
      effect: [ attach: { card: self, to: c } ]
