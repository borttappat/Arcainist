id: "motivational-dancer"
name: "Motivational Dancer"
trade: banker
types: [character]
subtypes: ["dancer", "mau"]
set: "Holy Heist"
rarity: rare

cost: 3
threshold: { greed: 3 }
stats: { str: 2, life: 1, spd: 3 }

text: |
  At the end of your turn, you may pay 1. If you do, pick a character and deplete it. That character cannot be restored by its controller's faction's next Restore Rule.
  PRIVATE DANCE
  COST: Pay 1. Deplete this card. Pick a character.
  EFFECT: Deplete the card.
  PAY UP
  COST: Pay 1. Inflict 1 damage to your faction. Deplete this card. Pick a depleted character.
  EFFECT: Inflict 1 damage to the character.
rules:
  - trigger: { on: end_of_turn, player: you }
    effect:
      - may_pay:
          amount: 1
          prompt: "pick a character and deplete it (it skips its controller's next Restore Rule)"
          then:
            - pick: { as: c, from: { character: any } }
            - if:
                cond: { defined: c }
                then:
                  - deplete: c
                  - create_effect: { duration: next_restore, who: { controller_of: c }, mods: [ { cannot: restore_by_rule, target: c } ] }
  - ability:
      name: Private Dance
      cost:
        - pay: 1
        - deplete: self
        - pick: { as: c, from: { character: any } }
      effect: [ deplete: c ]
  - ability:
      name: Pay Up
      cost:
        - pay: 1
        - damage: { faction: you, amount: 1 }
        - deplete: self
        - pick: { as: c, from: { character: { depleted: true } } }
      effect: [ damage: { card: c, amount: 1 } ]
