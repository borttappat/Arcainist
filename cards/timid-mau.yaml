id: "timid-mau"
name: "Timid Mau"
trade: banker
types: [character]
subtypes: ["mau"]
set: "Shade of the Devoured Emperor"
rarity: common

cost: 5
threshold: { greed: 2 }
stats: { str: 4, life: 5, spd: 3 }

text: |
  When this card is blocked by an opposing party of 2 or more characters, it loses 1 speed this turn.
rules:
  - trigger: { on: blocked, card: self }
    effect:
      - if:
          cond: { gte: [ { count: { character: { blocking: true } } }, 2 ] }
          then: [ modify: { card: self, stat: spd, lose: 1 } ]
