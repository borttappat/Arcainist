id: "battle-ready-back-breaker"
name: "Battle-Ready Back-Breaker"
trade: warlord
types: [character]
subtypes: ["berserker"]
set: "Shade of the Devoured Emperor"
rarity: common

cost: 4
threshold: { rage: 2 }
stats: { str: 3, life: 2, spd: 3 }

text: |
  When this card enters play you may pick a character. If you do, deplete that character.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ deplete: c ]
