id: "mittens-of-muffled-thought"
name: "Mittens of Muffled Thought"
trade: arcanist
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Shade of the Devoured Emperor"
rarity: common
text: |
  ATTACH TO CHARACTER
  The attached character cannot attack and has no rules text.
  MOVE
  COST: Pick a character that is not in battle. Pay 3.
  EFFECT: Attach this card to the character.
rules:
  - static:
      mods:
        - { cannot: attack, target: host }
        - { no_rules: true, target: host }
  - ability:
      name: Move
      cost:
        - pick: { as: c, from: { character: { attacking: false, blocking: false } } }
        - pay: 3
      effect: [ attach: { card: self, to: c } ]
