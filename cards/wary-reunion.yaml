id: "wary-reunion"
name: "Wary Reunion"
trade: rogue
types: [tactic]
set: "Ungodly Mess"
rarity: uncommon

cost: 1
threshold: { deception: 2 }
flip_up: { cost: 2, threshold: { deception: 1 } }

text: |
  EXTRA COST: Pick a character.
  Remove the character from the game if it has X life or less, where X is the number of different trades among cards you control.
  FLIP UP: 2 [D]
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any } }
      effect:
        - if:
            cond: { lte: [ { stat: [ c, life ] }, { different_trades: you } ] }
            then: [ void: c ]
