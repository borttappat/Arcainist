id: "postmortem-debenture"
name: "Postmortem Debenture"
trade: banker
types: [tactic]
set: "2nd Edition"
rarity: common

cost: 0
threshold: { greed: 1 }

text: |
  EXTRA COST: Pick a character in your discard pile.
  Put the character into your hand.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { zone: discard, owner: you } } }
      effect: [ move: { card: c, to: hand } ]
