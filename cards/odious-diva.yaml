id: odious-diva
name: "Odious Diva"
trade: arcanist
types: [character]
subtypes: [diva]
set: "2nd Edition"
rarity: rare
text: |
  Each opponent's hand is revealed at all times.
  DISAPPROVE
  COST: Pay 2. Name a card.
  EFFECT: Look at an opponent's hand. That player puts a card with the chosen name on the bottom of their deck if they can. If they do, that player draws a card.
rules:
  - static: { mods: [ { reveal_hand: opponent, target: none } ] }
  - ability:
      name: Disapprove
      cost:
        - pay: 2
        - name: { as: n, kind: card }
      effect:
        - reveal_hand: opponent
        - if:
            cond: { exists: { card: { zone: hand, owner: opponent, name: n } } }
            then:
              - as:
                  who: opponent
                  steps:
                    - pick: { as: c, from: { card: { zone: hand, owner: you, name: n } }, choose: true }
                    - move: { card: c, to: deck_bottom }
                    - draw: 1
