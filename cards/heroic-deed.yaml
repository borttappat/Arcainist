id: "heroic-deed"
name: "Heroic Deed"
trade: warlord
types: [tactic]
set: "Seed"
rarity: uncommon

cost: 3
threshold: { rage: 1 }
flip_up: { cost: 9, threshold: { rage: 1 } }

text: |
  EXTRA COST: Pick 2 or fewer characters.
  This turn, the characters cannot block.
  FLIP UP: 9 [R]
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any }, count: 2, up_to: true }
      effect:
        - create_effect: { duration: turn, mods: [ { cannot: block, target: c } ] }
