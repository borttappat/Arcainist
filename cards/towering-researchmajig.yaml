id: "towering-researchmajig"
name: "Towering Researchmajig"
trade: gearsmith
types: [character]
subtypes: ["majig"]
set: "1st Edition"
rarity: uncommon

cost: 7
threshold: { elitism: 2 }
stats: { str: 4, life: 5, spd: 2 }

text: |
  At the start of your turn, you may put a token on this card.
  RESEARCH
  COST: Remove a token from this card.
  EFFECT: Reduce the next numeric cost you pay this turn by 1.
rules:
  - trigger: { on: start_of_turn, player: you }
    effect:
      - may: { prompt: "put a token on Towering Researchmajig", steps: [ tokens: { card: self, add: 1 } ] }
  - ability:
      name: Research
      cost: [ tokens: { card: self, remove: 1 } ]
      effect:
        - create_effect: { duration: next, mods: [ { cost: -1, applies: any, by: you, target: all } ] }
