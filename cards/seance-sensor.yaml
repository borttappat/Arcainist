id: "seance-sensor"
name: "Seance Sensor"
trade: arcanist
types: [item]
set: "Holy Heist"
rarity: uncommon

cost: 2
threshold: { obsession: 2 }

text: |
  This card enters play with 2 tokens on it.
  SEIZE
  COST: Remove a token from this card. Deplete this card. Pick a player.
  EFFECT: That player discards a card.
  ABSORB HUMOUR
  COST: Pay 2. Deplete this card.
  EFFECT: Put a token on this card.
enters_with_tokens: 2
rules:
  - ability:
      name: Seize
      cost:
        - tokens: { card: self, remove: 1 }
        - deplete: self
        - pick: { as: f, from: { faction: any }, choose: true, prompt: "Pick a player." }
      effect: [ discard: { who: { controller_of: f }, count: 1 } ]
  - ability:
      name: Absorb Humour
      cost: [ pay: 2, deplete: self ]
      effect: [ tokens: { card: self, add: 1 } ]
