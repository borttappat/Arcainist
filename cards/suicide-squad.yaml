id: "suicide-squad"
name: "Suicide Squad"
trade: warlord
types: [character]
subtypes: ["soldier"]
set: "2nd Edition"
rarity: uncommon

cost: 4
threshold: { rage: 2 }
stats: { str: 3, life: 1, spd: 3 }

text: |
  ULTIMATE SACRIFICE
  COST: X is this card's strength. Destroy this card. Pick a character.
  EFFECT: Inflict X damage to the character.
rules:
  - ability:
      name: Ultimate Sacrifice
      cost:
        - let: { X: { stat: [ self, str ] } }
        - destroy: self
        - pick: { as: c, from: { character: any } }
      effect: [ damage: { card: c, amount: X } ]
