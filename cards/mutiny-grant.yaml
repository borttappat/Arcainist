id: "mutiny-grant"
name: "Mutiny Grant"
trade: banker
types: [tactic]
set: "2nd Edition"
rarity: uncommon
text: |
  EXTRA COST: Pick a character an opponent controls. Your faction loses X influence, where X is the numeric cost of that character.
  This turn, take control of the character. Restore it.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { controller: opponent } } }
        - lose_influence: { who: you, amount: { cost: c } }
      effect:
        - take_control: { card: c, who: you, duration: turn }
        - restore: c
