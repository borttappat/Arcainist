id: "recycling-scheme-facility"
name: "Recycling Scheme Facility"
trade: banker
types: [location]
set: "Shade of the Devoured Emperor"
rarity: uncommon

cost: 4
threshold: { greed: 2 }
structure: 4

text: |
  When this card enters play, you may draw a card.
  When a character is put into a discard pile, any player may pay 4 to put that card on top of its owner's deck.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may: { prompt: "draw a card", steps: [ draw: 1 ] }
  - trigger: { on: moved, card: { character: { zone: discard } }, to: discard }
    effect:
      - each_player:
          - if:
              cond: { in_zone: [ it, discard ] }
              then:
                - may_pay:
                    amount: 4
                    prompt: "put that character on top of its owner's deck"
                    then: [ move: { card: it, to: deck_top } ]
