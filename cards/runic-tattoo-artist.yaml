id: "runic-tattoo-artist"
name: "Runic Tattoo Artist"
trade: gearsmith
types: [character]
subtypes: ["31f"]
set: "Seed Saga"
rarity: common
text: |
  MARK
  COST: Deplete this card. Pick a character.
  EFFECT: This turn, the character gains 1 strength and 1 life.
rules:
  - ability:
      name: Mark
      cost:
        - deplete: self
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { str: 1, life: 1 }, target: c } ] }
