id: "pantherkaiser"
name: "PantherKaiser"
trade: gearsmith
types: [character]
subtypes: ["kaiser"]
set: "2nd Edition"
rarity: uncommon
text: |
  PANTHER SHIELD
  COST: Pay 2. Deplete this card. Pick a character.
  EFFECT: This turn, the character gains 3 life.
rules:
  - ability:
      name: Panther Shield
      cost:
        - pay: 2
        - deplete: self
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { life: 3 }, target: c } ] }
