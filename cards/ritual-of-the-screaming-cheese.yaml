id: ritual-of-the-screaming-cheese
name: "Ritual of the Screaming Cheese"
trade: arcanist
types: [tactic]
set: "1st Edition"
rarity: common
text: |
  EXTRA COST: Pick an opponent.
  That player chooses one of the following as this card's effect:
  OPTION 1
  That player discards 2 cards.
  OPTION 2
  That player discards a card at random.
rules:
  - play:
      effect:
        - choose_one:
            who: opponent
            options:
              - { label: "Discard 2 cards", steps: [ discard: { who: opponent, count: 2 } ] }
              - { label: "Discard a card at random", steps: [ discard: { who: opponent, count: 1, random: true } ] }
