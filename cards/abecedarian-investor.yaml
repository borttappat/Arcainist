id: "abecedarian-investor"
name: "Abecedarian Investor"
trade: banker
types: [character]
subtypes: ["investor"]
set: "Holy Heist"
rarity: common

cost: 2
threshold: { greed: 1 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  EXTRA COST: You may pick a card.
  When this card enters play, if you picked a card as part of its cost, remove a token from the card.
rules:
  - play:
      cost:
        - pick: { as: c, from: { card: any }, optional: true }
      effect:
        - if:
            cond: { defined: c }
            then: [ tokens: { card: c, remove: 1 } ]
