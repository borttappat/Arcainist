id: "uhluhtc-niudla"
name: "Uhluhtc Niudla"
trade: arcanist
types: [character]
subtypes: ["uhluhtc", "seraphim", "dragon"]
set: "Holy Heist"
rarity: rare

cost: 6
threshold: { obsession: 3 }
stats: { str: 5, life: 4, spd: 3 }

text: |
  UNIQUE UHLUHTC
  PREVAIL UPON
  COST: Put a resource you control into its owner's hand. Pick a player. Pay 1.
  EFFECT: That player puts a face-down resource they control into its owner's hand.
  AVAIL ANEW
  COST: Reveal a resource from your hand and shuffle it into your deck. Pay 1.
  EFFECT: If the revealed card was named "Obsession", this card gains COVERT this turn. Draw a card.
rules:
  - unique: Uhluhtc
  - ability:
      name: Prevail Upon
      cost:
        - pick: { as: r, from: { resource: { controller: you } }, choose: true, prompt: "Put a resource you control into its owner's hand." }
        - move: { card: r, to: hand }
        - pick: { as: f, from: { faction: any }, prompt: "Pick a player." }
        - pay: 1
      effect:
        - as:
            who: { controller_of: f }
            steps:
              - pick: { as: d, from: { resource: { controller: you, face_down: true } }, choose: true, prompt: "Put a face-down resource you control into its owner's hand." }
              - if:
                  cond: { defined: d }
                  then: [ move: { card: d, to: hand } ]
  - ability:
      name: Avail Anew
      cost:
        - pick: { as: r, from: { resource: { zone: hand, owner: you } }, choose: true, prompt: "Reveal a resource from your hand and shuffle it into your deck." }
        - let: { ob: 0 }
        - if:
            cond: { matches: [ r, { resource: { zone: hand, name: Obsession } } ] }
            then: [ let: { ob: 1 } ]
        - reveal: r
        - move: { card: r, to: deck_shuffle }
        - pay: 1
      effect:
        - if:
            cond: { eq: [ ob, 1 ] }
            then: [ create_effect: { duration: turn, mods: [ { keyword: covert } ] } ]
        - draw: 1
