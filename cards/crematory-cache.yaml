id: "crematory-cache"
name: "Crematory Cache"
trade: banker
types: [item]
set: "Holy Heist"
rarity: common

cost: 3
threshold: { greed: 2 }

text: |
  When a character is destroyed, you may gain 1 influence.
rules:
  - trigger: { on: destroyed, card: { character: any }, player: any }
    effect:
      - may:
          prompt: "gain 1 influence"
          steps: [ gain_influence: { who: you, amount: 1 } ]
