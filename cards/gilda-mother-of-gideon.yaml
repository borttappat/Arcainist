id: "gilda-mother-of-gideon"
name: "Gilda, Mother of Gideon"
trade: arcanist
types: [character]
subtypes: ["sorceress"]
set: "Seed Saga"
rarity: uncommon
text: |
  UNIQUE GILDA
  At the start of your turn you may look at the top 2 cards of your deck. You may reveal a tactic among them. If you do, put it into the void. Put the remaining cards on the top of your deck in any order.
  SEDUCTIVE SUMMONS
  COST: Pay 1. Pick a tactic that was voided by this card.
  EFFECT: You may deploy that card.
