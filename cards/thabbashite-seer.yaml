id: "thabbashite-seer"
name: "Thabbashite Seer"
trade: rogue
types: [character]
subtypes: ["teller"]
set: "Ungodly Mess"
rarity: uncommon
text: |
  [D][D][V][V]: When this card enters play, leaves play, attacks, or blocks, you may look at the top card of any deck.
  FLIP UP: 1 [V][V][V][V]
rules:
  - trigger: { on: enters_play, card: self, requires: { deception: 2, volition: 2 } }
    effect: &seer
      - choose_one:
          - { label: "Look at the top card of your deck", steps: [ peek: { who: you, top: 1 } ] }
          - { label: "Look at the top card of your opponent's deck", steps: [ peek: { who: opponent, top: 1 } ] }
          - { label: "Don't look", steps: [] }
  - trigger: { on: leaves_play, card: self, requires: { deception: 2, volition: 2 } }
    effect: *seer
  - trigger: { on: attacks, card: self, requires: { deception: 2, volition: 2 } }
    effect: *seer
  - trigger: { on: blocks, card: self, requires: { deception: 2, volition: 2 } }
    effect: *seer
  - flip_up: { pay: 1, threshold: { volition: 4 } }
