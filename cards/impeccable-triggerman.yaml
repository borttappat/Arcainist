id: "impeccable-triggerman"
name: "Impeccable Triggerman"
trade: rogue
types: [character]
subtypes: ["assassin"]
set: "Holy Heist"
rarity: rare

cost: 4
threshold: { deception: 3 }
stats: { str: 2, life: 1, spd: 3 }

text: |
  This card enters play depleted.
  ASSASSINATE
  COST: Deplete this card. Pick a depleted character.
  EFFECT: If the character has 4 life or less, destroy it.
  RELOAD
  COST: Pay 3.
  EFFECT: Restore this card. This turn, it cannot attack.
enters_depleted: true
rules:
  - ability:
      name: Assassinate
      cost:
        - deplete: self
        - pick: { as: c, from: { character: { depleted: true } } }
      effect:
        - if:
            cond: { lte: [ { stat: [ c, life ] }, 4 ] }
            then: [ destroy: c ]
  - ability:
      name: Reload
      cost: [ pay: 3 ]
      effect:
        - restore: self
        - create_effect: { duration: turn, mods: [ { cannot: attack } ] }
