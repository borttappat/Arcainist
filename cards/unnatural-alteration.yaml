id: "unnatural-alteration"
name: "Unnatural Alteration"
trade: arcanist
types: [tactic]
set: "2nd Edition"
rarity: rare
text: |
  EXTRA COST: Deploy this only during your turn and not during a battle. Pick a character you control.
  Destroy the character if you can. If you do, X is its numeric cost. Search your deck for a character with numeric cost X+3 or less and reveal it. You may deploy it for free. If you don't, put it into your hand.
rules:
  - play:
      timing: { your_turn: true, not_in_battle: true }
      cost:
        - pick: { as: c, from: { character: { controller: you } } }
      effect:
        - destroy: c
        - if:
            cond: { destroyed: c }
            then:
              - let: { X: { cost: c } }
              - search: { deck: you, for: { character: { cost_lte: "X + 3" } }, reveal: true, to: keep, as: found }
              - if:
                  cond: { defined: found }
                  then:
                    - may:
                        prompt: "deploy that card for free (if you don't, put it into your hand)"
                        steps: [ play_card: { card: found, free: true } ]
                        else: [ move: { card: found, to: hand } ]
