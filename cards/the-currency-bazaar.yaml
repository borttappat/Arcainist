id: "the-currency-bazaar"
name: "The Currency Bazaar"
trade: banker
types: [location]
set: "Seed Saga"
rarity: uncommon
text: |
  TRADE
  COST: Pay 1. Discard a resource.
  EFFECT: Search your deck for a staple resource and reveal it. Put it into your hand.
  RECUR: [G]
  COST: Use this only if this card is in your discard pile. Pay 3. Remove this card from the game.
  EFFECT: Search your deck for a card named The Currency Bazaar and reveal it. Put it into your hand.
rules:
  - ability:
      name: Trade
      cost:
        - pay: 1
        - discard: { count: 1, filter: { resource: any } }
      effect:
        - search: { deck: you, for: { resource: { staple: true } }, reveal: true, to: hand }
  - ability:
      name: Recur
      keyword: recur
      threshold: { greed: 1 }
      from: discard
      cost: [ pay: 3, void: self ]
      effect:
        - search: { deck: you, for: { card: { name: The Currency Bazaar } }, reveal: true, to: hand }
