id: "summary-judgment"
name: "Summary Judgment"
trade: banker
types: [tactic]
set: "2nd Edition"
rarity: uncommon
text: |
  EXTRA COST: Pick a character an opponent controls. X is its strength.
  That character's controller may destroy the character. If they don't, draw X cards.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { controller: opponent } } }
        - let: { X: { stat: [ c, str ] } }
      effect:
        - may:
            who: opponent
            prompt: "destroy your character (if you don't, Summary Judgment's controller draws X cards)"
            steps: [ destroy: c ]
            else: [ draw: X ]
