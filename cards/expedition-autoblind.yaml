id: expedition-autoblind
name: "Expedition AutoBlind"
trade: rogue
types: [item]
text: |
  HUNKER
  DOWN
  COST - Pay 1. Deplete this card. Pick a character or tactic in a discard pile.
  EFFECT - Remove that card from the game. Draw a card, then put a card from your hand on the bottom of your deck.
  BUY TIME [D][D][D]
  COST - Pay 1.
  EFFECT - Restore this card.
  FLIP UP - 1 [D].
rules:
  - ability:
      name: Hunker Down
      cost:
        - pay: 1
        - deplete: self
        - pick: { as: c, from: [ { character: { zone: discard } }, { tactic: { zone: discard } } ] }
      effect:
        - void: c
        - draw: 1
        - pick: { as: b, from: { card: { zone: hand, owner: you } }, choose: true, prompt: "Put a card from your hand on the bottom of your deck." }
        - move: { card: b, to: deck_bottom, silent: true }
  - ability:
      name: Buy Time
      threshold: { deception: 3 }
      cost: [ pay: 1 ]
      effect: [ restore: self ]
  - flip_up: { pay: 1, threshold: { deception: 1 } }
