id: "enormous-and-uncooperative-golem"
name: "Enormous and Uncooperative Golem"
trade: gearsmith
types: [character]
subtypes: ["golem"]
set: "Seed Saga"
rarity: common

cost: 1
threshold: { elitism: 2 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  EXTRA COST: Choose a number for X. Pay X.
  This card enters play with X tokens on it.
  At the start of your turn, remove a token from this card.
  While there is a token on this card, it gains 5 strength and 5 life.
enters_with_tokens: X
rules:
  - play:
      cost: [ choose_number: { as: X, min: 0 }, pay: X ]
  - trigger: { on: start_of_turn, player: you }
    effect: [ tokens: { card: self, remove: 1 } ]
  - static:
      while: { gt: [ { tokens: self }, 0 ] }
      mods: [ { stat: { str: 5, life: 5 } } ]
