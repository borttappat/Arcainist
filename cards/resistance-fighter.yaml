id: "resistance-fighter"
name: "Resistance Fighter"
trade: rogue
types: [character]
subtypes: ["miner"]
set: "Seed Saga"
rarity: common

cost: 1
threshold: { deception: 1 }
stats: { str: 1, life: 1, spd: 3 }
provides: { deception: 1 }

text: |
  PROVIDES: [D]
  While you control a character you don't own, this card gains 2 strength, 2 life, and 1 speed.
rules:
  - static:
      while: { exists: { character: { controller: you, owner: opponent } } }
      mods: [ { stat: { str: 2, life: 2, spd: 1 } } ]
