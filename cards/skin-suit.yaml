id: skin-suit
name: "Skin Suit"
trade: warlord
types: [tactic]
cost: 2
text: |
  COST - Pick a character you control. X is that character's strength. Pick a character your opponent controls. Y is that character's strength.
  EFFECT - Inflict X damage to your opponent's character. Inflict Y damage to your character. If only 1 of the characters is destroyed by this damage, remove it from the game instead. For the rest of the game, the surviving character has all rules text of the removed character in addition to its own rules text.
rules:
  - play:
      cost:
        - pick: { as: mine, from: { character: { controller: you } } }
        - pick: { as: theirs, from: { character: { controller: opponent } } }
      effect:
        - let: { X: { stat: [ mine, str ] }, Y: { stat: [ theirs, str ] } }
        - damage: { card: theirs, amount: X }
        - damage: { card: mine, amount: Y }
        - script: skin_suit
