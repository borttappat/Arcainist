id: "inadequate-wand"
name: "Inadequate Wand"
trade: arcanist
types: [item]
set: "Seed Saga"
rarity: uncommon
text: |
  PRESENT THE STAFF
  COST: Pay 2. Deplete this card. Pick a character you control.
  EFFECT: Put the character into its owner's hand if you can. If you do, X is its numeric cost. You may search your deck for a tactic with numeric cost X or less and reveal it. If you do, put it into your hand.
rules:
  - ability:
      name: Present the Staff
      cost:
        - pay: 2
        - deplete: self
        - pick: { as: c, from: { character: { controller: you } } }
      effect:
        - move: { card: c, to: hand }
        - if:
            cond: { in_zone: [ c, hand ] }
            then:
              - let: { X: { cost: c } }
              - may:
                  - search: { deck: you, for: { tactic: { cost_lte: X } }, reveal: true, to: hand }
