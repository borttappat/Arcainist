id: "seraphim-magic"
name: "Seraphim Magic"
trade: warlord
types: [tactic]
set: "Seed Saga"
rarity: common
text: |
  EXTRA COST: Pick a character.
  This turn, the character gains 3 strength. Draw a card.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any } }
      effect:
        - modify: { card: c, stat: str, gain: 3 }
        - draw: 1
