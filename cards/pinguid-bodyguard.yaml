id: "pinguid-bodyguard"
name: "Pinguid Bodyguard"
trade: banker
types: [character]
subtypes: ["mercenary", "mau"]
set: "Shade of the Devoured Emperor"
rarity: uncommon
text: |
  When this card attacks, restore it at the end of the battle.
  This card can only attack once each turn.
  PROTECT
  COST: Deplete this card. Pick a character.
  EFFECT: This turn, the character gains 2 life.
rules:
  - static:
      mods: [ { attack_limit: 1 } ]
  - trigger: { on: attacks, card: self }
    effect:
      - create_effect:
          duration: turn
          rules:
            - trigger: { on: battle_end, once: true }
              effect: [ restore: self ]
  - ability:
      name: Protect
      cost:
        - deplete: self
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { life: 2 }, target: c } ] }
