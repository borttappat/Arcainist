id: "elbow-dropper"
name: "Elbow Dropper"
trade: warlord
types: [character]
subtypes: ["fighter"]
set: "2nd Edition"
rarity: uncommon

cost: 4
threshold: { rage: 2 }
stats: { str: 3, life: 2, spd: 3 }

text: |
  OFF THE TOP ROPE
  COST: Deplete this card. Pick a character.
  EFFECT: This turn, the character cannot block.
rules:
  - ability:
      name: Off the Top Rope
      cost:
        - deplete: self
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { cannot: block, target: c } ] }
