id: "axeclaw-grandchest"
name: "Axeclaw Grandchest"
trade: rogue
types: [character]
subtypes: ["grandchest", "seraphim", "dragon"]
set: "Seed 3"
rarity: fixed

cost: 4
threshold: { deception: 3 }
stats: { str: 0, life: 4, spd: 4 }

text: |
  UNIQUE GRANDCHEST
  The top card of your deck is revealed at all times.
  While the top card of your deck is revealed, this card gains X strength, where X is the numeric cost of that card.
  SHAKE UP
  COST: Pay 2.
  EFFECT: Shuffle your deck.
rules:
  - unique: Grandchest
  - static:
      mods:
        - { reveal_top: you, target: none }
        - { stat: { str: { cost: top_of_you } } }
  - ability:
      name: Shake Up
      cost: [ pay: 2 ]
      effect: [ shuffle: you ]
