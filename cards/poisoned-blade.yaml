id: "poisoned-blade"
name: "Poisoned Blade"
trade: rogue
types: [item]
attach_to: character
subtypes: ["gear"]
set: "2nd Edition"
rarity: common

cost: 3
threshold: { deception: 1 }

text: |
  ATTACH TO CHARACTER
  When the attached character inflicts damage to a character, destroy the damaged character.
  HANDOFF
  COST: Deplete a character you control that is not in a battle.
  EFFECT: Attach this card to the character.
rules:
  - trigger: { on: damage, source: host, card: { character: any } }
    effect: [ destroy: it ]
  - ability:
      name: Handoff
      cost:
        - pick: { as: c, from: { character: { controller: you, attacking: false, blocking: false, depleted: false } }, choose: true, prompt: "Deplete a character you control that is not in a battle." }
        - deplete: c
      effect: [ attach: { card: self, to: c } ]
