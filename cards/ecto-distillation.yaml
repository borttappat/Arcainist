id: ecto-distillation
name: "Ecto-Distillation"
trade: arcanist
types: [tactic]
set: "2nd Edition"
rarity: rare
text: |
  EXTRA COST: Name a card.
  Search your deck for any number of copies of the card and reveal them. Put 1 into your hand and the rest into your discard pile. An opponent may search your deck for any number of copies of the card. If they do, put them into your discard pile.
rules:
  - play:
      cost:
        - name: { as: n, kind: card }
      effect:
        - search: { deck: you, for: { card: { name: n } }, count: any, reveal: true, to: keep, as: copies }
        - pick: { as: one, from: copies, choose: true, prompt: "Ecto-Distillation: put one copy into your hand." }
        - move: { card: one, to: hand }
        - move: { card: { card: { zone: deck, among: copies } }, to: discard }
        - as:
            who: opponent
            steps:
              - may:
                  - search: { deck: opponent, for: { card: { name: n } }, count: any, to: discard }
