id: "camouflaged-urchin"
name: "Camouflaged Urchin"
trade: rogue
types: [character]
subtypes: ["martial artist"]
set: "Ungodly Mess"
rarity: common
text: |
  While this card is depleted, your opponents cannot pick this card.
  FLIP UP:1 [D]
rules:
  - static:
      while: { matches: [ self, { character: { depleted: true } } ] }
      mods: [ { cannot: pick, by: opponent } ]
  - flip_up: { pay: 1, threshold: { deception: 1 } }
