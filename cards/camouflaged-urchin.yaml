id: "camouflaged-urchin"
name: "Camouflaged Urchin"
trade: rogue
types: [character]
subtypes: ["martial artist"]
set: "Ungodly Mess"
rarity: common

cost: 2
threshold: { deception: 1 }
stats: { str: 1, life: 1, spd: 4 }
flip_up: { cost: 1, threshold: { deception: 1 } }

