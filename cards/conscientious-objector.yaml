id: "conscientious-objector"
name: "Conscientious Objector"
trade: warlord
types: [character]
keywords: [tactical]
subtypes: ["pacifist"]
set: "Seed Saga"
rarity: rare

cost: 2
threshold: { rage: 2 }
stats: { str: 6, life: 6, spd: 3 }
flip_up: { cost: 2, threshold: { rage: 2 } }

text: |
  TACTICAL
  EXTRA COST: Pick a location you control.
  While the picked location is in play, this card cannot attack or block.
  FLIP UP: 2 [R][R]
rules:
  - play:
      cost:
        - pick: { as: l, from: { location: { controller: you } } }
      effect:
        - create_effect:
            duration: game
            mods:
              - { cannot: attack, while: { in_play: l } }
              - { cannot: block, while: { in_play: l } }
            rules:
              - trigger: { on: leaves_play, card: self, player: any, once: true }
                effect: [ clear_effects: self ]
