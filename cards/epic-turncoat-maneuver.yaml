id: "epic-turncoat-maneuver"
name: "Epic Turncoat Maneuver"
trade: rogue
types: [tactic]
set: "2nd Edition"
rarity: rare

cost: 13
threshold: { deception: 6 }

text: |
  EXTRA COST: Destroy 2 characters you control. Pick 4 or fewer characters.
  Take control of the picked characters.
rules:
  - play:
      cost:
        - pick: { as: d, from: { character: { controller: you } }, count: 2, exactly: true, choose: true, prompt: "Destroy 2 characters you control." }
        - destroy: d
        - pick: { as: c, from: { character: any }, count: 4, up_to: true }
      effect:
        - take_control: { card: c, who: you }
