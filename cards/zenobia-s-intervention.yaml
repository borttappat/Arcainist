id: "zenobia-s-intervention"
name: "Zenobia's Intervention"
trade: gearsmith
types: [tactic]
set: "Ungodly Mess"
rarity: common

cost: 2
threshold: { elitism: 1 }

text: |
  EXTRA COST: Pick a character.
  This turn, the character gains 1 strength and 1 life for each different staple resource you control.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any } }
      effect:
        - let: { X: { different_staples: you } }
        - create_effect: { duration: turn, mods: [ { stat: { str: X, life: X }, target: c } ] }
