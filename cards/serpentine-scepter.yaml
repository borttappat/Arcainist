id: "serpentine-scepter"
name: "Serpentine Scepter"
trade: arcanist
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Holy Heist"
rarity: uncommon

cost: 1
threshold: { obsession: 1 }

text: |
  ATTACH TO CHARACTER
  SOUL DRAIN
  COST: Pay 1.
  EFFECT: Deplete the attached character.
  SOUL CHARGE
  COST: Use this ability only once each turn. Pay 1.
  EFFECT: Restore the attached character. It cannot attack this turn.
rules:
  - ability:
      name: Soul Drain
      cost: [ pay: 1 ]
      effect: [ deplete: host ]
  - ability:
      name: Soul Charge
      once_per_turn: true
      cost: [ pay: 1 ]
      effect:
        - restore: host
        - create_effect: { duration: turn, mods: [ { cannot: attack, target: host } ] }
