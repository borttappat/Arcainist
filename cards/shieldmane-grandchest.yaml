id: "shieldmane-grandchest"
name: "Shieldmane Grandchest"
trade: warlord
types: [character]
subtypes: ["grandchest", "seraphim", "dragon"]
set: "Seed 3"
rarity: fixed

cost: 8
threshold: { rage: 1 }
stats: { str: 6, life: 6, spd: 3 }

text: |
  UNIQUE GRANDCHEST
  When battle damage is inflicted to a character you control, reduce the amount by 2.
  When battle damage is inflicted to a character an opponent controls, increase the amount by 2.
rules:
  - unique: Grandchest
  - static:
      mods:
        - { damage: { delta: -2, battle: true }, target: { character: { controller: you } } }
        - { damage: { delta: 2, battle: true }, target: { character: { controller: opponent } } }
