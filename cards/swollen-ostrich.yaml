id: "swollen-ostrich"
name: "Swollen Ostrich"
trade: rogue
types: [character]
keywords: [tactical]
subtypes: ["beast"]
set: "Seed Saga"
rarity: uncommon

cost: 3
threshold: { deception: 2 }
stats: { str: 2, life: 2, spd: 3 }
flip_up: { cost: 1, threshold: { deception: 2 } }

text: |
  TACTICAL
  When this card enters play, you may pick a character. If you do, it gains 1 strength and 1 life this turn.
  FLIP UP: 1 [D][D]
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ create_effect: { duration: turn, mods: [ { stat: { str: 1, life: 1 }, target: c } ] } ]
