id: "frickin-sweet-pogo-bunny"
name: "Frickin' Sweet Pogo-Bunny"
trade: gearsmith
types: [item]
set: "Shade of the Devoured Emperor"
rarity: uncommon
text: |
  RAAR!
  COST: Use this only if this card is not a character and only once each turn. Pay 1.
  EFFECT: This turn, this card gains the "character" type, and gains 2 strength, 2 life, and 3 speed.
  HIDE!
  COST: Pay 1.
  EFFECT: If this card is a character, it loses the "character" type. Deplete this card.
  INTO THE RABBIT HOLE?
  COST: Pay 3.
  EFFECT: Flip this card face-down under its owner's control.
rules:
  - ability:
      name: RAAR!
      once_per_turn: true
      cost:
        - require: { not: { matches: [ self, { character: any } ] } }
        - pay: 1
      effect:
        - create_effect:
            duration: turn
            tag: raar
            mods:
              - { add_type: character }
              - { stat: { str: 2, life: 2, spd: 3 } }
  - ability:
      name: HIDE!
      cost: [ pay: 1 ]
      effect:
        - clear_effects: { tag: raar }
        - deplete: self
  - ability:
      name: Into the Rabbit Hole?
      cost: [ pay: 3 ]
      effect:
        - flip_face_down: { card: self, controller: owner }
