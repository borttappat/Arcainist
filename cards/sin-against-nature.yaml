id: "sin-against-nature"
name: "Sin Against Nature"
trade: arcanist
types: [character]
subtypes: ["monstrosity"]
set: "Seed Saga"
rarity: uncommon

cost: 1
threshold: { obsession: 2 }
stats: { str: 3, life: 3, spd: 3 }

text: |
  When this card enters play, pick a resource you control. Put it into its owner's hand. (You may pick face-down resources.)
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - pick: { as: r, from: { resource: { controller: you } } }
      - move: { card: r, to: hand }
