id: "god-s-blessing-of-boost"
name: "God's Blessing of Boost"
trade: warlord
types: [tactic]
attach_to: character
subtypes: ["mutation"]
set: "Ungodly Mess"
rarity: rare

cost: 6
threshold: { rage: 3 }

text: |
  UNIQUE BLESSING
  ATTACH TO CHARACTER
  When this card enters play, inflict 1 damage to all characters.
  The attached character gains the following rules text: "At the start of each turn, inflict 1 damage to all your characters.
  All your characters gain 1 strength."
rules:
  - unique: Blessing
  - play:
      effect: [ damage: { card: { character: any }, amount: 1 } ]
  - static:
      mods:
        - grant_rules:
            - trigger: { on: start_of_turn, player: any }
              effect: [ damage: { card: { character: { controller: you } }, amount: 1 } ]
            - static: { mods: [ { stat: { str: 1 }, target: { character: { controller: you } } } ] }
          target: host
