id: lodge-dock-florist
name: "Lodge Dock Florist"
trade: banker
types: [location]
cost: 3
threshold: { greed: 1 }
structure: 2
text: |
  UNIQUE LODGE DOCK FLORIST. All characters gain the rules text "At the start of your turn, you may pay 1. If you don't, destroy this card."
rules:
  - unique: Lodge Dock Florist
  - static:
      mods:
        - grant_rules:
            - trigger: { on: start_of_turn, player: you }
              effect:
                - may_pay: { amount: 1, prompt: "keep this character (Lodge Dock Florist)", else: [ destroy: self ] }
          target: { character: any }
