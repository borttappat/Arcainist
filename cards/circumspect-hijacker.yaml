id: "circumspect-hijacker"
name: "Circumspect Hijacker"
trade: banker
types: [character]
subtypes: ["pirate", "mau"]
set: "Ungodly Mess"
rarity: ultra-rare
text: |
  [G][G][G]: When this card enters play, draw a card.
  RETREAT
  COST: Pay 2. Destroy this card.
  EFFECT: Draw a card.
rules:
  - trigger: { on: enters_play, card: self, requires: { greed: 3 } }
    effect: [ draw: 1 ]
  - ability:
      name: Retreat
      cost: [ pay: 2, destroy: self ]
      effect: [ draw: 1 ]
