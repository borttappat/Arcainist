id: "banana-peel"
name: "Banana Peel"
trade: rogue
types: [item]
keywords: [tactical]
set: "Shade of the Devoured Emperor"
rarity: common
text: |
  TACTICAL
  EXTRA COST: If you deployed this card during an opponent's turn you may pay 1. If you don't, terminate it.
  SLIP
  COST: Pick an attacking character. Destroy this card.
  EFFECT: Flip that card face-down under its owner's control. Draw a card.
  FLIP UP: 3 [D][D][D]
rules:
  # "If you don't, terminate it": deployed during an opponent's turn, it costs 1 more.
  - play:
      cost:
        - if:
            cond: { your_turn: false }
            then: [ pay: 1 ]
  - ability:
      name: Slip
      cost:
        - pick: { as: c, from: { character: { attacking: true } } }
        - destroy: self
      effect:
        - flip_face_down: { card: c, controller: owner }
        - draw: 1
  - flip_up: { pay: 3, threshold: { deception: 3 } }
