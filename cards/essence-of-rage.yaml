id: "essence-of-rage"
name: "Essence of Rage"
trade: warlord
types: [tactic]
set: "Seed Saga"
rarity: uncommon

cost: 1
threshold: { rage: 2 }

text: |
  Choose one of the following as this card's rules text:
  OPTION 1
  EXTRA COST: Pick a character or faction.
  Inflict 1 damage to the character or faction.
  OPTION 2
  EXTRA COST: Pick a character.
  EFFECT: This turn, the character gains 2 strength.
  OPTION 3
  EXTRA COST: Pick a character.
  EFFECT: Deplete the character.
rules:
  - play:
      cost:
        - choose_one:
            - { label: "Inflict 1 damage to a character or faction", steps: [ let: { o: 1 }, pick: { as: c, from: [ { character: any }, { faction: any } ] } ] }
            - { label: "A character gains 2 strength this turn", steps: [ let: { o: 2 }, pick: { as: c, from: { character: any } } ] }
            - { label: "Deplete a character", steps: [ let: { o: 3 }, pick: { as: c, from: { character: any } } ] }
      effect:
        - if:
            cond: { eq: [ o, 1 ] }
            then: [ damage: { card: c, amount: 1 } ]
        - if:
            cond: { eq: [ o, 2 ] }
            then: [ modify: { card: c, stat: str, gain: 2 } ]
        - if:
            cond: { eq: [ o, 3 ] }
            then: [ deplete: c ]
