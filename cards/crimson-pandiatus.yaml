id: "crimson-pandiatus"
name: "Crimson Pandiatus"
trade: warlord
types: [character]
subtypes: ["beast"]
set: "Ungodly Mess"
rarity: common

cost: 2
threshold: { rage: 1 }
stats: { str: 5, life: 1, spd: 3 }

text: |
  This character cannot attack.
  [R][R][R][R][R][R]: This card gains 4 life and loses all other rules text.
rules:
  # With [R]x6 it gains 4 life and loses "This character cannot attack".
  - static:
      while: { not: { icons: { rage: 6 } } }
      mods: [ { cannot: attack } ]
  - static:
      requires: { rage: 6 }
      mods: [ { stat: { life: 4 } } ]
