id: "ashes-of-zenobia"
name: "Ashes of Zenobia"
trade: arcanist
types: [item]
set: "2nd Edition"
rarity: rare

cost: 7
threshold: { obsession: 4 }

text: |
  UNIQUE ASHES OF ZENOBIA
  At the start of your turn, draw a card.
  NULLIFY
  COST: Pay 5.
  EFFECT: Each player puts a character they control into its owner's hand.
rules:
  - unique: Ashes of Zenobia
  - trigger: { on: start_of_turn, player: you }
    effect: [ draw: 1 ]
  - ability:
      name: Nullify
      cost: [ pay: 5 ]
      effect:
        - each_player:
            - pick: { as: c, from: { character: { controller: you } }, choose: true, prompt: "Put a character you control into its owner's hand." }
            - move: { card: c, to: hand }
