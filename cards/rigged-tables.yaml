id: "rigged-tables"
name: "Rigged Tables"
trade: rogue
types: [item]
set: "Seed Saga"
rarity: uncommon
text: |
  SIZE UP
  COST: Deplete this card.
  EFFECT: Look at the top card of any deck.
  RIG
  COST: Pay 1.
  EFFECT: Put the top card of any deck on the bottom.
  WALK AWAY
  COST: Pay 1. Destroy this card.
  EFFECT: Draw a card.
rules:
  - ability:
      name: Size Up
      cost: [ deplete: self ]
      effect:
        - choose_one:
            - { label: "Look at the top card of your deck", steps: [ peek: { who: you, top: 1 } ] }
            - { label: "Look at the top card of your opponent's deck", steps: [ peek: { who: opponent, top: 1 } ] }
  - ability:
      name: Rig
      cost: [ pay: 1 ]
      effect:
        - choose_one:
            - { label: "Put the top card of your deck on the bottom", steps: [ move: { card: top_of_you, to: deck_bottom } ] }
            - { label: "Put the top card of your opponent's deck on the bottom", steps: [ move: { card: top_of_opponent, to: deck_bottom } ] }
  - ability:
      name: Walk Away
      cost: [ pay: 1, destroy: self ]
      effect: [ draw: 1 ]
