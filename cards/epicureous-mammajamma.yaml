id: "epicureous-mammajamma"
name: "Epicureous Mammajamma"
trade: rogue
types: [character]
subtypes: ["hedonist"]
set: "Seed Saga"
rarity: uncommon
text: |
  SLAP IT UP
  COST: Pay 1.
  EFFECT: This turn, this card loses 1 strength and gains 1 life.
  FLIP IT
  COST: Pay 1.
  EFFECT: This turn, this card loses 1 life and gains 1 strength.
  RUB IT DOWN
  COST: Pay 1.
  EFFECT: This turn, this card loses 1 strength or 1 life and gains 1 speed.
rules:
  - ability:
      name: Slap It Up
      cost: [ pay: 1 ]
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { str: -1, life: 1 } } ] }
  - ability:
      name: Flip It
      cost: [ pay: 1 ]
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { str: 1, life: -1 } } ] }
  - ability:
      name: Rub It Down
      cost: [ pay: 1 ]
      effect:
        - choose_one:
            - { label: "Lose 1 strength", steps: [ create_effect: { duration: turn, mods: [ { stat: { str: -1, spd: 1 } } ] } ] }
            - { label: "Lose 1 life", steps: [ create_effect: { duration: turn, mods: [ { stat: { life: -1, spd: 1 } } ] } ] }
