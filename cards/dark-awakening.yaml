id: dark-awakening
name: Dark Awakening
flavor_title: welcome back to the land of the living
trade: warlord
types: [tactic]
set: "Seed 2"
rarity: rare
text: |
  EXTRA COST: Pick a non-resource card in your discard pile.
  You may deploy the card. Draw a card.
  FLIP UP: 2 [R]
rules:
  - play:
      cost:
        - pick: { as: c, from: { card: { zone: discard, owner: you, not_type: resource } } }
      effect:
        - may:
            - play_card: { card: c }
        - draw: 1
  - flip_up: { pay: 2, threshold: { rage: 1 } }
