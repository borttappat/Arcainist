id: "rapine"
name: "Rapine"
trade: rogue
types: [tactic]
set: "2nd Edition"
rarity: uncommon

cost: 5
threshold: { deception: 2 }

text: |
  EXTRA COST: Destroy a character or item you control. Pick a character.
  Take control of the picked character.
rules:
  - play:
      cost:
        - destroy: { from: [ { character: { controller: you } }, { item: { controller: you } } ], choose: true }
        - pick: { as: c, from: { character: any } }
      effect: [ take_control: { card: c, who: you } ]
