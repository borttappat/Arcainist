text: |
  UNIQUE BLESSING
  ATTACH TO CHARACTER
  The attached character gains the following rules text: "When a character you control restores, it loses 1 strength this turn and you draw a card.
  Characters you control cannot be restored by your faction's RESTORE RULE.
  At the start of your turn, you may inflict 1 damage to your faction and restore a character you control. Repeat this once for every character you control."
