    effect: [ draw: 1 ]
  - trigger: { on: enters_play, card: self, requires: { greed: 4 } }
    effect: [ draw: 1 ]
  - trigger: { on: enters_play, card: self, requires: { greed: 6 } }
    effect: [ draw: 1 ]
  - flip_up: { pay: 2, threshold: { greed: 1 } }
