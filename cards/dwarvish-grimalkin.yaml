types: [character]
subtypes: [mau]
cost: 1
threshold: { greed: 1 }
stats: { str: 1, life: 1, spd: 3 }
text: |
  [G][G] - When this card enters play, draw a card. [G]x4 - When this card enters play, draw a card. [G]x6 - When this card enters play, draw a card.
  FLIP UP - 2 [G].
rules:
