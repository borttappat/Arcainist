id: "prudent-thug"
name: "Prudent Thug"
trade: banker
types: [character]
subtypes: ["mercenary", "investor"]
set: "2nd Edition"
rarity: common

cost: 5
threshold: { greed: 2 }
stats: { str: 4, life: 5, spd: 3 }

text: |
  When this card enters play, your faction loses 3 influence.
  This card loses 1 strength and 1 life for each token on it.
  This card can attack only once each turn.
  RESTORE
  COST: Pay 1. Put a token on this card.
  EFFECT: Restore this card.
rules:
  - trigger: { on: enters_play, card: self }
    effect: [ lose_influence: { who: you, amount: 3 } ]
  - static:
      mods:
        - { stat: { str: { neg: { tokens: self } }, life: { neg: { tokens: self } } } }
        - { attack_limit: 1 }
  - ability:
      name: Restore
      cost:
        - pay: 1
        - tokens: { card: self, add: 1 }
      effect: [ restore: self ]
