id: "rudo-mangod-holder-of-light"
name: "Rudo Mangod, Holder of Light"
trade: warlord
types: [character]
subtypes: ["rudo", "blade of questionable morality"]
set: "Holy Heist"
rarity: rare

cost: 2
threshold: { rage: 3 }
stats: { str: 1, life: 3, spd: 3 }

text: |
  UNIQUE RUDOLPHUS
  While this card is restored, all characters you control gain 1 strength and 1 life.
  At the start of each turn, if this card has a 'gear' card attached to it, restore this card.
rules:
  - unique: Rudolphus
  - static:
      while: { matches: [ self, { character: { depleted: false } } ] }
      mods: [ { stat: { str: 1, life: 1 }, target: { character: { controller: you } } } ]
  - trigger: { on: start_of_turn, player: any, while: { all: [ { exists: { item: { attached_to: self, subtype: gear } } }, { matches: [ self, { character: { depleted: true } } ] } ] } }
    effect:
      - if:
          cond: { exists: { item: { attached_to: self, subtype: gear } } }
          then: [ restore: self ]
