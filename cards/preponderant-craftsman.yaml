id: "preponderant-craftsman"
name: "Preponderant Craftsman"
trade: gearsmith
types: [character]
subtypes: ["craftsman"]
set: "Seed Saga"
rarity: rare

cost: 4
threshold: { elitism: 2 }
stats: { str: 2, life: 2, spd: 2 }

text: |
  CREATE
  COST: Pay 5. Deplete this card.
  EFFECT: You may deploy a character for free. (You still need to meet its threshold and satisfy its extra costs.)
rules:
  - ability:
      name: Create
      cost: [ pay: 5, deplete: self ]
      effect:
        - pick: { as: c, from: { character: { zone: hand, owner: you } }, choose: true, optional: true, prompt: "You may deploy a character from your hand for free." }
        - if:
            cond: { defined: c }
            then: [ play_card: { card: c, free: true } ]
