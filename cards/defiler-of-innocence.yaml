id: "defiler-of-innocence"
name: "Defiler of Innocence"
trade: arcanist
types: [character]
subtypes: ["wizard"]
set: "Seed Saga"
rarity: rare

cost: 2
threshold: { obsession: 4 }
stats: { str: 2, life: 1, spd: 3 }

text: |
  CORRUPT
  COST: Pay 2. Pick a character.
  EFFECT: This turn, the character gains COVERT.
  DEFILE
  COST: Deplete this card.
  EFFECT: Look at an opponent's hand and choose a character in it. That player discards that character.
rules:
  - ability:
      name: Corrupt
      cost:
        - pay: 2
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { keyword: covert, target: c } ] }
  - ability:
      name: Defile
      cost: [ deplete: self ]
      effect:
        - reveal_hand: opponent
        - pick: { as: c, from: { character: { zone: hand, owner: opponent } }, choose: true }
        - discard: { who: opponent, cards: c }
