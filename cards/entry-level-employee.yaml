id: "entry-level-employee"
name: "Entry-Level Employee"
trade: banker
types: [character]
subtypes: ["employee"]
set: "2nd Edition"
rarity: common
text: |
  This card enters play with 2 tokens on it.
  This card loses 1 strength and 1 life for each token on it.
  INVEST
  COST: Pay 2.
  EFFECT: Remove a token from this card.
enters_with_tokens: 2
rules:
  - static:
      mods: [ { stat: { str: { neg: { tokens: self } }, life: { neg: { tokens: self } } } } ]
  - ability:
      name: Invest
      cost: [ pay: 2 ]
      effect: [ tokens: { card: self, remove: 1 } ]
