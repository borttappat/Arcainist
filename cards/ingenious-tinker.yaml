id: "ingenious-tinker"
name: "Ingenious Tinker"
trade: gearsmith
types: [character]
subtypes: ["31f"]
set: "Seed Saga"
rarity: uncommon

cost: 6
threshold: { elitism: 1 }
stats: { str: 3, life: 3, spd: 3 }

text: |
  When this card enters play, reduce the next numeric cost you pay this turn by 3.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - create_effect: { duration: next, mods: [ { cost: -3, applies: any, by: you, target: all } ] }
