id: "devilfang-thunderhoof"
name: "Devilfang Thunderhoof"
trade: arcanist
types: [character]
subtypes: ["thunderhoof", "seraphim", "dragon"]
set: "Seed 3"
rarity: fixed
text: |
  UNIQUE THUNDERHOOF
  When this card enters play, put X tokens on it, where X is the number of [O] you control.
  This card gains 1 strength for each token on it.
  DISRUPT
  COST: Pay 2. Remove a token from this card. Pick an opponent.
  EFFECT: That player discards a card.
rules:
  - unique: Thunderhoof
  - trigger: { on: enters_play, card: self }
    effect: [ tokens: { card: self, add: { icons: obsession } } ]
  - static:
      mods: [ { stat: { str: { tokens: self } } } ]
  - ability:
      name: Disrupt
      cost: [ pay: 2, tokens: { card: self, remove: 1 } ]
      effect: [ discard: { who: opponent, count: 1 } ]
