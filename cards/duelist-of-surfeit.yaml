id: "duelist-of-surfeit"
name: "Duelist of Surfeit"
trade: warlord
types: [character]
subtypes: ["fighter"]
set: "Shade of the Devoured Emperor"
rarity: common
text: |
  When a card that provides at least [R] enters play under your control, you may put a token on this card.
  This card gains 1 strength and 1 life for each token on it.
rules:
  - trigger: { on: enters_play, card: { controller: you, provides_at_least: { rage: 1 } } }
    effect:
      - may:
          prompt: "put a token on Duelist of Surfeit"
          steps: [ tokens: { card: self, add: 1 } ]
  - static:
      mods: [ { stat: { str: { tokens: self }, life: { tokens: self } } } ]
