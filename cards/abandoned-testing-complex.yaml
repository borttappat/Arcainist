id: "abandoned-testing-complex"
name: "Abandoned Testing Complex"
trade: gearsmith
types: [location]
set: "Shade of the Devoured Emperor"
rarity: uncommon

cost: 4
threshold: { elitism: 3 }
structure: 6

text: |
  At the start of your turn, you may pay 3. If you do you may play a resource.
rules:
  - trigger: { on: start_of_turn, player: you }
    effect:
      - may_pay:
          amount: 3
          prompt: "you may play a resource"
          then: [ play_resource: { optional: true } ]
