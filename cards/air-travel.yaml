id: "air-travel"
name: "Air Travel"
trade: arcanist
types: [tactic]
set: "2nd Edition"
rarity: common

cost: 2
threshold: { obsession: 1 }

text: |
  EXTRA COST: Pick a character.
  This turn, the character gains COVERT. Draw a card.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { keyword: covert, target: c } ] }
        - draw: 1
