id: "quotidian-concealer"
name: "Quotidian Concealer"
trade: arcanist
types: [character]
subtypes: ["ritualist"]
set: "Shade of the Devoured Emperor"
rarity: common

cost: 2
threshold: { obsession: 2 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  This card enters play with a token on it.
  OBSCURE
  COST: Remove a token from this card. Pick a character.
  EFFECT: This turn, the character gains COVERT.
enters_with_tokens: 1
rules:
  - ability:
      name: Obscure
      cost:
        - tokens: { card: self, remove: 1 }
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { keyword: covert, target: c } ] }
