id: "guardforce-aggromajig"
name: "Guardforce Aggromajig"
trade: gearsmith
types: [character]
subtypes: ["guardforce", "majig"]
set: "Holy Heist"
rarity: rare

cost: 1
threshold: { elitism: 4 }
stats: { str: 0, life: 3, spd: 3 }

text: |
  This card can attack even if it has not been in play under your control since the start of the turn.
  While this card is depleted it gains 2 strength.
rules:
  - static:
      mods: [ { keyword: aggro } ]
  - static:
      while: { matches: [ self, { character: { depleted: true } } ] }
      mods: [ { stat: { str: 2 } } ]
