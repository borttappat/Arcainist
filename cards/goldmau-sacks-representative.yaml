id: "goldmau-sacks-representative"
name: "Goldmau Sacks Representative"
trade: banker
types: [character]
subtypes: ["mau", "employee"]
set: "Shade of the Devoured Emperor"
rarity: uncommon

cost: 3
threshold: { greed: 1 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  RAISE CAPITAL
  COST: Pay 1. Discard a card.
  EFFECT: This turn, this card gains PROVIDES: [G][G][G] .
  INVEST: [G][G][G][G][G][G]
  COST: Pay 2.
  EFFECT: Search your deck for a resource and reveal it. Put it into your hand.
rules:
  - ability:
      name: Raise Capital
      cost: [ pay: 1, discard: 1 ]
      effect:
        - create_effect: { duration: turn, mods: [ { provides: { greed: 3 } } ] }
  - ability:
      name: Invest
      threshold: { greed: 6 }
      cost: [ pay: 2 ]
      effect:
        - search: { deck: you, for: { resource: any }, reveal: true, to: hand }
