id: "reluctant-reconciliation"
name: "Reluctant Reconciliation"
trade: gearsmith
types: [tactic]
set: "Shade of the Devoured Emperor"
rarity: common
text: |
  EXTRA COST: Pick a character.
  Restore that character. This turn, it cannot attack.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any } }
      effect:
        - restore: c
        - create_effect: { duration: turn, mods: [ { cannot: attack, target: c } ] }
