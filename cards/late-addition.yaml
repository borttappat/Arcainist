id: late-addition
name: "Late Addition"
trade: rogue
types: [tactic]
set: "2nd Edition"
rarity: uncommon
text: |
  You may deploy a character card from your hand. Draw a card. (You still pay all the character's costs.)
rules:
  - play:
      effect:
        - may:
            prompt: "play a character card from your hand"
            steps:
              - pick: { as: c, from: { character: { zone: hand, owner: you } }, choose: true }
              - play_card: { card: c }
        - draw: 1
