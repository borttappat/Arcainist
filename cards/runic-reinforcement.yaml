id: "runic-reinforcement"
name: "Runic Reinforcement"
trade: gearsmith
types: [tactic]
set: "Seed Saga"
rarity: common

cost: 2
threshold: { elitism: 1 }

text: |
  EXTRA COST: Pick a character.
  This turn, the character gains 3 strength and 3 life.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { str: 3, life: 3 }, target: c } ] }
