rules:
  - ability: { name: "Inflationary Forces - Draw", both_players: true, cost: [ pay: 2 ], effect: [ draw: 1 ] }
  - ability: { name: "Inflationary Forces - Resource", both_players: true, cost: [ pay: 2 ], effect: [ play_resource: 1 ] }
