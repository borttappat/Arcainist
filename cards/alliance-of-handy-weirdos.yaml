id: "alliance-of-handy-weirdos"
name: "Alliance of Handy Weirdos"
trade: none
types: [faction]
set: "Seed Saga"

influence: 20
starting_resources: { specific: { elitism: 1 }, any_staples: 1 }
starting_draw: { first: 8, second: 9 }

text: |
  STARTING RESOURCES: 1 Elitism, 1 staple resource
  STARTING DRAW: 8 going first, 9 going second
  RESTORE RULE: At the start of your turn, restore all your depleted cards and detach all resources from your faction.
  DEVELOP RULE: At the start of your turn, draw a card or play a resource.
  DRAW
  COST: Pay 3.
  EFFECT: Draw a card.
  RESOURCE
  COST: Pay 4.
  EFFECT: Play a resource.
  "ENHANCE"
  COST: Pay 3. Pick a character.
  EFFECT: This turn, the character gains 1 strength and 1 life.
restore_rule:
  - restore_all_depleted: you
  - detach_all_resources: you
develop_rule:
  - choose_one:
      - draw: 1
      - play_resource: 1
rules:
  - ability: { name: Draw, cost: [ pay: 3 ], effect: [ draw: 1 ] }
  - ability: { name: Resource, cost: [ pay: 4 ], effect: [ play_resource: 1 ] }
  - ability:
      name: Enhance
      cost: [ pay: 3, pick: { as: c, from: { character: any } } ]
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { str: 1, life: 1 }, target: c } ] }
