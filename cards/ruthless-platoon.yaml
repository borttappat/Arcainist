id: "ruthless-platoon"
name: "Ruthless Platoon"
trade: warlord
types: [character]
subtypes: ["soldier"]
set: "2nd Edition"
rarity: rare

cost: 3
threshold: { rage: 3 }
stats: { str: 2, life: 3, spd: 3 }

text: |
  CANNIBALIZE
  COST: Destroy a character you control.
  EFFECT: This turn, this card gains 2 strength.
rules:
  - ability:
      name: Cannibalize
      cost:
        - destroy: { from: { character: { controller: you } }, choose: true }
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { str: 2 } } ] }
