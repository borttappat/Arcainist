id: "securitymajig-mark-ii"
name: "Securitymajig Mark II"
trade: gearsmith
types: [character]
subtypes: ["majig"]
set: "Ungodly Mess"
rarity: common

cost: 4
threshold: { elitism: 1 }
stats: { str: 1, life: 4, spd: 3 }
flip_up: { cost: 5, threshold: { elitism: 1 } }

text: |
  If you deployed this card using FLIP UP, it enters play with 3 tokens on it.
  This card gains 1 strength for each token on it.
  This card can block COVERT parties.
  FLIP UP: 5 [E]
rules:
  - play:
      effect:
        - if:
            cond: { via: flip_up }
            then: [ tokens: { card: self, add: 3 } ]
  - static:
      mods:
        - { stat: { str: { tokens: self } } }
        - { blocks_any: true }
