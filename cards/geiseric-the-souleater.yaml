id: "geiseric-the-souleater"
name: "Geiseric, the Souleater"
trade: arcanist
types: [character]
subtypes: ["geiseric", "demon knight"]
set: "Seed 3"
rarity: fixed

cost: 3
threshold: { obsession: 3 }
stats: { str: 3, life: 2, spd: 3 }

text: |
  UNIQUE GEISERIC
  If a character would be put into an opponent's hand from play, you may pay 1. If you do, remove it from the game and put a token on this card instead.
  SOUL CONSUMPTION
  COST: Pay 2. Remove a token from this card.
  EFFECT: Look at the top 2 cards of your deck. Put 1 into your hand and 1 on the bottom of your deck.
rules:
  - unique: Geiseric
  - replace: { event: to_hand, card: { character: { owner: opponent } }, pay: 1, prompt: "Remove it from the game and put a token on Geiseric instead" }
    instead:
      - void: it
      - tokens: { card: self, add: 1 }
  - ability:
      name: Soul Consumption
      cost: [ pay: 2, tokens: { card: self, remove: 1 } ]
      effect:
        - look: { deck: you, count: 2, to_hand: 1, bottom: rest }
