id: "assistant-mud-whisperer"
name: "Assistant Mud Whisperer"
trade: gearsmith
types: [character]
subtypes: ["mud whisperer", "31f"]
set: "Seed Saga"
rarity: uncommon

cost: 5
threshold: { elitism: 1 }
stats: { str: 3, life: 4, spd: 2 }

text: |
  At the start of each opponent's turn, you may pick a character. If you do, restore it.
rules:
  - trigger: { on: start_of_turn, player: opponent }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ restore: c ]
