id: mistaken-identity
name: "Mistaken Identity"
trade: rogue
types: [tactic]
set: "Seed Saga"
rarity: rare

cost: 2
threshold: { deception: 2 }

text: |
  EXTRA COST: Deploy this only in response to a card or ability that picked a character as an extra cost. Pick another character that could be picked by that card or ability.
  When the card or ability resolves, its effect happens as though your opponent had picked the other character instead.
rules:
  - play:
      timing: { response_to: { picked_character_as_cost: true } }
      cost:
        # Only characters the original card or ability could have picked.
        - pick: { as: other, like: responded, prompt: "Mistaken Identity: pick another character that could be picked by that card or ability." }
      effect:
        - script: mistaken_identity
