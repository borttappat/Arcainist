id: cock-block
name: "Cock Block"
trade: gearsmith
types: [tactic]
cost: 3
threshold: { elitism: 1 }
text: |
  COST - Play this only in response to an ability.
  EFFECT - Terminate the ability. Put this card into play under its owner's control as a face-down resource instead of into its owner's discard pile.
  FLIP UP - 4 [E] and discard a card.
rules:
  - play:
      timing: { response_to: { ability: true } }
      then: face_down_resource
      effect:
        - terminate: responded
  - flip_up: { pay: 4, threshold: { elitism: 1 }, cost: [ discard: 1 ] }
