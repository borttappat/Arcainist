id: "volatile-communion"
name: "Volatile Communion"
trade: arcanist
types: [tactic]
set: "Ungodly Mess"
rarity: uncommon
text: |
  EXTRA COST: Choose a number for X. Deplete X characters you control.
  Look at the top X+2 cards of your deck. You may put one of them into your hand. Put the remaining cards on the bottom of your deck in any order.
  FLIP UP: 1 [O]
rules:
  - play:
      cost:
        - choose_number: { as: X, min: 0, max: { count: { character: { controller: you, depleted: false } } } }
        - pick: { as: d, from: { character: { controller: you, depleted: false } }, count: X, exactly: true, choose: true, prompt: "Deplete X characters you control." }
        - deplete: d
      effect: [ look: { deck: you, count: "X + 2", to_hand: 1, bottom: rest } ]
  - flip_up: { pay: 1, threshold: { obsession: 1 } }
