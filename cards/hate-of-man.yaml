id: "hate-of-man"
name: "Hate of Man"
trade: arcanist
types: [character]
subtypes: ["god"]
set: "Holy Heist"
rarity: uncommon

cost: 2
threshold: { obsession: 2 }
stats: { str: 1, life: 2, spd: 1 }

text: |
  This character loses 1 life and all non-Arcanist characters lose 1 strength for each token on this card.
  SPREAD THE HATE
  COST: Pay 2. Deplete this card.
  EFFECT: Put a token on this card.
rules:
  - static:
      mods:
        - { stat: { life: { neg: { tokens: self } } } }
        - { stat: { str: { neg: { tokens: self } } }, target: { character: { not_trade: arcanist } } }
  - ability:
      name: Spread the Hate
      cost: [ pay: 2, deplete: self ]
      effect: [ tokens: { card: self, add: 1 } ]
