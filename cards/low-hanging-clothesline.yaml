id: "low-hanging-clothesline"
name: "Low-hanging Clothesline"
trade: rogue
types: [tactic]
set: "Holy Heist"
rarity: common

cost: 3
threshold: { deception: 1 }

text: |
  EXTRA COST: Pick a depleted character.
  If the character has 5 life or more, destroy it.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { depleted: true } } }
      effect:
        - if:
            cond: { gte: [ { stat: [ c, life ] }, 5 ] }
            then: [ destroy: c ]
