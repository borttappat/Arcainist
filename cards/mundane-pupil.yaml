id: "mundane-pupil"
name: "Mundane Pupil"
trade: gearsmith
types: [character]
subtypes: ["31f"]
set: "Seed Saga"
rarity: common
text: |
  When this card enters play, you may pay 3. If you do, put a token on it.
  While there is a token on this card, it gains 1 strength and 1 life.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may_pay:
          amount: 3
          prompt: "put a token on Mundane Pupil"
          then: [ tokens: { card: self, add: 1 } ]
  - static:
      while: { gt: [ { tokens: self }, 0 ] }
      mods: [ { stat: { str: 1, life: 1 } } ]
