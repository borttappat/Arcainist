id: "ghosts-of-loot"
name: "Ghosts of Loot"
trade: banker
types: [character]
subtypes: ["ghost"]
set: "Ungodly Mess"
rarity: rare
text: |
  UNIQUE GHOSTS
  When this card blocks, your faction loses 2 influence and this card gains 4 life this turn.
  When this card attacks, your faction gains 1 influence and this card gains 2 strength this turn.
  [V][V]: When this card enters play, draw a card.
  [V][V][V][V][V]: When this card is destroyed, draw 4 cards.
  FLIP UP: 3 [G]
rules:
  - unique: Ghosts
  - trigger: { on: blocks, card: self }
    effect:
      - lose_influence: { who: you, amount: 2 }
      - create_effect: { duration: turn, mods: [ { stat: { life: 4 } } ] }
  - trigger: { on: attacks, card: self }
    effect:
      - gain_influence: { who: you, amount: 1 }
      - create_effect: { duration: turn, mods: [ { stat: { str: 2 } } ] }
  - trigger: { on: enters_play, card: self, requires: { volition: 2 } }
    effect: [ draw: 1 ]
  - trigger: { on: destroyed, card: self, requires: { volition: 5 } }
    effect: [ draw: 4 ]
  - flip_up: { pay: 3, threshold: { greed: 1 } }
