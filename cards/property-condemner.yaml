id: "property-condemner"
name: "Property Condemner"
trade: banker
types: [character]
subtypes: ["priest", "mau"]
set: "Seed Saga"
rarity: uncommon

cost: 4
threshold: { greed: 2 }
stats: { str: 2, life: 2, spd: 4 }
flip_up: { cost: 2, threshold: { greed: 2 } }

text: |
  When this card enters play, you may pick a location. If you do, destroy that location.
  FLIP UP: 2 [G][G]
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - pick: { as: l, from: { location: any }, optional: true }
      - if:
          cond: { defined: l }
          then: [ destroy: l ]
