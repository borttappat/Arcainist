id: "runic-flee"
name: "Runic Flee"
trade: gearsmith
types: [tactic]
set: "Seed Saga"
rarity: uncommon
text: |
  Your faction loses 1 influence. Detach a resource from your faction. If you deployed this card using FLIP UP, you may pick a non-resource card. If you do, put a token on that card.
  FLIP UP: 1 [E] and you may play a resource.
rules:
  - play:
      effect:
        - lose_influence: { who: you, amount: 1 }
        - detach: { count: 1 }
        - if:
            cond: { via: flip_up }
            then:
              - pick: { as: c, from: { card: { not_type: resource } }, optional: true }
              - if:
                  cond: { defined: c }
                  then: [ tokens: { card: c, add: 1 } ]
  - flip_up: { pay: 1, threshold: { elitism: 1 }, cost: [ play_resource: { optional: true } ] }
