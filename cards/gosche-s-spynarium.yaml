id: "gosche-s-spynarium"
name: "Gosche's Spynarium"
trade: rogue
types: [location]
set: "Ungodly Mess"
rarity: uncommon
text: |
  When a character you control with a token on it leaves play, you may pick a character. If you do, that character gains COVERT this turn.
  EXPERIMENT
  COST: Deplete this card. Pay 2. Pick a character you control.
  EFFECT: Put a token on that character.
rules:
  - trigger: { on: leaves_play, player: you, card: { character: any }, had_tokens: true }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ create_effect: { duration: turn, mods: [ { keyword: covert, target: c } ] } ]
  - ability:
      name: Experiment
      cost:
        - deplete: self
        - pay: 2
        - pick: { as: c, from: { character: { controller: you } } }
      effect: [ tokens: { card: c, add: 1 } ]
