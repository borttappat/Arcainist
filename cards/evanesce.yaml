id: "evanesce"
name: "Evanesce"
trade: arcanist
types: [tactic]
set: "Seed Saga"
rarity: common

cost: 3
threshold: { obsession: 2 }
flip_up: { cost: 1, threshold: { obsession: 2 } }

text: |
  EXTRA COST: Pick a character.
  Put the character into its owner's hand.
