id: gideon-the-ultimate-warrior
name: "Gideon, the Ultimate Warrior"
trade: warlord
types: [character]
subtypes: [gideon, sword of great justice]
set: "Seed Saga"
rarity: rare

cost: 1
threshold: { rage: 3 }
stats: { str: 2, life: 3, spd: 3 }

text: |
  UNIQUE GIDEON
  When battle damage is inflicted to this card while it's attacking, reduce the amount to 0.
  When an opponent's faction loses influence, increase the amount by 1.
rules:
  - unique: Gideon
  - static:
      mods:
        - { damage: { set: 0, battle: true }, while: { attacking: self } }
        - { influence_loss: { player: opponent, delta: 1 }, target: all }
