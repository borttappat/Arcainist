id: gideon-the-ultimate-warrior
name: "Gideon, the Ultimate Warrior"
trade: warlord
types: [character]
subtypes: [gideon, sword of great justice]
text: |
  UNIQUE GIDEON. If battle damage is inflicted to this card while it's attacking, reduce the amount to 0. If your opponent's faction loses influence, increase the amount by 1.
rules:
  - unique: Gideon
  - static:
      mods:
        - { damage: { set: 0, battle: true }, while: { attacking: self } }
        - { influence_loss: { player: opponent, delta: 1 }, target: all }
