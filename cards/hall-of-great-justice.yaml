id: "hall-of-great-justice"
name: "Hall of Great Justice"
trade: none
types: [faction]
set: "Seed Saga"

influence: 20
starting_resources: { specific: { rage: 1 }, any_staples: 1 }
starting_draw: { first: 8, second: 9 }

text: |
  STARTING RESOURCES: 1 Rage, 1 staple resource
  STARTING DRAW: 8 going first, 9 going second
  RESTORE RULE: At the start of your turn, restore all your depleted cards and detach all resources from your faction.
  DEVELOP RULE: At the start of your turn, draw a card or play a resource.
  DRAW
  COST: Pay 3.
  EFFECT: Draw a card.
  RESOURCE
  COST: Pay 4.
  EFFECT: Play a resource.
  FOR GREAT JUSTICE!
  COST: Pay 5. Pick a character you control. X is its strength. Destroy it. Pick another character.
  EFFECT: Inflict X damage to the character.
restore_rule:
  - restore_all_depleted: you
  - detach_all_resources: you
develop_rule:
  - choose_one:
      - draw: 1
      - play_resource: 1
rules:
  - ability: { name: Draw, cost: [ pay: 3 ], effect: [ draw: 1 ] }
  - ability: { name: Resource, cost: [ pay: 4 ], effect: [ play_resource: 1 ] }
  - ability:
      name: For Great Justice!
      cost:
        - pay: 5
        - pick: { as: m, from: { character: { controller: you } } }
        - let: { X: { stat: [ m, str ] } }
        - destroy: m
        - pick: { as: t, from: { character: { not: m } } }
      effect:
        - damage: { card: t, amount: X }
