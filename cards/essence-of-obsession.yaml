id: "essence-of-obsession"
name: "Essence of Obsession"
trade: arcanist
types: [tactic]
set: "Seed Saga"
rarity: uncommon

cost: 1
threshold: { obsession: 2 }

text: |
  Choose one of the following as this card's rules text:
  OPTION 1
  An opponent discards a card.
  OPTION 2
  EXTRA COST: Pick a character.
  This turn, the character gains COVERT.
  OPTION 3
  EXTRA COST: Pick a character.
  EFFECT: This turn, the character loses 2 strength.
rules:
  - play:
      cost:
        - choose_one:
            - { label: "An opponent discards a card", steps: [ let: { o: 1 } ] }
            - { label: "A character gains COVERT this turn", steps: [ let: { o: 2 }, pick: { as: c, from: { character: any } } ] }
            - { label: "A character loses 2 strength this turn", steps: [ let: { o: 3 }, pick: { as: c, from: { character: any } } ] }
      effect:
        - if:
            cond: { eq: [ o, 1 ] }
            then: [ discard: { who: opponent, count: 1 } ]
        - if:
            cond: { eq: [ o, 2 ] }
            then: [ create_effect: { duration: turn, mods: [ { keyword: covert, target: c } ] } ]
        - if:
            cond: { eq: [ o, 3 ] }
            then: [ modify: { card: c, stat: str, lose: 2 } ]
