id: "crest-of-deception"
name: "Crest of Deception"
trade: universal
types: [item]
subtypes: ["crest"]
set: "Seed 2"
rarity: rare
text: |
  UNIQUE CREST
  PROVIDES: [D][D]
  When a card that provides at least [D] enters play under your control, you may pick a character. If you do, that character loses 1 life this turn.
rules:
  - unique: Crest
  - trigger: { on: enters_play, card: { controller: you, provides_at_least: { deception: 1 }, not_self: true } }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ modify: { card: c, stat: life, lose: 1 } ]
