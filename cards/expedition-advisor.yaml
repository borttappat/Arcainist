id: "expedition-advisor"
name: "Expedition Advisor"
trade: banker
types: [character]
subtypes: ["advisor"]
set: "Holy Heist"
rarity: common
text: |
  When this card enters play, you may draw 2 cards then discard 2 cards.
  RECUR: [G][G][G]
  COST: Use this only if this card is in your discard pile. Pay 1. Remove this card from the game.
  EFFECT: Draw 2 cards then discard 2 cards.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may:
          prompt: "draw 2 cards, then discard 2 cards"
          steps: [ draw: 2, discard: 2 ]
  - ability:
      name: Recur
      keyword: recur
      threshold: { greed: 3 }
      from: discard
      cost: [ pay: 1, void: self ]
      effect: [ draw: 2, discard: 2 ]
