id: "bottlebeard-brandyshanks"
name: "Bottlebeard Brandyshanks"
trade: rogue
types: [character]
subtypes: ["pluck", "drunk"]
set: "Shade of the Devoured Emperor"
rarity: rare

cost: 4
threshold: { deception: 3 }
stats: { str: 3, life: 3, spd: 1 }

text: |
  UNIQUE PLUCK
  The top card of each opponent's deck is revealed at all times. If any of those cards are a character, this card gains 3 speed.
  CHUG!
  COST: Pay 2. Pick an opponent.
  EFFECT: Put the top card of that player's deck on the bottom of their deck.
rules:
  - unique: Pluck
  - static:
      mods:
        - { reveal_top: opponent, target: none }
  - static:
      while: { matches: [ top_of_opponent, { character: { zone: deck } } ] }
      mods: [ { stat: { spd: 3 } } ]
  - ability:
      name: Chug!
      cost: [ pay: 2 ]
      effect:
        - move: { card: top_of_opponent, to: deck_bottom }
