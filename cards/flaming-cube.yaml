id: "flaming-cube"
name: "Flaming Cube"
trade: warlord
types: [item]
set: "Shade of the Devoured Emperor"
rarity: rare

cost: 6
threshold: { rage: 3 }

text: |
  This card enters play with 3 tokens on it.
  At the start of your turn put a token on this card.
  When there are at least 6 tokens on this card, destroy it. If you do, each opponents' faction loses 6 influence.
  When there are no tokens on this card destroy it.
  CONTROL THE FLAME!
  COST: Any player may use this ability. Destroy a character or item you control.
  EFFECT: Add or remove a token from this card.
enters_with_tokens: 3
rules:
  # Its tokens only change through these two rules, so the 0 and 6 checks follow them.
  - trigger: { on: start_of_turn, player: you }
    effect:
      - tokens: { card: self, add: 1 }
      - if:
          cond: { gte: [ { tokens: self }, 6 ] }
          then:
            - destroy: self
            - lose_influence: { who: opponent, amount: 6 }
  - ability:
      name: Control the Flame!
      both_players: true
      cost:
        - destroy: { from: [ { character: { controller: you } }, { item: { controller: you } } ], choose: true }
      effect:
        - choose_one:
            - { label: "Add a token", steps: [ tokens: { card: self, add: 1 } ] }
            - { label: "Remove a token", steps: [ tokens: { card: self, remove: 1 } ] }
        - if:
            cond: { gte: [ { tokens: self }, 6 ] }
            then:
              - destroy: self
              - lose_influence: { who: { opponent_of: { controller_of: self } }, amount: 6 }
        - if:
            cond: { eq: [ { tokens: self }, 0 ] }
            then: [ destroy: self ]
