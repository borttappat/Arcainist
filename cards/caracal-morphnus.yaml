id: "caracal-morphnus"
name: "Caracal Morphnus"
trade: banker
types: [character]
subtypes: ["seraphim", "dragon"]
set: "Seed Saga"
rarity: uncommon

cost: 6
threshold: { greed: 1 }
stats: { str: 0, life: 0, spd: 3 }

text: |
  UNIQUE CARACAL
  When this card enters play, put 5 tokens on it.
  This card gains 1 strength and 1 life for each token on it.
  When you draw any number of cards, put X tokens on this card, where X is the number of cards drawn.
  $$$ MORPH
  COST: Remove 3 tokens from this card.
  EFFECT: Draw a card.
rules:
  - unique: Caracal
  - trigger: { on: enters_play, card: self }
    effect: [ tokens: { card: self, add: 5 } ]
  - static:
      mods: [ { stat: { str: { tokens: self }, life: { tokens: self } } } ]
  - trigger: { on: draw, player: you }
    effect: [ tokens: { card: self, add: amount } ]
  - ability:
      name: $$$ Morph
      cost: [ tokens: { card: self, remove: 3 } ]
      effect: [ draw: 1 ]
