id: ritual-of-the-double-monkey
name: "Ritual of the Double Monkey"
trade: arcanist
types: [tactic]
text: |
  Your opponent discards a card. If you control [O][O][O], your opponent discards another card. If you control [O]x6, your opponent discards another card.
  FLIP UP - 2 [O].
rules:
  - play:
      effect:
        - discard: { who: opponent, count: 1 }
        - if: { cond: { icons: { obsession: 3 } }, then: [ discard: { who: opponent, count: 1 } ] }
        - if: { cond: { icons: { obsession: 6 } }, then: [ discard: { who: opponent, count: 1 } ] }
  - flip_up: { pay: 2, threshold: { obsession: 1 } }
