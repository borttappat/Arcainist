id: ritual-of-the-double-monkey
name: "Ritual of the Double Monkey"
trade: arcanist
types: [tactic]
set: "Seed 2"
rarity: common
text: |
  An opponent discards a card. If you control [O][O][O], that player discards another card. If you control [O][O][O][O][O][O][O][O], that player discards another card.
  FLIP UP: 2 [O]
rules:
  - play:
      effect:
        - discard: { who: opponent, count: 1 }
        - if: { cond: { icons: { obsession: 3 } }, then: [ discard: { who: opponent, count: 1 } ] }
        - if: { cond: { icons: { obsession: 8 } }, then: [ discard: { who: opponent, count: 1 } ] }
  - flip_up: { pay: 2, threshold: { obsession: 1 } }
