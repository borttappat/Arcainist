id: "moist-cave-of-the-darkpump"
name: "Moist Cave of the Darkpump"
trade: none
types: [faction]
set: "Seed Saga"

influence: 20
starting_resources: { specific: { obsession: 1 }, any_staples: 1 }
starting_draw: { first: 8, second: 9 }

text: |
  STARTING RESOURCES: 1 Obsession, 1 staple resource
  STARTING DRAW: 8 going first, 9 going second
  RESTORE RULE: At the start of your turn, restore all your depleted cards and detach all resources from your faction.
  DEVELOP RULE: At the start of your turn, draw a card or play a resource.
  DRAW
  COST: Pay 3.
  EFFECT: Draw a card.
  RESOURCE
  COST: Pay 4.
  EFFECT: Play a resource.
  LUCUBRATE
  COST: Pay 1.
  EFFECT: Look at the top card of your deck. You may put that card on the bottom.
restore_rule:
  - restore_all_depleted: you
  - detach_all_resources: you
develop_rule:
  - choose_one:
      - draw: 1
      - play_resource: 1
rules:
  - ability: { name: Draw, cost: [ pay: 3 ], effect: [ draw: 1 ] }
  - ability: { name: Resource, cost: [ pay: 4 ], effect: [ play_resource: 1 ] }
  - ability:
      name: Lucubrate
      cost: [ pay: 1 ]
      effect: [ look: { deck: you, count: 1, bottom: any } ]
