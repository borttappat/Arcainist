id: "clockman-junk-picker"
name: "Clockman Junk Picker"
trade: gearsmith
types: [character]
subtypes: ["mechanic"]
set: "Shade of the Devoured Emperor"
rarity: uncommon

cost: 4
threshold: { elitism: 2 }
stats: { str: 2, life: 1, spd: 3 }

text: |
  When this card enters play, you may search your deck for an item and reveal it. If you do, put it into play as a face-down resource.
  TRASH: [E][E][E][E][E][E]
  COST: Pay 1. Pick an item. Destroy this card.
  EFFECT: Destroy that card.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may:
          - search: { deck: you, for: { item: any }, reveal: true, to: keep, as: found }
          - put_into_play: { card: found, controller: you, as: face_down_resource }
  - ability:
      name: Trash
      threshold: { elitism: 6 }
      cost:
        - pay: 1
        - pick: { as: i, from: { item: any } }
        - destroy: self
      effect: [ destroy: i ]
