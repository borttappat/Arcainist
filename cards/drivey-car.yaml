id: "drivey-car"
name: "Drivey Car"
trade: gearsmith
types: [character]
subtypes: ["vehicle"]
set: "Seed Saga"
rarity: uncommon

cost: 1
threshold: { elitism: 2 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  When this card leaves play, put X Micromajig tokens into play, where X is the number of characters an opponent controls minus the number of characters you control.
rules:
  - trigger: { on: leaves_play, card: self }
    effect:
      - let: { a: { count: { character: { controller: opponent } } }, b: { count: { character: { controller: you } } } }
      - create_token: { card: micromajig-token, count: "a - b" }
