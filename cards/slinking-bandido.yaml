id: "slinking-bandido"
name: "Slinking Bandido"
trade: rogue
types: [character]
keywords: [covert]
subtypes: ["outlaw"]
set: "Seed Saga"
rarity: common

cost: 2
threshold: { deception: 1 }
stats: { str: 1, life: 1, spd: 1 }

text: |
  COVERT
  When this card inflicts damage to a faction, put a token on this card.
  This card gains 1 strength for each token on it.
rules:
  - trigger: { on: damage, source: self, faction: true }
    effect: [ tokens: { card: self, add: 1 } ]
  - static:
      mods: [ { stat: { str: { tokens: self } } } ]
