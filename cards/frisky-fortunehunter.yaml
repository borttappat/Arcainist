id: "frisky-fortunehunter"
name: "Frisky Fortunehunter"
trade: banker
types: [character]
subtypes: ["pirate", "mau"]
set: "Seed Saga"
rarity: common
text: |
  When this card enters play, your faction loses 2 influence.
  When this card leaves play, your faction gains 4 influence.
rules:
  - trigger: { on: enters_play, card: self }
    effect: [ lose_influence: { who: you, amount: 2 } ]
  - trigger: { on: leaves_play, card: self }
    effect: [ gain_influence: { who: you, amount: 4 } ]
