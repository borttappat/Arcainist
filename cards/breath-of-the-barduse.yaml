id: "breath-of-the-barduse"
name: "Breath of the Barduse"
trade: warlord
types: [tactic]
set: "Ungodly Mess"
rarity: rare

cost: 4
threshold: { rage: 2 }

text: |
  EXTRA COST: Deploy this only during your turn.
  Each player destroys 2 character they own. Otherwise, destroy all of that player's characters.
rules:
  - play:
      timing: { your_turn: true }
      effect:
        - each_player:
            - if:
                cond: { gte: [ { count: { character: { owner: you } } }, 2 ] }
                then:
                  - pick: { as: d, from: { character: { owner: you } }, count: 2, exactly: true, choose: true, prompt: "Destroy 2 characters you own." }
                  - destroy: d
                else:
                  - destroy: { character: { owner: you } }
