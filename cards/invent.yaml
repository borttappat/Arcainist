id: invent
name: Invent
flavor_title: that's the best one of those I've ever seen
trade: gearsmith
types: [tactic]
text: |
  COST - Choose a number for X. Pay X+X.
  EFFECT - Search your deck for X-1 cards. Put them into your hand.
rules:
