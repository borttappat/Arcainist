id: "thabbashite-warmonger"
name: "Thabbashite Warmonger"
trade: warlord
types: [character]
subtypes: ["tyrant"]
set: "Shade of the Devoured Emperor"
rarity: uncommon

cost: 1
threshold: { rage: 1 }
stats: { str: 1, life: 2, spd: 3 }

text: |
  [V]: When a character inflicts battle damage to a faction, X is the number of threshold icons of the character. Inflict X damage to that character's controller's faction.
rules:
  - trigger: { on: damage, faction: true, battle: true, source: { character: any }, requires: { volition: 1 } }
    effect:
      - let: { X: { threshold: source } }
      - damage: { faction: { controller_of: source }, amount: X }
