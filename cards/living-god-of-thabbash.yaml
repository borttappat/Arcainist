id: "living-god-of-thabbash"
name: "Living God of Thabbash"
trade: arcanist
types: [character]
subtypes: ["god"]
set: "Seed Saga"
rarity: rare
text: |
  When a character you control leaves play, an opponent discards a card.
  HIGHER CALLING
  COST: Pay 2. Pick a character you control.
  EFFECT: Put the character into its owner's hand.
rules:
  - trigger: { on: leaves_play, player: you, card: { character: any } }
    effect: [ discard: { who: opponent, count: 1 } ]
  - ability:
      name: Higher Calling
      cost:
        - pay: 2
        - pick: { as: c, from: { character: { controller: you } } }
      effect: [ move: { card: c, to: hand } ]
