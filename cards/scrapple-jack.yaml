id: "scrapple-jack"
name: "Scrapple-Jack"
trade: gearsmith
types: [character]
subtypes: ["horsemajig"]
set: "Holy Heist"
rarity: uncommon
text: |
  EXTRA COST: You may destroy a Micromajig token you control.
  When this card enters play, if you destroyed a Micromajig token as part of its cost, you may pick an item in your discard pile and put it into your hand.
rules:
  - play:
      cost:
        - pick: { as: m, from: { character: { controller: you, token: true } }, choose: true, optional: true, prompt: "You may destroy a Micromajig token you control." }
        - if:
            cond: { defined: m }
            then: [ destroy: m ]
      effect:
        - if:
            cond: { defined: m }
            then:
              - pick: { as: i, from: { item: { zone: discard, owner: you } }, optional: true }
              - if:
                  cond: { defined: i }
                  then: [ move: { card: i, to: hand } ]
