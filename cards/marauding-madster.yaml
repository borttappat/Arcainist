id: "marauding-madster"
name: "Marauding Madster"
trade: warlord
types: [character]
subtypes: ["berserker"]
set: "Shade of the Devoured Emperor"
rarity: rare

cost: 1
threshold: { rage: 4 }
stats: { str: 3, life: 4, spd: 3 }

text: |
  EXTRA COST: Pick a character you control.
  When this card enters play, destroy the picked character.
  If this character would be put into your discard pile from anywhere, shuffle it into your deck instead.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { controller: you } } }
      effect: [ destroy: c ]
  - static:
      mods: [ { redirect: { to: discard, instead: deck_shuffle } } ]
      zone: any
