id: "top-secret-subterranean-goofarium"
name: "Top-Secret Subterranean Goofarium"
trade: gearsmith
types: [location]
set: "1st Edition Part 2"
rarity: rare

cost: 2
threshold: { elitism: 2 }
structure: 4

text: |
  Characters with COVERT cannot inflict damage to this card.
  When you are attacked, you may detach up to X resources from your faction, where X is the number of members in the attacking party.
rules:
  - static:
      mods: [ { damage: { set: 0, from: { character: { keyword: covert } } } } ]
  - trigger: { on: party_formed, player: opponent, side: attacking }
    effect:
      - let: { X: { count: { character: { attacking: true } } } }
      - pick: { as: r, from: { resource: { controller: you, spent: true } }, count: X, up_to: true, choose: true, optional: true, prompt: "Detach up to X resources from your faction." }
      - if:
          cond: { defined: r }
          then: [ detach: { card: r } ]
