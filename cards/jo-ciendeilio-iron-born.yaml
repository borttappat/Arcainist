id: "jo-ciendeilio-iron-born"
name: "Jo Ciendeilio, Iron Born"
trade: gearsmith
types: [character]
subtypes: ["jo", "blade of questionable morality"]
set: "Ungodly Mess"
rarity: rare
text: |
  UNIQUE JO
  FEALTY: While this card is in your hand and you control at least 4 staple resources of different trades, reduce this card's threshold requirement by any 3 resource icons.
  When this card enters or leaves play, you may search your deck for a gearsmith item and reveal it. If you do, put it into your hand.
rules:
  - unique: Jo
  - static:
      zone: hand
      while: { gte: [ { different_staples: you }, 4 ] }
      mods: [ { threshold_reduce: 3 } ]
  - trigger: { on: enters_play, card: self }
    effect:
      - may:
          - search: { deck: you, for: { item: { trade: gearsmith } }, reveal: true, to: hand }
  - trigger: { on: leaves_play, card: self }
    effect:
      - may:
          - search: { deck: you, for: { item: { trade: gearsmith } }, reveal: true, to: hand }
