id: "foment"
name: "Foment"
trade: arcanist
types: [tactic]
set: "Seed 2"
rarity: common

cost: 0
threshold: { obsession: 2 }
flip_up: { cost: 1, threshold: { obsession: 2 }, steps: [ { play_resource: 1 } ] }

text: |
  EXTRA COST: Pick a resource you control. (You can pick face-down resources.)
  Put the resource into its owner's hand. Draw a card.
  FLIP UP: 1 [O][O] and play a resource.
rules:
  - play:
      cost:
        - pick: { as: r, from: { resource: { controller: you } } }
      effect:
        - move: { card: r, to: hand }
        - draw: 1
