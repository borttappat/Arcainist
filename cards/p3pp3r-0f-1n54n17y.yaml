id: "p3pp3r-0f-1n54n17y"
name: "P3pp3r 0f 1n54n17y"
trade: gearsmith
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Seed Saga"
rarity: rare

cost: 6
threshold: { elitism: 1 }
gear: { str: 3, life: 3 }

text: |
  ATTACH TO CHARACTER
  The attached character gains 3 strength and 3 life.
  At the start of each opponent's turn, restore the attached character.
  SPIT OUT
  COST: Destroy this card. Pick a character.
  EFFECT: This turn, the character gains 3 strength and 3 life. Restore it.
rules:
  - trigger: { on: start_of_turn, player: opponent }
    effect: [ restore: host ]
  - ability:
      name: Spit Out
      cost:
        - destroy: self
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { str: 3, life: 3 }, target: c } ] }
        - restore: c
