id: discommodiousness
name: "Discommodiousness"
trade: gearsmith
types: [tactic]
set: "2nd Edition"
rarity: rare
text: |
  An opponent reveals their hand. Shuffle all tactics revealed this way into their deck. That player draws X cards, where X is the number of tactics shuffled into their deck. Draw a card.
rules:
  - play:
      effect:
        - reveal_hand: opponent
        - let: { X: { count: { tactic: { zone: hand, owner: opponent } } } }
        - move: { card: { tactic: { zone: hand, owner: opponent } }, to: deck_shuffle }
        - draw: { who: opponent, count: X }
        - draw: 1
