id: "pandering-politician"
name: "Pandering Politician"
trade: banker
types: [character]
subtypes: ["mau", "politician"]
set: "Ungodly Mess"
rarity: common

cost: 3
threshold: { greed: 2 }
stats: { str: 1, life: 3, spd: 3 }

text: |
  PANDER
  COST: Deplete this card. Pick a character or item.
  EFFECT: Remove a token from the picked card.
rules:
  - ability:
      name: Pander
      cost:
        - deplete: self
        - pick: { as: c, from: [ { character: any }, { item: any } ] }
      effect: [ tokens: { card: c, remove: 1 } ]
