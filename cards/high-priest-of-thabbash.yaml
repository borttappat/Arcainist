id: "high-priest-of-thabbash"
name: "High-Priest of Thabbash"
trade: arcanist
types: [character]
subtypes: ["gloamspike", "priest"]
set: "Seed Saga"
rarity: rare

cost: 4
threshold: { obsession: 3 }
stats: { str: 3, life: 3, spd: 3 }

text: |
  UNIQUE GLOAMSPIKE
  NEGATE
  COST: Pay 2. Deplete this card. Discard a card. Pick a card being deployed of the same type as the discarded card.
  EFFECT: Terminate the card being deployed.
rules:
  - unique: Gloamspike
  - ability:
      name: Negate
      timing: { response_to: { deploying: { card: any } } }
      cost:
        - pay: 2
        - deplete: self
        - discard: { count: 1, as: d }
        - require:
            any:
              - { all: [ { matches: [ d, { character: { zone: discard } } ] }, { matches: [ responded, { character: { zone: stack } } ] } ] }
              - { all: [ { matches: [ d, { tactic: { zone: discard } } ] }, { matches: [ responded, { tactic: { zone: stack } } ] } ] }
              - { all: [ { matches: [ d, { item: { zone: discard } } ] }, { matches: [ responded, { item: { zone: stack } } ] } ] }
              - { all: [ { matches: [ d, { location: { zone: discard } } ] }, { matches: [ responded, { location: { zone: stack } } ] } ] }
      effect: [ terminate: responded ]
