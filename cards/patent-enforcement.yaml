id: "patent-enforcement"
name: "Patent Enforcement"
trade: gearsmith
types: [tactic]
set: "2nd Edition"
rarity: rare
text: |
  EXTRA COST: Deploy this only in response to an item being deployed. Pay X, where X is its numeric cost.
  The item enters play under your control.
rules:
  - play:
      timing: { response_to: { deploying: { item: any } } }
      cost: [ pay: { cost: responded } ]
      effect: [ steal_deploy: responded ]
