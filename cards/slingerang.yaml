id: "slingerang"
name: "Slingerang"
trade: gearsmith
types: [item]
set: "2nd Edition"
rarity: uncommon

cost: 2
threshold: { elitism: 2 }

text: |
  This card enters play with 3 tokens on it.
  When an opponent deploys a character, you may remove a token from this card.
  CHEAP SHOT
  COST: Use this only if no tokens are on this card and only if an opponent deployed a character this turn. Destroy this card. Pick a character.
  EFFECT: Destroy the character.
enters_with_tokens: 3
rules:
  - trigger: { on: played, player: opponent, card: { character: { zone: any } } }
    effect:
      - if:
          cond: { gt: [ { tokens: self }, 0 ] }
          then:
            - may: { prompt: "remove a token from Slingerang", steps: [ tokens: { card: self, remove: 1 } ] }
  - ability:
      name: Cheap Shot
      cost:
        - require: { all: [ { eq: [ { tokens: self }, 0 ] }, { gt: [ { played_this_turn: { by: opponent, type: character } }, 0 ] } ] }
        - destroy: self
        - pick: { as: c, from: { character: any } }
      effect: [ destroy: c ]
