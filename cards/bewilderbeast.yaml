id: "bewilderbeast"
name: "Bewilderbeast"
trade: arcanist
types: [character]
subtypes: ["beast", "monstrosity"]
set: "Holy Heist"
rarity: common
text: |
  When an opponent discards any number of cards, this card gains X strength and X life this turn, where X is the number of cards discarded.
rules:
  - trigger: { on: discarded, player: opponent }
    effect:
      - create_effect: { duration: turn, mods: [ { stat: { str: 1, life: 1 } } ] }
