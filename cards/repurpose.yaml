id: "repurpose"
name: "Repurpose"
trade: gearsmith
types: [tactic]
set: "Seed Saga"
rarity: common
text: |
  EXTRA COST: Pick an item.
  Destroy the item. Draw a card.
  FLIP UP: 2 [E][E]
rules:
  - play:
      cost:
        - pick: { as: i, from: { item: any } }
      effect:
        - destroy: i
        - draw: 1
  - flip_up: { pay: 2, threshold: { elitism: 2 } }
