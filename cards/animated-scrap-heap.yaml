id: "animated-scrap-heap"
name: "Animated Scrap Heap"
trade: gearsmith
types: [character]
subtypes: ["golem", "majig"]
set: "Ungodly Mess"
rarity: rare

cost: 0
threshold: { elitism: 4 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  EXTRA COST: Choose a number for X. Pay X.
  This card enters play with X tokens on it.
  This card gains 1 strength and 1 life for each token on it.
  EXPAND
  COST: Pay 3.
  EFFECT: Put a token on this card.
enters_with_tokens: X
rules:
  - play:
      cost: [ choose_number: { as: X, min: 0 }, pay: X ]
  - static:
      mods: [ { stat: { str: { tokens: self }, life: { tokens: self } } } ]
  - ability:
      name: Expand
      cost: [ pay: 3 ]
      effect: [ tokens: { card: self, add: 1 } ]
