id: "contriving-engineer"
name: "Contriving Engineer"
trade: gearsmith
types: [character]
subtypes: ["inventor"]
set: "Ungodly Mess"
rarity: ultra-rare

cost: 4
threshold: { elitism: 1 }
stats: { str: 2, life: 1, spd: 3 }

text: |
  When this card enters play, you may search your deck for a card named Elitism and reveal it. If you do, put it into play. Attach it to your faction.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may:
          - search: { deck: you, for: { card: { name: Elitism } }, reveal: true, to: keep, as: found }
          - put_into_play: { card: found, controller: you, attached: true }
