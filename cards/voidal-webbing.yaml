id: "voidal-webbing"
name: "Voidal Webbing"
trade: arcanist
types: [tactic]
set: "1st Edition"
rarity: common

cost: 2
threshold: { obsession: 1 }

text: |
  EXTRA COST: Pick a character.
  This turn, the character loses 1 speed.
rules:
