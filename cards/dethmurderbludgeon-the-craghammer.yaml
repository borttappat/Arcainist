id: dethmurderbludgeon-the-craghammer
name: "Dethmürderblüdgeon, the Craghammer"
trade: warlord
types: [item]
subtypes: [gear]
set: "2nd Edition"
rarity: rare

cost: 5
threshold: { rage: 2 }
gear: { str: 2, life: 2, spd: 0 }

text: |
  UNIQUE DETHMÜRDERBLÜDGEON
  ATTACH TO CHARACTER
  The attached character gains 2 strength and 2 life.
  When the attached character is blocked, an opponent's faction loses 2 influence.
  When the attached character inflicts damage to a faction, you may pick a character. If you do, inflict 2 damage to it.
  If this card would be put into a discard pile from play, put it into its owner's hand instead.
attach_to: character
rules:
  - unique: Dethmurderbludgeon
  - trigger: { on: blocked, card: { host_of: self } }
    effect:
      - lose_influence: { who: opponent, amount: 2 }
  - trigger: { on: damage, source: { host_of: self }, faction: true }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - damage: { card: c, amount: 2 }
  - static:
      mods:
        - { redirect: { from: play, to: discard, instead: hand } }
