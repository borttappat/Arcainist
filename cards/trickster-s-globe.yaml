id: trickster-s-globe
name: "Trickster's Globe"
trade: rogue
types: [item]
cost: 4
threshold: { deception: 3 }
text: |
  If you would inflict damage to an opponent's faction, for each damage you would inflict, you may put up to that many cards from the top of its owner's deck into their discard pile instead. When a player has no cards in their deck, they lose the game.
rules:
  - replace: { event: faction_damage, by: you, to: opponent, label: "mill that many cards instead" }
    instead:
      - mill: { who: player, count: amount }
  - static: { mods: [ { lose_when_deck_empty: true } ] }
