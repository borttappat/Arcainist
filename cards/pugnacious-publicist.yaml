id: "pugnacious-publicist"
name: "Pugnacious Publicist"
trade: banker
types: [character]
subtypes: ["publicist"]
set: "1st Edition Part 2"
rarity: common

cost: 3
threshold: { greed: 2 }
stats: { str: 1, life: 3, spd: 3 }

text: |
  When this card enters play, all your characters gain 1 life this turn.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - create_effect: { duration: turn, mods: [ { stat: { life: 1 }, target: { character: { controller: you } } } ] }
