id: "mercenary-s-creed"
name: "Mercenary's Creed"
trade: rogue
types: [item]
attach_to: character
subtypes: ["gear"]
set: "2nd Edition"
rarity: uncommon

cost: 3
threshold: { deception: 2 }

text: |
  ATTACH TO CHARACTER
  BRIBE
  COST: Any player may use this ability. Pay 3.
  EFFECT: Take control of the attached character.
  BLACKMAIL
  COST: Use this only if you own this card. Pay 2.
  EFFECT: Take control of the attached character.
rules:
  - ability:
      name: Bribe
      both_players: true
      cost: [ pay: 3 ]
      effect: [ take_control: { card: host, who: you } ]
  - ability:
      name: Blackmail
      cost:
        - require: { matches: [ self, { card: { owner: you } } ] }
        - pay: 2
      effect: [ take_control: { card: host, who: you } ]
