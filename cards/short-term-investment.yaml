id: "short-term-investment"
name: "Short Term Investment"
trade: banker
types: [item]
set: "1st Edition Part 2"
rarity: rare
text: |
  This card comes into play with 2 tokens on it.
  At the start of your turn, remove a token from this card.
  RETURN
  COST: Use this only if there are no tokens on this card. Destroy it.
  EFFECT: Draw 3 cards.
enters_with_tokens: 2
rules:
  - trigger: { on: start_of_turn, player: you, while: { gt: [ { tokens: self }, 0 ] } }
    effect:
      - if:
          cond: { gt: [ { tokens: self }, 0 ] }
          then: [ tokens: { card: self, remove: 1 } ]
  - ability:
      name: Return
      cost:
        - require: { eq: [ { tokens: self }, 0 ] }
        - destroy: self
      effect: [ draw: 3 ]
