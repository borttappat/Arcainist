id: craniata-nester
name: "Craniata Nester"
trade: rogue
types: [character]
subtypes: [monstrosity]
cost: 3
threshold: { deception: 3 }
stats: { str: 2, life: 2, spd: 3 }
text: |
  When a card that provides at least [D] enters play under your control, you may pick an opponent. If you do, put the top card of their deck into their discard pile. This card gains 1 strength and 1 life for each character card in each opponent's discard pile.
rules:
  - trigger: { on: enters_play, card: { controller: you, provides_at_least: { deception: 1 } } }
    effect:
      - may: [ mill: { who: opponent, count: 1 } ]
  - static:
      mods:
        - stat:
            str: { count: { character: { zone: discard, owner: opponent } } }
            life: { count: { character: { zone: discard, owner: opponent } } }
