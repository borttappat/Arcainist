id: "ecto-agriolimax"
name: "Ecto-Agriolimax"
trade: arcanist
types: [character]
subtypes: ["insect"]
set: "Ungodly Mess"
rarity: common

cost: 3
threshold: { obsession: 2 }
stats: { str: 1, life: 1, spd: 2 }

text: |
  This card enters play with 2 tokens on it.
  SLITHER
  COST: Remove a token from this card. Pick an item or location.
  EFFECT: Put the card into its owner's hand.
enters_with_tokens: 2
rules:
  - ability:
      name: Slither
      cost:
        - tokens: { card: self, remove: 1 }
        - pick: { as: c, from: [ { item: any }, { location: any } ] }
      effect: [ move: { card: c, to: hand } ]
