id: "cheats-mcguillicutty"
name: "Cheats McGuillicutty"
trade: rogue
types: [character]
subtypes: ["pluck", "grifter"]
set: "2nd Edition"
rarity: rare

cost: 6
threshold: { deception: 2 }
stats: { str: 2, life: 1, spd: 3 }

text: |
  UNIQUE PLUCK
  The top card of your deck is revealed at all times.
  BOTTOM DEAL
  COST: Pay 1.
  EFFECT: Put the top card of your deck on the bottom.
  CHEAT
  COST: Deplete this card.
  EFFECT: Reveal the top card of your deck. You may deploy it. (You can't play resources with this ability.)
  CHANGE COSTUME
  COST: Pay 3. Shuffle this card into its owner's deck.
  EFFECT: Search your deck for a pluck card with a different name than this card and reveal it. Put it into play under your control.
rules:
  - unique: Pluck
  - static:
      mods: [ { reveal_top: you, target: none } ]
  - ability:
      name: Bottom Deal
      cost: [ pay: 1 ]
      effect: [ move: { card: top_of_you, to: deck_bottom } ]
  - ability:
      name: Cheat
      cost: [ deplete: self ]
      effect:
        - let: { t: { card: top_of_you } }
        - if:
            cond: { defined: t }
            then:
              - reveal: t
              - if:
                  cond: { not: { matches: [ t, { card: { zone: deck, type: resource } } ] } }
                  then:
                    - may:
                        prompt: "deploy the revealed card"
                        steps: [ play_card: { card: t } ]
  - ability:
      name: Change Costume
      cost:
        - pay: 3
        - move: { card: self, to: deck_shuffle }
      effect:
        - let: { me: { name_of: self } }
        - search: { deck: you, for: { card: { subtype: pluck, name_not: me } }, reveal: true, to: play }
