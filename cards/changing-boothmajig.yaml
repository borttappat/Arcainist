id: "changing-boothmajig"
name: "Changing Boothmajig"
trade: gearsmith
types: [character]
subtypes: ["majig"]
set: "Holy Heist"
rarity: rare

cost: 2
threshold: { elitism: 2 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  WARDROBE CHANGE
  COST: Deplete this card. Pick a character. Pick a "gear" card you control.
  EFFECT: Attach the "gear" card to the character.
rules:
  - ability:
      name: Wardrobe Change
      cost:
        - deplete: self
        - pick: { as: c, from: { character: any } }
        - pick: { as: g, from: { item: { subtype: gear, controller: you } } }
      effect:
        - attach: { card: g, to: c }
