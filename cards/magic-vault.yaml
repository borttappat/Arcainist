id: "magic-vault"
name: "Magic Vault"
trade: banker
types: [item]
set: "1st Edition"
rarity: uncommon

cost: 6
threshold: { greed: 1 }

text: |
  At the start of your turn, you may pick a faction. If you do, it gains 2 influence.
rules:
  - trigger: { on: start_of_turn, player: you }
    effect:
      - pick: { as: f, from: { faction: any }, optional: true }
      - if:
          cond: { defined: f }
          then: [ gain_influence: { who: { controller_of: f }, amount: 2 } ]
