id: "banner-of-avarice"
name: "Banner of Avarice"
trade: universal
types: [item]
subtypes: ["banner"]
set: "Seed Saga"
rarity: uncommon

cost: 2
provides: { greed: 1 }

text: |
  PROVIDES: [G]
  When a card that provides at least [G] enters play under your control, you may pay 1. If you do, pick a card in a discard pile and remove it from the game. If you do, you may pick a character. That character gains 1 life this turn.
  BURN IT
  COST: Pay 2. Destroy this card.
  EFFECT: Draw 2 cards.
rules:
  - trigger: { on: enters_play, card: { controller: you, provides_at_least: { greed: 1 }, not_self: true } }
    effect:
      - may_pay:
          amount: 1
          prompt: "remove a card in a discard pile from the game"
          then:
            - pick: { as: d, from: { card: { zone: discard } } }
            - if:
                cond: { defined: d }
                then:
                  - void: d
                  - pick: { as: c, from: { character: any }, optional: true }
                  - if:
                      cond: { defined: c }
                      then: [ modify: { card: c, stat: life, gain: 1 } ]
  - ability:
      name: Burn It
      cost: [ pay: 2, destroy: self ]
      effect: [ draw: 2 ]
