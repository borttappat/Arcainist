id: "direstock-cuffs"
name: "Direstock Cuffs"
trade: gearsmith
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Ungodly Mess"
rarity: common

cost: 1
threshold: { elitism: 1 }
flip_up: { cost: 1, threshold: { elitism: 1 } }

text: |
  ATTACH TO CHARACTER
  The attached character loses COVERT. If the attached character has a [V] icon in its rules text, treat the attached character as though it had no rules text.
  MOVE
  COST: Pick a character that is not in battle. Pay 2.
  EFFECT: Attach this card to the character.
  FLIP UP: 1 [E]
rules:
  - static:
      mods:
        - { lose_keyword: covert, target: host }
        - { no_rules: true, target: host, while: { matches: [ host, { character: { text_has: "[V]" } } ] } }
  - ability:
      name: Move
      cost:
        - pick: { as: c, from: { character: { attacking: false, blocking: false } } }
        - pay: 2
      effect: [ attach: { card: self, to: c } ]
