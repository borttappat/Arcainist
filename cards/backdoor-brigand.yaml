id: "backdoor-brigand"
name: "Backdoor Brigand"
trade: rogue
types: [character]
subtypes: ["outcast"]
set: "Shade of the Devoured Emperor"
rarity: uncommon

cost: 3
threshold: { deception: 1 }
stats: { str: 2, life: 3, spd: 4 }
flip_up: { cost: 3, threshold: { deception: 2 } }

text: |
  EXIT STAGE RIGHT
  COST: Use this only if this card has not assigned damage this turn. Pay 1.
  EFFECT: Flip this card face-down under its owner's control.
  FLIP UP: 3 [D][D]
rules:
  - ability:
      name: Exit Stage Right
      cost:
        - require: { not: { assigned_damage: self } }
        - pay: 1
      effect:
        - flip_face_down: { card: self, controller: owner }
