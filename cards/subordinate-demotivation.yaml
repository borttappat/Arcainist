id: "subordinate-demotivation"
name: "Subordinate Demotivation"
trade: banker
types: [tactic]
set: "Seed Saga"
rarity: uncommon

cost: 3
threshold: { greed: 1 }

text: |
  Destroy the character an opponent controls with the lowest numeric cost. If there is a tie, you decide which character is destroyed.
rules:
  - play:
      effect:
        - destroy: { from: { character: { controller: opponent, cheapest: true } }, choose: true }
