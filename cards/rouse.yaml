id: "rouse"
name: "Rouse"
trade: arcanist
types: [tactic]
set: "Seed Saga"
rarity: uncommon

cost: 1
threshold: { obsession: 3 }

text: |
  EXTRA COST: Pick a tactic in your discard pile.
  Put the tactic on the top of your deck.
  RECUR: [O][O][O]
  COST: Use this only if this card is in your discard pile. Pay 1. Remove this card from the game. Pick a tactic in your discard pile.
  EFFECT: Put the tactic on the top of your deck.
rules:
  - play:
      cost:
        - pick: { as: t, from: { tactic: { zone: discard, owner: you } } }
      effect: [ move: { card: t, to: deck_top } ]
  - ability:
      name: Recur
      keyword: recur
      threshold: { obsession: 3 }
      from: discard
      cost:
        - pay: 1
        - void: self
        - pick: { as: t, from: { tactic: { zone: discard, owner: you } } }
      effect: [ move: { card: t, to: deck_top } ]
