id: "community-chest"
name: "Community Chest"
trade: rogue
types: [item]
set: "Seed 3"
rarity: fixed

cost: 2
threshold: { deception: 1 }

text: |
  UNIQUE COMMUNITY CHEST
  At the start of each player's turn, each player may draw a card or play a resource.
  If you control at least [D] and choose to put this card on the bottom of your deck as part of your mulligan at the start of a game, you may reveal it. If you do, draw a card at the start of your turn.
rules:
  - unique: Community Chest
  # The mulligan clause (reveal it to draw a card at the start of your turn) is resolved manually.
  - trigger: { on: start_of_turn, player: any }
    effect:
      - each_player:
          - choose_one:
              - { label: "Draw a card", steps: [ draw: 1 ] }
              - { label: "Play a resource", steps: [ play_resource: { optional: true } ] }
              - { label: "Neither", steps: [] }
