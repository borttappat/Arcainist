id: "microdefense-autosystem"
name: "Microdefense Autosystem"
trade: gearsmith
types: [location]
set: "Holy Heist"
rarity: uncommon

cost: 5
threshold: { elitism: 2 }
structure: 3

text: |
  When you form a blocking party with at least 1 character, you may pay 1. If you do, put a Micromajig token into play under your control. Add it to the blocking party.
rules:
  - trigger: { on: party_formed, side: blocking, player: you }
    effect:
      - may_pay:
          amount: 1
          prompt: "put a Micromajig token into play and add it to the blocking party"
          then:
            - create_token: { card: micromajig-token, as: tk }
            - add_to_battle: { card: tk, side: blocking }
