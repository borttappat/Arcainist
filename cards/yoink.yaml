id: yoink
name: "Yoink!"
trade: rogue
types: [tactic]
set: "2nd Edition"
rarity: uncommon

cost: 1
threshold: { deception: 1 }

text: |
  EXTRA COST: Pick a gear card. Pick a character.
  Take control of the gear card. Attach it to the character.
rules:
  - play:
      cost:
        - pick: { as: g, from: { card: { subtype: gear } } }
        - pick: { as: c, from: { character: any } }
      effect:
        - take_control: { card: g }
        - attach: { card: g, to: c }
