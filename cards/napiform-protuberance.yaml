id: "napiform-protuberance"
name: "Napiform Protuberance"
trade: arcanist
types: [item]
attach_to: character
subtypes: ["gear"]
set: "1st Edition"
rarity: common
text: |
  ATTACH TO CHARACTER
  This card enters play with 1 token on it.
  At the start of your turn, you may put a token on this card.
  The attached character loses 1 strength, 1 life, and 1 speed for each token on this card.
enters_with_tokens: 1
rules:
  - trigger: { on: start_of_turn, player: you }
    effect:
      - may: { prompt: "put a token on Napiform Protuberance", steps: [ tokens: { card: self, add: 1 } ] }
  - static:
      mods: [ { stat: { str: { neg: { tokens: self } }, life: { neg: { tokens: self } }, spd: { neg: { tokens: self } } }, target: host } ]
