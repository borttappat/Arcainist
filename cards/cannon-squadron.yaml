id: "cannon-squadron"
name: "Cannon Squadron"
trade: warlord
types: [character]
subtypes: ["soldier"]
set: "1st Edition"
rarity: common

cost: 9
threshold: { rage: 2 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  FIRE!
  COST: Deplete this card. Pick 2 or fewer characters.
  EFFECT: Inflict up to 2 damage divided however you want to the characters.
rules:
  - ability:
      name: Fire!
      cost:
        - deplete: self
        - pick: { as: c, from: { character: any }, count: 2, up_to: true }
      effect:
        - divide_damage: { amount: 2, from: c, up_to: true }
