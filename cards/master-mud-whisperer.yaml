id: "master-mud-whisperer"
name: "Master Mud Whisperer"
trade: gearsmith
types: [character]
subtypes: ["mud whisperer"]
set: "Seed Saga"
rarity: rare

cost: 6
threshold: { elitism: 2 }
stats: { str: 4, life: 4, spd: 2 }

text: |
  At the start of each opponent's turn, you may restore all characters you control.
rules:
  - trigger: { on: start_of_turn, player: opponent }
    effect:
      - may:
          prompt: "restore all characters you control"
          steps: [ restore: { character: { controller: you } } ]
