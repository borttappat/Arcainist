id: "fat-pants"
name: "Fat Pants"
trade: banker
types: [item]
attach_to: character
subtypes: ["gear"]
set: "1st Edition Part 2"
rarity: uncommon
text: |
  ATTACH TO CHARACTER
  The attached character gains 1 strength and 2 life.
  HANDOFF
  COST: Pay 1. Deplete a character you control that is not in a battle.
  EFFECT: Attach this card to the character.
rules:
  - ability:
      name: Handoff
      cost:
        - pay: 1
        - pick: { as: c, from: { character: { controller: you, attacking: false, blocking: false, depleted: false } }, choose: true, prompt: "Deplete a character you control that is not in a battle." }
        - deplete: c
      effect: [ attach: { card: self, to: c } ]
