id: "luxurious-gaming-establishment"
name: "Luxurious Gaming Establishment"
trade: rogue
types: [location]
set: "Seed Saga"
rarity: uncommon

cost: 3
threshold: { deception: 1 }
structure: 3

text: |
  At the start of your turn, you may pick a character. If you do, it loses 1 speed this turn.
rules:
  - trigger: { on: start_of_turn, player: you }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ modify: { card: c, stat: spd, lose: 1 } ]
