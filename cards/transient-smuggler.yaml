id: "transient-smuggler"
name: "Transient Smuggler"
trade: rogue
types: [character]
subtypes: ["smuggler"]
set: "Seed Saga"
rarity: uncommon

cost: 5
threshold: { deception: 1 }
stats: { str: 2, life: 3, spd: 3 }

text: |
  SMUGGLE
  COST: Deplete this card. Pick a character with 2 strength or less.
  EFFECT: This turn, the character gains COVERT.
rules:
  - ability:
      name: Smuggle
      cost:
        - deplete: self
        - pick: { as: c, from: { character: { str_lte: 2 } } }
      effect:
        - create_effect: { duration: turn, mods: [ { keyword: covert, target: c } ] }
