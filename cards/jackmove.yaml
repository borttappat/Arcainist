id: jackmove
name: "Jackmove"
trade: rogue
types: [tactic]
set: "2nd Edition"
rarity: rare
text: |
  EXTRA COST: Choose a number for X. Pay X+X.
  Reveal up to the top X cards of an opponent's deck. Put all revealed characters and items into play under your control. Put the remaining cards into that player's discard pile.
rules:
  - play:
      cost:
        - choose_number: { as: X }
        - pay: "X + X"
      effect:
        - reveal_top: { who: opponent, count: X, as: rev }
        - put_into_play: { card: [ { character: { zone: deck, among: rev } }, { item: { zone: deck, among: rev } } ] }
        - move: { card: { card: { zone: deck, among: rev } }, to: discard }
