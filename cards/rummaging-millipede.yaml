id: "rummaging-millipede"
name: "Rummaging Millipede"
trade: arcanist
types: [character]
keywords: [covert]
subtypes: ["lurker"]
set: "2nd Edition"
rarity: uncommon

cost: 5
threshold: { obsession: 2 }
stats: { str: 3, life: 1, spd: 3 }

text: |
  COVERT
  When this card enters play, you may pick a tactic in your discard pile. If you do, put it into your hand.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - pick: { as: t, from: { tactic: { zone: discard, owner: you } }, optional: true }
      - if:
          cond: { defined: t }
          then: [ move: { card: t, to: hand } ]
