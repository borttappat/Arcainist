id: "sagacious-31f"
name: "Sagacious 31f"
trade: gearsmith
types: [character]
subtypes: ["31f"]
set: "1st Edition Part 2"
rarity: rare
text: |
  When an attacking party is formed including this card and at least 2 other characters, you may search your deck for a card. If you do, put it into your hand.
rules:
  - trigger: { on: party_formed, player: you, side: attacking, while: { attacking: self } }
    effect:
      - if:
          cond: { gte: [ { count: { character: { party_with: self } } }, 3 ] }
          then:
            - may:
                prompt: "search your deck for a card and put it into your hand"
                steps: [ search: { deck: you, for: { card: any }, to: hand } ]
