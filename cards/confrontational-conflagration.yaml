id: "confrontational-conflagration"
name: "Confrontational Conflagration"
trade: warlord
types: [tactic]
set: "Shade of the Devoured Emperor"
rarity: common

cost: 1
threshold: { rage: 1 }
flip_up: { cost: 1, threshold: { rage: 3 } }

text: |
  EXTRA COST: Deploy this only during your turn not during a battle. Pick a character you control. Pick a character an opponent controls. You may pick a location.
  If the picked character you control is a "dragon", X is 2 times its strength, otherwise X is its strength. Inflict X damage to each picked card.
  FLIP UP: 1 [R][R][R]
rules:
  - play:
      timing: { your_turn: true, not_in_battle: true }
      cost:
        - pick: { as: m, from: { character: { controller: you } } }
        - pick: { as: t, from: { character: { controller: opponent } } }
        - pick: { as: l, from: { location: any }, optional: true }
      effect:
        - let: { s: { stat: [ m, str ] } }
        - if:
            cond: { matches: [ m, { character: { subtype: dragon } } ] }
            then: [ let: { X: "s + s" } ]
            else: [ let: { X: s } ]
        - damage: { card: m, amount: X }
        - damage: { card: t, amount: X }
        - if:
            cond: { defined: l }
            then: [ damage: { card: l, amount: X } ]
