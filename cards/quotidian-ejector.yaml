id: "quotidian-ejector"
name: "Quotidian Ejector"
trade: arcanist
types: [character]
subtypes: ["ritualist"]
set: "2nd Edition"
rarity: common

cost: 3
threshold: { obsession: 2 }
stats: { str: 1, life: 1, spd: 3 }

text: |
  This card enters play with 2 tokens on it.
  EJECT
  COST: Remove 2 tokens from this card. Pick a non-resource card.
  EFFECT: Put the card into its owner's hand.
enters_with_tokens: 2
rules:
  - ability:
      name: Eject
      cost:
        - tokens: { card: self, remove: 2 }
        - pick: { as: c, from: { card: { not_type: resource } } }
      effect: [ move: { card: c, to: hand } ]
