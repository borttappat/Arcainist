id: "gruesome-sand-beaver"
name: "Gruesome Sand Beaver"
trade: arcanist
types: [character]
keywords: [covert]
subtypes: ["beast"]
set: "Holy Heist"
rarity: uncommon
text: |
  COVERT
  EXTRA COST: Pick a face-down resource you control and put it into its owner's hand.
rules:
