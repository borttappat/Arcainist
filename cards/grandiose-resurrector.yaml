id: "grandiose-resurrector"
name: "Grandiose Resurrector"
trade: banker
types: [character]
subtypes: ["mau"]
set: "Seed Saga"
rarity: rare

cost: 8
threshold: { greed: 2 }
stats: { str: 6, life: 6, spd: 3 }

text: |
  RECUR: [G][G]
  COST: Use this only while this card is in your discard pile. Pay 5. Remove this card from the game. Pick up to 4 characters in your discard pile.
  EFFECT: Put the characters into your hand.
rules:
  - ability:
      name: Recur
      keyword: recur
      threshold: { greed: 2 }
      from: discard
      cost:
        - pay: 5
        - void: self
        - pick: { as: c, from: { character: { zone: discard, owner: you } }, count: 4, up_to: true }
      effect: [ move: { card: c, to: hand } ]
