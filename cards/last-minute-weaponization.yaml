id: "last-minute-weaponization"
name: "Last Minute Weaponization"
trade: gearsmith
types: [tactic]
set: "Ungodly Mess"
rarity: rare
text: |
  EXTRA COST: Destroy an item you control. X was its numeric cost. Pick a character.
  Inflict X+1 damage to the character. You may search your deck for an item with numeric cost X or less, reveal it, and put it into your hand.
  FLIP UP: 2 [E][E][E][E]
rules:
  - play:
      cost:
        - pick: { as: i, from: { item: { controller: you } }, choose: true, prompt: "Destroy an item you control (X is its numeric cost)." }
        - let: { X: { cost: i } }
        - destroy: i
        - pick: { as: c, from: { character: any } }
      effect:
        - damage: { card: c, amount: "X + 1" }
        - may:
            - search: { deck: you, for: { item: { cost_lte: X } }, reveal: true, to: hand }
  - flip_up: { pay: 2, threshold: { elitism: 4 } }
