id: basic-node
name: "Basic Node"
trade: gearsmith
types: [character]
subtypes: [node]
cost: 1
threshold: { elitism: 1 }
stats: { str: 1, life: 1, spd: 4 }
text: |
  When this card enters play, you may search your deck for a "node" card and reveal it. If you do, put it into your hand. If this card is destroyed, destroy all other "node" cards.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may:
          - search: { deck: you, for: { card: { subtype: node } }, reveal: true, to: hand }
  - trigger: { on: destroyed, card: self }
    effect:
      - destroy: { card: { subtype: node, not_self: true } }
