id: "industrious-usage"
name: "Industrious Usage"
trade: gearsmith
types: [tactic]
set: "Shade of the Devoured Emperor"
rarity: common
text: |
  EXTRA COST: Pick an item.
  Destroy the item. Put a Micromajig token into play under your control.
  FLIP UP: 2 [E][E]
rules:
  - play:
      cost:
        - pick: { as: i, from: { item: any } }
      effect:
        - destroy: i
        - create_token: { card: micromajig-token }
  - flip_up: { pay: 2, threshold: { elitism: 2 } }
