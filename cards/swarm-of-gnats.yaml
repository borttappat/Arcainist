id: "swarm-of-gnats"
name: "Swarm of Gnats"
trade: arcanist
types: [character]
subtypes: ["lurker"]
set: "2nd Edition"
rarity: common

cost: 4
threshold: { obsession: 2 }
stats: { str: 2, life: 3, spd: 2 }

text: |
  When this card enters or leaves play, an opponent discards a card.
rules:
  - trigger: { on: enters_play, card: self }
    effect: [ discard: { who: opponent, count: 1 } ]
  - trigger: { on: leaves_play, card: self }
    effect: [ discard: { who: opponent, count: 1 } ]
