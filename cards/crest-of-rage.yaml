id: "crest-of-rage"
name: "Crest of Rage"
trade: universal
types: [item]
subtypes: ["crest"]
set: "Seed 2"
rarity: rare
text: |
  UNIQUE CREST
  PROVIDES: [R][R]
  When a card that provides at least [R] enters play under your control, you may search your deck for a character and reveal it. If you do, put it on top of your deck.
rules:
  - unique: Crest
  - trigger: { on: enters_play, card: { controller: you, provides_at_least: { rage: 1 } } }
    effect:
      - may:
          - search: { deck: you, for: { character: any }, reveal: true, to: deck_top }
