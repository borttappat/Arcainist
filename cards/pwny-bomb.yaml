id: "pwny-bomb"
name: "Pwny Bomb"
trade: gearsmith
types: [item]
subtypes: ["gear"]
set: "Shade of the Devoured Emperor"
rarity: common

cost: 0
threshold: { elitism: 1 }
gear: { str: 1, life: 1 }

text: |
  The attached character gains 1 strength and 1 life.
  When a Micromajig token or "horsemajig" character enters play under your control, you may attach this card to it.
  PWNED
  COST: Pick a Micromajig token or "horsemajig" character that this card is attached to. Pick a character. Destroy this card.
  EFFECT: Inflict 7 damage to the picked characters.
  MOVE
  COST: Pick a character you control. Pay 3.
  EFFECT: Attach this card to the character if you can.
rules:
  - trigger: { on: enters_play, card: [ { character: { controller: you, token: true } }, { character: { controller: you, subtype: horsemajig } } ] }
    effect:
      - may: { prompt: "attach Pwny Bomb to it", steps: [ attach: { card: self, to: it } ] }
  - ability:
      name: Pwned
      cost:
        - pick: { as: h, from: [ { character: { host_of: self, token: true } }, { character: { host_of: self, subtype: horsemajig } } ] }
        - pick: { as: c, from: { character: any } }
        - destroy: self
      effect:
        - damage: { card: h, amount: 7 }
        - damage: { card: c, amount: 7 }
  - ability:
      name: Move
      cost:
        - pick: { as: c, from: { character: { controller: you } } }
        - pay: 3
      effect: [ attach: { card: self, to: c } ]
