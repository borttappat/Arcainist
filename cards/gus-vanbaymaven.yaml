id: "gus-vanbaymaven"
name: "Gus VanBaymaven"
trade: banker
types: [character]
subtypes: ["mau"]
set: "Seed Saga"
rarity: rare
text: |
  UNIQUE GUS
  ALL YOUR BAYS ARE BELONG TO GUS
  COST: Pay 2. Deplete this card. Pick a location.
  EFFECT: Take control of the location.
  FLIP UP: 2 [G][G][G]
rules:
  - unique: Gus
  - ability:
      name: All Your Bays Are Belong to Gus
      cost:
        - pay: 2
        - deplete: self
        - pick: { as: l, from: { location: any } }
      effect: [ take_control: { card: l, who: you } ]
  - flip_up: { pay: 2, threshold: { greed: 3 } }
