id: "damascus-sword-swinger"
name: "Damascus Sword Swinger"
trade: warlord
types: [character]
subtypes: ["soldier"]
set: "Holy Heist"
rarity: common

cost: 6
threshold: { rage: 1 }
stats: { str: 5, life: 5, spd: 2 }

text: |
