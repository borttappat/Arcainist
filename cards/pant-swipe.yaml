id: pant-swipe
name: "Pant Swipe"
trade: rogue
types: [tactic]
set: "Seed Saga"
rarity: rare

cost: 7
threshold: { deception: 3 }
flip_up: { cost: 5, threshold: { deception: 3 } }

text: |
  Put the top 4 cards of an opponent's deck into the void face-down. (You are still allowed to look at them.)
  For the rest of the game, you may deploy the voided cards as though they were in your hand even if you cannot meet their threshold.
  FLIP UP: 5 [D][D][D]
rules:
  - play:
      effect:
        - mill: { who: opponent, count: 4, to: void, face_down: true, tag: true }
        - create_effect:
            duration: game
            mods:
              - { play_from: { ignore_threshold: true }, target: { card: { zone: void, tagged_by: self } } }
