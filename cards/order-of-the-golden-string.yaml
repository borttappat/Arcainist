id: "order-of-the-golden-string"
name: "Order of the Golden String"
trade: none
types: [faction]
set: "Seed Saga"
text: |
  STARTING RESOURCES: 1 Greed, 1 staple resource
  STARTING DRAW: 8 going first, 9 going second
  RESTORE RULE: At the start of your turn, restore all your depleted cards and detach all resources from your faction.
  DEVELOP RULE: At the start of your turn, draw a card or play a resource.
  DRAW
  COST: Pay 3.
  EFFECT: Draw a card.
  RESOURCE
  COST: Pay 4.
  EFFECT: Play a resource.
  CONSPIRE
  COST: Pay 4.
  EFFECT: Draw 2 cards. Discard a card.
restore_rule:
  - restore_all_depleted: you
  - detach_all_resources: you
develop_rule:
  - choose_one:
      - draw: 1
      - play_resource: 1
rules:
  - ability: { name: Draw, cost: [ pay: 3 ], effect: [ draw: 1 ] }
  - ability: { name: Resource, cost: [ pay: 4 ], effect: [ play_resource: 1 ] }
  - ability:
      name: Conspire
      cost: [ pay: 4 ]
      effect: [ draw: 2, discard: 1 ]
