id: "blow-up"
name: "Blow Up"
trade: warlord
types: [tactic]
set: "2nd Edition"
rarity: uncommon

cost: 4
threshold: { rage: 1 }

text: |
  EXTRA COST: Pick an item.
  Destroy the item. That item's controller's faction loses 3 influence.
rules:
  - play:
      cost:
        - pick: { as: c, from: { item: any } }
      effect:
        # The item's controller loses influence first, while it is still in play.
        - lose_influence: { who: { controller_of: c }, amount: 3 }
        - destroy: c
