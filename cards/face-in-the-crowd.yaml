id: "face-in-the-crowd"
name: "Face in the Crowd"
trade: rogue
types: [character]
subtypes: ["outcast"]
set: "2nd Edition"
rarity: uncommon

cost: 6
threshold: { deception: 2 }
stats: { str: 4, life: 5, spd: 3 }

text: |
  While an opponent controls at least 4 characters, this card cannot be blocked.
rules:
  - static:
      while: { gte: [ { count: { character: { controller: opponent } } }, 4 ] }
      mods: [ { cannot_be_blocked: true } ]
