id: "banner-of-fury"
name: "Banner of Fury"
trade: universal
types: [item]
subtypes: ["banner"]
set: "Seed Saga"
rarity: uncommon
text: |
  PROVIDES: [R]
  When a card that provides at least [R] enters play under your control, you may pay 1. If you do, pick a character and that character gains 1 strength this turn.
  BURN IT
  COST: Pay 2. Destroy this card.
  EFFECT: Draw 2 cards.
rules:
  - trigger: { on: enters_play, card: { controller: you, provides_at_least: { rage: 1 }, not_self: true } }
    effect:
      - may_pay:
          amount: 1
          prompt: "a character gains 1 strength this turn"
          then:
            - pick: { as: c, from: { character: any } }
            - modify: { card: c, stat: str, gain: 1 }
  - ability:
      name: Burn It
      cost: [ pay: 2, destroy: self ]
      effect: [ draw: 2 ]
