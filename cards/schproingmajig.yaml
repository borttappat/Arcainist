id: "schproingmajig"
name: "Schproingmajig"
trade: gearsmith
types: [character]
subtypes: ["majig"]
set: "1st Edition Part 2"
rarity: uncommon

cost: 6
threshold: { elitism: 2 }
stats: { str: 4, life: 4, spd: 2 }

text: |
  PUMP-UP
  COST: Deplete another character you control.
  EFFECT: This turn, this card gains 2 strength and 2 life.
  SCHPROING!
  COST: Destroy a character you control.
  EFFECT: This turn, this card cannot be blocked.
rules:
  - ability:
      name: Pump-Up
      cost:
        - pick: { as: c, from: { character: { controller: you, not_self: true, depleted: false } }, choose: true, prompt: "Deplete another character you control." }
        - deplete: c
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { str: 2, life: 2 } } ] }
  - ability:
      name: Schproing!
      cost:
        - destroy: { from: { character: { controller: you } }, choose: true }
      effect:
        - create_effect: { duration: turn, mods: [ { cannot_be_blocked: true } ] }
