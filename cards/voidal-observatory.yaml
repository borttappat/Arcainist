id: "voidal-observatory"
name: "Voidal Observatory"
trade: arcanist
types: [location]
set: "2nd Edition"
rarity: uncommon

cost: 2
threshold: { obsession: 2 }
structure: 5

text: |
  At the start of your turn, you may put a token on this card.
  ENERGIZE
  COST: Pay 2.
  EFFECT: Put a token on this card.
  STUDY
  COST: Remove 3 tokens from this card.
  EFFECT: Draw a card.
rules:
  - trigger: { on: start_of_turn, player: you }
    effect:
      - may: { prompt: "put a token on Voidal Observatory", steps: [ tokens: { card: self, add: 1 } ] }
  - ability:
      name: Energize
      cost: [ pay: 2 ]
      effect: [ tokens: { card: self, add: 1 } ]
  - ability:
      name: Study
      cost: [ tokens: { card: self, remove: 3 } ]
      effect: [ draw: 1 ]
