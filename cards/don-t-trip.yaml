id: "don-t-trip"
name: "Don't Trip"
trade: rogue
types: [tactic]
set: "Holy Heist"
rarity: common

cost: 3
threshold: { deception: 3 }
flip_up: { cost: 3, threshold: { deception: 1 } }

text: |
  EXTRA COST: Pick an attacking character.
  If the picked character would inflict battle damage, inflict that damage to itself instead.
  FLIP UP: 3 [D]
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { attacking: true } } }
      effect:
        - create_effect: { duration: turn, mods: [ { battle_damage_to_self: true, target: c } ] }
