id: "mr-chesterton"
name: "Mr. Chesterton"
trade: arcanist
types: [character]
subtypes: ["advisor", "couch"]
set: "Seed Saga"
rarity: uncommon
text: |
  EXTRA COST: Pick a tactic in a discard pile.
  While the picked card is in its owner's discard pile, this card gains COVERT.
rules:
  - play:
      cost:
        - pick: { as: t, from: { tactic: { zone: discard } } }
      effect:
        - remember: { picked: { var: t } }
  - static:
      while: { in_zone: [ picked, discard ] }
      mods: [ { keyword: covert } ]
