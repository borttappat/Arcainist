id: "research-intern"
name: "Research Intern"
trade: gearsmith
types: [character]
subtypes: ["31f"]
set: "Seed Saga"
rarity: common

cost: 3
threshold: { elitism: 1 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  RESEARCH
  COST: Deplete this card.
  EFFECT: Reduce the next numeric cost you pay this turn by 1.
  RESEARCH HARDER: [E][E][E][E][E]
  COST: Deplete this card.
  EFFECT: Reduce the next numeric cost you pay this turn by 2.
rules:
  - ability:
      name: Research
      cost: [ deplete: self ]
      effect:
        - create_effect: { duration: next, mods: [ { cost: -1, applies: any, by: you, target: all } ] }
  - ability:
      name: Research Harder
      threshold: { elitism: 5 }
      cost: [ deplete: self ]
      effect:
        - create_effect: { duration: next, mods: [ { cost: -2, applies: any, by: you, target: all } ] }
