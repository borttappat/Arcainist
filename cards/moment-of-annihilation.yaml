id: "moment-of-annihilation"
name: "Moment of Annihilation"
trade: rogue
types: [tactic]
set: "Ungodly Mess"
rarity: common
text: |
  EXTRA COST: You may remove up to 3 non-character cards in an opponent's discard pile from the game. If you do, reduce this card's numeric cost by the number of cards removed. Pick a character.
  If the character has 4 life or less, destroy it.
rules:
  - play:
      cost:
        - pick: { as: r, from: { card: { zone: discard, owner: opponent, not_type: character } }, count: 3, up_to: true, choose: true, prompt: "You may remove up to 3 non-character cards in an opponent's discard pile (each reduces the cost by 1)." }
        - void: r
        - create_effect: { duration: next, mods: [ { cost: { neg: { len: r } }, target: self } ] }
        - pick: { as: c, from: { character: any } }
      effect:
        - if:
            cond: { lte: [ { stat: [ c, life ] }, 4 ] }
            then: [ destroy: c ]
