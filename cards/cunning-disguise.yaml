id: "cunning-disguise"
name: "Cunning Disguise"
trade: rogue
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Seed Saga"
rarity: uncommon
text: |
  ATTACH TO CHARACTER
  The attached character loses 1 strength, 1 life, and gains COVERT.
  FLIP UP: 0 [D][D]
rules:
  - static:
      mods:
        - { stat: { str: -1, life: -1 }, target: host }
        - { keyword: covert, target: host }
  - flip_up: { pay: 0, threshold: { deception: 2 } }
