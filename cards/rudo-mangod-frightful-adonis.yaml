id: rudo-mangod-frightful-adonis
name: "Rudo Mangod"
trade: warlord
types: [character]
subtypes: [fighter]
set: "2nd Edition"
rarity: rare
text: |
  UNIQUE RUDOLPHUS
  PUNCH
  COST: Pay 2. Deplete this card. Pick a character. X is its strength. Y is this card's strength.
  EFFECT: Inflict X damage to this card. Inflict Y damage to the character.
rules:
  - unique: Rudolphus
  - ability:
      name: Punch
      cost:
        - pay: 2
        - deplete: self
        - pick: { as: c, from: { character: any } }
      effect:
        - let: { X: { stat: [ c, str ] }, Y: { stat: [ self, str ] } }
        - damage: { card: self, amount: X }
        - damage: { card: c, amount: Y }
