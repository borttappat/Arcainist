id: "severed-limb"
name: "Severed Limb"
trade: warlord
types: [item]
attach_to: character
subtypes: ["gear"]
set: "Ungodly Mess"
rarity: common
text: |
  ATTACH TO CHARACTER
  The attached character gains 1 strength.
  BULK UP
  COST: Pay 1. Destroy a card named "Rage" you own.
  EFFECT: This turn, the attached character gains 1 strength.
rules:
  - ability:
      name: Bulk Up
      cost:
        - pay: 1
        - destroy: { from: { card: { owner: you, name: Rage } }, choose: true }
      effect:
        - create_effect: { duration: turn, mods: [ { stat: { str: 1 }, target: host } ] }
