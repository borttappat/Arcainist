id: "i-got-the-gear"
name: "I Got the Gear!"
trade: gearsmith
types: [tactic]
set: "1st Edition"
rarity: uncommon

cost: 1
threshold: { elitism: 1 }

text: |
  You may search your deck for a gear card and reveal it. If you do, put it into your hand.
rules:
  - play:
      effect:
        - may:
            - search: { deck: you, for: { card: { subtype: gear } }, reveal: true, to: hand }
