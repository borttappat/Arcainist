id: "undevoted-gargantuan"
name: "Undevoted Gargantuan"
trade: arcanist
types: [character]
keywords: [covert]
subtypes: ["monstrosity"]
set: "Shade of the Devoured Emperor"
rarity: rare

cost: 5
threshold: { obsession: 4 }
stats: { str: 5, life: 5, spd: 3 }

text: |
  COVERT
  When this card enters play, each opponent may detach up to 3 resources from their faction.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - as:
          who: opponent
          steps:
            - pick: { as: r, from: { resource: { controller: you, spent: true } }, count: 3, up_to: true, choose: true, optional: true, prompt: "You may detach up to 3 resources from your faction." }
            - if:
                cond: { defined: r }
                then: [ detach: { card: r } ]
