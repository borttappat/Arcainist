id: "emissary-of-loot"
name: "Emissary of Loot"
trade: banker
types: [character]
subtypes: ["mau"]
set: "Seed Saga"
rarity: uncommon
text: |
  When a card that provides at least [G] enters play under your control, you may put a token on this card.
  DELIVER
  COST: Pay 1. Remove a token from this card. Pick a character.
  EFFECT: This turn, the character gains 2 life.
  SHORTCUT
  COST: Pay 1. Remove a token from this card.
  EFFECT: This turn, this card gains COVERT.
rules:
  - trigger: { on: enters_play, card: { controller: you, provides_at_least: { greed: 1 } } }
    effect:
      - may:
          prompt: "put a token on Emissary of Loot"
          steps: [ tokens: { card: self, add: 1 } ]
  - ability:
      name: Deliver
      cost:
        - pay: 1
        - tokens: { card: self, remove: 1 }
        - pick: { as: c, from: { character: any } }
      effect: [ modify: { card: c, stat: life, gain: 2 } ]
  - ability:
      name: Shortcut
      cost: [ pay: 1, tokens: { card: self, remove: 1 } ]
      effect:
        - create_effect: { duration: turn, mods: [ { keyword: covert } ] }
