id: "gosche-s-retained-earnings-vault"
name: "Gosche's Retained Earnings Vault"
trade: banker
types: [location]
set: "Ungodly Mess"
rarity: uncommon
text: |
  When a character you control with a token on it leaves play, your faction gains 2 influence.
  INVEST
  COST: Deplete this card. Pay 2. Pick a character you control.
  EFFECT: Put a token on that character.
rules:
  - trigger: { on: leaves_play, player: you, card: { character: any }, had_tokens: true }
    effect: [ gain_influence: { who: you, amount: 2 } ]
  - ability:
      name: Invest
      cost:
        - deplete: self
        - pay: 2
        - pick: { as: c, from: { character: { controller: you } } }
      effect: [ tokens: { card: c, add: 1 } ]
