id: port-manteau
name: "Port Manteau"
trade: banker
types: [location]
text: |
  When this card enters play, name a card subtype. Players must pay 2 to play cards with the named subtype.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - name: { as: sub, kind: subtype, remember: true }
  - static:
      while: { defined: sub }
      mods:
        - { cost: 2, by: any, target: { card: { subtype: sub, zone: stack } } }
