id: "dowsing-cleric"
name: "Dowsing Cleric"
trade: banker
types: [character]
subtypes: ["priest", "mau"]
set: "Seed Saga"
rarity: common

cost: 4
threshold: { greed: 1 }
stats: { str: 1, life: 2, spd: 3 }

text: |
  When this card enters or leaves play, you may search your deck for a staple resource, reveal it, and put it into your hand.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may:
          - search: { deck: you, for: { card: { staple: true } }, reveal: true, to: hand }
  - trigger: { on: leaves_play, card: self }
    effect:
      - may:
          - search: { deck: you, for: { card: { staple: true } }, reveal: true, to: hand }
