id: "padamose-cultists"
name: "Padamose Cultists"
trade: banker
types: [character]
subtypes: ["cultist"]
set: "Ungodly Mess"
rarity: common

cost: 2
threshold: { greed: 1 }
stats: { str: 2, life: 1, spd: 3 }

text: |
  When this card enters play, if you have deployed a non-character card this turn, draw 2 cards.
rules:
  - trigger: { on: enters_play, card: self, while: { gte: [ { played_this_turn: { by: you, not_type: character } }, 1 ] } }
    effect: [ draw: 2 ]
