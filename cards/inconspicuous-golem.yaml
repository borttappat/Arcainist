id: "inconspicuous-golem"
name: "Inconspicuous Golem"
trade: gearsmith
types: [character]
subtypes: ["golem"]
set: "Seed Saga"
rarity: common

cost: 2
threshold: { elitism: 1 }
stats: { str: 0, life: 4, spd: 3 }

text: |
  When this card enters play, you may pay 1. If you do, put a token on it.
  While there is a token on this card, it can block COVERT parties.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - may_pay:
          amount: 1
          prompt: "put a token on Inconspicuous Golem (it can block COVERT parties)"
          then: [ tokens: { card: self, add: 1 } ]
  - static:
      while: { gt: [ { tokens: self }, 0 ] }
      mods: [ { blocks_any: true } ]
