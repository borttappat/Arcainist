id: "mushroom-merchant"
name: "Mushroom Merchant"
trade: banker
types: [character]
subtypes: ["mau", "merchant"]
set: "Shade of the Devoured Emperor"
rarity: common
text: |
  When this card enters play, you may pick a character. If you do, this turn, that character gains 2 life.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ modify: { card: c, stat: life, gain: 2 } ]
