id: "dweedle-tee"
name: "Dweedle Tee"
trade: rogue
types: [character]
subtypes: ["clown"]
set: "Holy Heist"
rarity: uncommon
text: |
  This card gains 1 strength and 1 life for each token on it.
  BULGE: [V][V][V]
  COST: Pay 3 or shuffle your deck. Deplete this card.
  EFFECT: Reveal the top card of your deck. Put that card into your discard pile. Put tokens on this card equal to the threshold of the revealed card.
rules:
  - static:
      mods: [ { stat: { str: { tokens: self }, life: { tokens: self } } } ]
  - ability:
      name: Bulge
      threshold: { volition: 3 }
      cost:
        - choose_one:
            - { label: "Pay 3", steps: [ pay: 3 ] }
            - { label: "Shuffle your deck", steps: [ shuffle: you ] }
        - deplete: self
      effect:
        - let: { t: { card: top_of_you } }
        - if:
            cond: { defined: t }
            then:
              - reveal_top: { who: you, count: 1 }
              - let: { X: { threshold: t } }
              - move: { card: t, to: discard }
              - tokens: { card: self, add: X }
