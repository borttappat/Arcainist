id: quotidian-misfire
name: "Quotidian Misfire"
trade: arcanist
types: [tactic]
set: "2nd Edition"
rarity: uncommon
text: |
  This turn, if a card would be put into a player's hand, put it into their discard pile instead.
rules:
  - play:
      effect:
        - create_effect:
            duration: turn
            mods:
              - { redirect: { to: hand, instead: discard }, target: all }
