id: "twisted-cannoneer"
name: "Twisted Cannoneer"
trade: warlord
types: [character]
subtypes: ["tyrant"]
set: "Holy Heist"
rarity: uncommon

cost: 6
threshold: { rage: 1 }
stats: { str: 4, life: 4, spd: 3 }

text: |
  FIRE!
  COST: Use this only not during a battle. Pick a faction. Destroy a character you control. Pay 1.
  EFFECT: Inflict 1 damage to the faction.
rules:
  - ability:
      name: FIRE!
      timing: { not_in_battle: true }
      cost:
        - pick: { as: f, from: { faction: any } }
        - destroy: { from: { character: { controller: you } }, choose: true }
        - pay: 1
      effect: [ damage: { faction: { controller_of: f }, amount: 1 } ]
