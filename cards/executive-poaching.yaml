id: "executive-poaching"
name: "Executive Poaching"
trade: banker
types: [tactic]
set: "2nd Edition"
rarity: uncommon

cost: 5
threshold: { greed: 2 }

text: |
  Destroy the character an opponent controls with the highest numeric cost. If there is a tie, you decide which character is destroyed.
rules:
  - play:
      effect:
        - pick: { as: c, from: { character: { controller: opponent, costliest: true } }, choose: true }
        - destroy: c
