id: "torchlight-safehouse"
name: "Torchlight Safehouse"
trade: rogue
types: [location]
set: "Holy Heist"
rarity: rare

cost: 3
threshold: { deception: 3 }
structure: 5

text: |
  When this card is destroyed, your faction loses 3 influence.
  At the start of your turn, you may pick up to 3 characters you control. If you do, they gain COVERT this turn.
rules:
  - trigger: { on: destroyed, card: self }
    effect: [ lose_influence: { who: you, amount: 3 } ]
  - trigger: { on: start_of_turn, player: you }
    effect:
      - pick: { as: c, from: { character: { controller: you } }, count: 3, up_to: true, optional: true }
      - if:
          cond: { defined: c }
          then: [ create_effect: { duration: turn, mods: [ { keyword: covert, target: c } ] } ]
