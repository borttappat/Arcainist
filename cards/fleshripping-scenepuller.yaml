id: "fleshripping-scenepuller"
name: "Fleshripping Scenepuller"
trade: warlord
types: [character]
subtypes: ["fighter"]
set: "2nd Edition"
rarity: rare

cost: 4
threshold: { rage: 4 }
stats: { str: 4, life: 4, spd: 3 }

text: |
  When this card is blocked, this turn it gains 4 strength for each member in the opposing party.
rules:
  - trigger: { on: blocked, card: self }
    effect:
      - let: { n: { count: { character: { blocking: true } } } }
      - create_effect: { duration: turn, mods: [ { stat: { str: "4 * n" } } ] }
