id: "subsection-5-paragraph-12"
name: "Subsection 5, Paragraph 12"
trade: banker
types: [tactic]
set: "2nd Edition"
rarity: rare
text: |
  EXTRA COST: Your opponents cannot respond to this card. Deploy this only in response to an ability that's source was not a faction.
  Terminate the ability. It cannot be used again this turn. Draw a card.
rules:
  - play:
      no_response: true
      timing: { response_to: { ability: { card: { zone: any } } } }
      effect:
        - let: { a: { card: responded } }
        - terminate: responded
        - create_effect: { duration: turn, mods: [ { cannot: use_ability, target: a } ] }
        - draw: 1
