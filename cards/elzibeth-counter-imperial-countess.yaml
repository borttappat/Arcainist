id: "elzibeth-counter-imperial-countess"
name: "Elzibeth, Counter Imperial Countess"
trade: warlord
types: [character]
subtypes: ["sorceress"]
set: "Seed Saga"
rarity: uncommon

cost: 4
threshold: { rage: 3 }
stats: { str: 2, life: 4, spd: 3 }

text: |
  UNIQUE ELZIBETH
  KEEP EM COMING
  COST: Pay 3. Deplete this card. Pick a character.
  EFFECT: If that character would be destroyed this turn, put it on the top of its owner's deck instead.
rules:
  - unique: Elzibeth
  - ability:
      name: Keep Em Coming
      cost:
        - pay: 3
        - deplete: self
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect:
            duration: turn
            rules:
              - replace: { event: destroy, card: c }
                instead: [ move: { card: c, to: deck_top } ]
