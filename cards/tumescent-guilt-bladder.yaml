id: "tumescent-guilt-bladder"
name: "Tumescent Guilt Bladder"
trade: arcanist
types: [item]
set: "Seed Saga"
rarity: rare
text: |
  At the end of your turn, put a token on this card. Your faction loses X influence, where X is the number of tokens on this card. You may play a resource.
  At the start of each turn, if there are at least 3 tokens on this card, an opponent takes control of it. Remove all tokens from this card.
rules:
  - trigger: { on: end_of_turn, player: you }
    effect:
      - tokens: { card: self, add: 1 }
      - lose_influence: { who: you, amount: { tokens: self } }
      - play_resource: { optional: true }
  # The tokens only reset with the control change; otherwise they never reach 3.
  - trigger: { on: start_of_turn, player: any, while: { gte: [ { tokens: self }, 3 ] } }
    effect:
      - if:
          cond: { gte: [ { tokens: self }, 3 ] }
          then:
            - take_control: { card: self, who: opponent }
            - tokens: { card: self, set: 0 }
