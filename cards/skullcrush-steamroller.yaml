id: "skullcrush-steamroller"
name: "Skullcrush Steamroller"
trade: warlord
types: [character]
subtypes: ["warmachine"]
set: "Shade of the Devoured Emperor"
rarity: uncommon
text: |
  This card cannot be restored by your faction's RESTORE RULE.
  This card can attack only once each turn.
  ASSIST
  COST: Pay 2. Deplete a character you control.
  EFFECT: Restore this card.
rules:
  - static:
      mods:
        - { cannot: restore_by_rule }
        - { attack_limit: 1 }
  - ability:
      name: Assist
      cost:
        - pay: 2
        - pick: { as: c, from: { character: { controller: you, depleted: false } }, choose: true, prompt: "Deplete a character you control." }
        - deplete: c
      effect: [ restore: self ]
