id: "early-retirement"
name: "Early Retirement"
trade: rogue
types: [tactic]
set: "2nd Edition"
rarity: uncommon
text: |
  EXTRA COST: Pick a character you control. X is its strength. Destroy it.
  Draw X cards.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { controller: you } } }
        - let: { X: { stat: [ c, str ] } }
        - destroy: c
      effect: [ draw: X ]
