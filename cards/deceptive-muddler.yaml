id: deceptive-muddler
name: "Deceptive Muddler"
trade: arcanist
types: [character]
subtypes: [muddler]
text: |
  COVERT. If this card inflicts damage to a faction, your opponent must put a card from their hand on the top of their deck.
keywords: [covert]
rules:
  - trigger: { on: damage, source: self, faction: true }
    effect:
      - as:
          who: opponent
          steps:
            - pick: { as: c, from: { card: { zone: hand, owner: you } }, choose: true, prompt: "Deceptive Muddler: put a card from your hand on top of your deck." }
            - move: { card: c, to: deck_top, silent: true }
