id: "gang-leader"
name: "Gang Leader"
trade: rogue
types: [character]
subtypes: ["thief"]
set: "1st Edition Part 2"
rarity: common

cost: 3
threshold: { deception: 2 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  When this card enters play, all your characters gain 1 speed this turn.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - create_effect: { duration: turn, mods: [ { stat: { spd: 1 }, target: { character: { controller: you } } } ] }
