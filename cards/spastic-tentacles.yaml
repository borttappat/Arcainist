id: "spastic-tentacles"
name: "Spastic Tentacles"
trade: arcanist
types: [character]
subtypes: ["lurker"]
set: "1st Edition"
rarity: common

cost: 3
threshold: { obsession: 2 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  When this card enters play, each player puts a resource they control into its owner's hand.
rules:
  - trigger: { on: enters_play, card: self }
    effect:
      - each_player:
          - pick: { as: r, from: { resource: { controller: you } }, choose: true, prompt: "Put a resource you control into its owner's hand." }
          - if:
              cond: { defined: r }
              then: [ move: { card: r, to: hand } ]
