id: quotidian-transposition
name: "Quotidian Transposition"
trade: arcanist
types: [tactic]
cost: 0
threshold: { obsession: 3 }
text: |
  Each player picks a character they own and puts it into their hand.
rules:
  - play:
      effect:
        - each_player:
            - pick: { as: c, from: { character: { owner: you } } }
            - move: { card: c, to: hand }
