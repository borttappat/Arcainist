id: "obscure"
name: "Obscure"
trade: arcanist
types: [tactic]
set: "Seed Saga"
rarity: uncommon

cost: 0
threshold: { obsession: 1 }
flip_up: { cost: 2, threshold: { obsession: 1 } }

text: |
  EXTRA COST: Pick a character.
  This turn, the character gains COVERT.
  FLIP UP: 2 [O]
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: any } }
      effect:
        - create_effect: { duration: turn, mods: [ { keyword: covert, target: c } ] }
