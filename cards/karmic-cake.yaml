id: "karmic-cake"
name: "Karmic Cake"
trade: banker
types: [tactic]
set: "Seed Saga"
rarity: common

cost: 2
threshold: { greed: 1 }

text: |
  Search your deck for a resource and reveal it. Put it into your hand.
  RECUR: [G]
  COST: Use this only if this card is in your discard pile. Pay 2. Remove this card from the game.
  EFFECT: Search your deck for a staple resource and reveal it. Put it into your hand.
rules:
  - play:
      effect:
        - search: { deck: you, for: { resource: any }, reveal: true, to: hand }
  - ability:
      name: Recur
      threshold: { greed: 1 }
      from: discard
      cost: [ pay: 2, void: self ]
      effect:
        - search: { deck: you, for: { resource: { staple: true } }, reveal: true, to: hand }
