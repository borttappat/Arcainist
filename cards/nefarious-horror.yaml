id: "nefarious-horror"
name: "Nefarious Horror"
trade: arcanist
types: [character]
keywords: [covert]
subtypes: ["monstrosity"]
set: "Seed Saga"
rarity: uncommon

cost: 4
threshold: { obsession: 1 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  COVERT
  While an opponent controls more characters than you, this card gains 2 strength, 2 life, and loses COVERT.
rules:
  - static:
      while: { gt: [ { count: { character: { controller: opponent } } }, { count: { character: { controller: you } } } ] }
      mods:
        - { stat: { str: 2, life: 2 } }
        - { lose_keyword: covert }
