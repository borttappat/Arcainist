id: "luteoderm-goliath"
name: "Luteoderm Goliath"
trade: gearsmith
types: [item]
attach_to: character
subtypes: ["gear"]
set: "2nd Edition"
rarity: rare
text: |
  ATTACH TO CHARACTER
  The attached character gains 11 strength and 11 life.
  HANDOFF
  COST: Pay 6. Deplete a character you control that is not in a battle.
  EFFECT: Attach this card to the character.
rules:
  - ability:
      name: Handoff
      cost:
        - pay: 6
        - pick: { as: c, from: { character: { controller: you, attacking: false, blocking: false, depleted: false } }, choose: true, prompt: "Deplete a character you control that is not in a battle." }
        - deplete: c
      effect: [ attach: { card: self, to: c } ]
