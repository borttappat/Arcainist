id: "4p7-31f"
name: "4p7 31f"
trade: gearsmith
types: [character]
subtypes: ["31f"]
set: "2nd Edition"
rarity: uncommon

cost: 3
threshold: { elitism: 2 }
stats: { str: 2, life: 2, spd: 3 }

text: |
  When you deploy a gear card attached to this card, you may detach a resource from your faction.
  While a gear card is attached to this card, it gains 1 strength and 1 life.
rules:
  - trigger: { on: enters_play, card: { item: { subtype: gear, attached_to: self, controller: you } } }
    effect:
      - may:
          prompt: "detach a resource from your faction"
          steps: [ detach: { count: 1 } ]
  - static:
      while: { exists: { item: { subtype: gear, attached_to: self } } }
      mods: [ { stat: { str: 1, life: 1 } } ]
