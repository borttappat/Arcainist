id: "bloodcurdling-bulldozer"
name: "Bloodcurdling Bulldozer"
trade: warlord
types: [character]
subtypes: ["berserker"]
set: "2nd Edition"
rarity: common

cost: 3
threshold: { rage: 1 }
stats: { str: 2, life: 1, spd: 3 }

text: |
  When this card attacks, you may pick a character. If you do, deplete it.
rules:
  - trigger: { on: attacks, card: self }
    effect:
      - pick: { as: c, from: { character: any }, optional: true }
      - if:
          cond: { defined: c }
          then: [ deplete: c ]
