id: "drive-by-boobing"
name: "Drive By Boobing"
trade: rogue
types: [tactic]
set: "Shade of the Devoured Emperor"
rarity: common

cost: 3
threshold: { deception: 2 }

text: |
  EXTRA COST: Pick a character that inflicted damage to your faction this turn.
  Remove that character from the game.
rules:
  - play:
      cost:
        - pick: { as: c, from: { character: { damaged_faction: you } } }
      effect: [ void: c ]
