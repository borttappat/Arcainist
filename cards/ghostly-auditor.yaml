id: ghostly-auditor
name: "Ghostly Auditor"
trade: banker
types: [character]
subtypes: [lackey, ghost]
set: "2nd Edition"
rarity: rare
text: |
  While you control only 1 character, this card gains COVERT.
  When this card inflicts damage to a faction, draw 2 cards.
rules:
  - static:
      while: { eq: [ { count: { character: { controller: you } } }, 1 ] }
      mods: [ { keyword: covert } ]
  - trigger: { on: damage, source: self, faction: true }
    effect: [ draw: 2 ]
